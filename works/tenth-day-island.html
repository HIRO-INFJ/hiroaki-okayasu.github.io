:root {
  --bg: #0b0d1c;
  --panel: rgba(16, 20, 38, 0.9);
  --panel2: #1e2440;
  --line: #3a4466;
  --line2: #5a6a9a;
  --text: #efe6d2;
  --dim: #9a90ad;
  --flame: #ffc86a;
  --flame2: #ff7a3c;
  --hp: #e5534b;
  --block: #6fb7d9;
  --energy: #ffd45c;
  --good: #8fd16a;
  --purple: #b48be8;
  --atk: #b8544a;
  --skl: #4a78ae;
  --pow: #8e5fc6;
  --spc: #caa04a;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: 'DotGothic16', 'Hiragino Kaku Gothic ProN', monospace; }
body { overflow-x: hidden; user-select: none; -webkit-user-select: none; font-size: 15px; line-height: 1.5; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
#app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 12px env(safe-area-inset-bottom); }
.spr { image-rendering: pixelated; display: inline-block; vertical-align: middle; }
.dim { color: var(--dim); }
.small { font-size: 12px; }
.center { text-align: center; }
.mt { margin-top: 14px; }
h1, h2 { font-weight: normal; margin: 8px 0; }

/* ===== ボタン ===== */
.btn {
  font-family: inherit; font-size: 15px; color: var(--text);
  background: var(--panel2); border: 2px solid var(--line2);
  padding: 10px 16px; cursor: pointer; box-shadow: 0 3px 0 #000, inset 0 0 0 2px rgba(0,0,0,.3);
  transition: border-color .1s;
}
.btn:hover:not(:disabled) { border-color: var(--flame); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { border-color: var(--flame); color: var(--flame); }
.btn.small { font-size: 13px; padding: 5px 9px; }
.btn.focus { border-color: var(--flame); background: #342848; }

/* ===== タイトル ===== */
.title { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8vh 0 4vh; text-align: center; }
.title-logo h1 { font-size: 44px; line-height: 1.15; letter-spacing: 4px; color: #fff4d8; text-shadow: 0 0 16px rgba(255,180,80,.55), 3px 3px 0 #000; margin: 10px 0 0; }
.t-sub { color: var(--flame); font-size: 13px; letter-spacing: 2px; text-shadow: 2px 2px 0 #000; }
.title-menu { display: flex; flex-direction: column; gap: 12px; width: min(280px, 100%); margin-top: 20px; }
.title-ends { color: var(--energy); font-size: 13px; text-shadow: 1px 1px 0 #000; }
.title-warn { font-size: 12px; color: #ffcf8a; background: rgba(40,20,10,.85); border: 1px solid var(--flame2); padding: 6px 10px; margin-top: 12px; }
.title-foot { text-shadow: 1px 1px 0 #000; margin-top: 12px; }

.nightcard { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: fadein 1.2s; }
.nc-main { font-size: 34px; letter-spacing: 6px; text-shadow: 0 0 12px rgba(255,200,120,.5), 3px 3px 0 #000; }
.nc-sub { color: var(--dim); margin-top: 8px; text-shadow: 1px 1px 0 #000; }

/* ===== ステータスバー ===== */
.statusbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; margin: 8px 0 4px; background: var(--panel); border: 2px solid var(--line); flex-wrap: wrap; }
.sb-left { display: flex; gap: 12px; align-items: center; }
.sb-item { display: inline-flex; gap: 4px; align-items: center; }
.sb-lbl { font-size: 13px; color: #c9bfdc; }
.sb-shard { color: #bfe6f5; }
.shop-wallet { display: flex; gap: 6px; align-items: center; color: #bfe6f5; font-size: 15px; }
.relics { display: flex; gap: 4px; flex-wrap: wrap; }
.relic { font-family: inherit; font-size: 12px; width: 24px; height: 24px; padding: 0; background: #3a2d18; color: var(--energy); border: 2px solid var(--spc); cursor: pointer; }

/* ===== 場面 ===== */
.scene { flex: 1; display: flex; flex-direction: column; padding-bottom: 200px; }
.scene-place { font-size: 18px; color: var(--flame); text-shadow: 2px 2px 0 #000; margin: 10px 2px; }
.scene-stage { flex: 1; min-height: 180px; display: flex; align-items: flex-end; justify-content: center; gap: 12px; padding-bottom: 20px; }
.scene-stage.fire { flex: 0; min-height: 200px; align-items: center; }
.campfire { width: 48px; height: 48px; position: relative; }
.campfire::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 70%, #fff3b0 0 12%, #ffb347 13% 32%, #ff5a2a 33% 48%, transparent 50%); animation: flicker .25s infinite alternate; }
.rest-opts { display: flex; flex-direction: column; gap: 12px; margin: 16px auto; width: min(320px, 100%); }
.bob { animation: bob 2.4s ease-in-out infinite; }

/* ===== 会話 ===== */
#overlay { position: fixed; inset: 0; z-index: 30; display: none; justify-content: center; align-items: flex-end; padding: 0 10px calc(10px + env(safe-area-inset-bottom)); cursor: pointer; }
#overlay.show { display: flex; }
.dlg { pointer-events: auto; width: min(480px, 100%); min-height: 132px; background: #0a0c1a; border: 3px double var(--line2); padding: 12px; display: flex; gap: 10px; position: relative; cursor: pointer; box-shadow: 0 4px 0 #000; animation: fadein .2s; }
.dlg-portrait { flex: 0 0 56px; }
.dlg-portrait:empty { display: none; }
.dlg-portrait .spr { background: #1d1730; border: 2px solid var(--line); }
.dlg-body { flex: 1; min-width: 0; }
.dlg-name { color: var(--flame); font-size: 14px; min-height: 0; }
.dlg-name:empty { display: none; }
.dlg-text { font-size: 16px; white-space: pre-line; min-height: 48px; }
.dlg.narration .dlg-text { color: #d9d0f0; }
.dlg-next { position: absolute; right: 10px; bottom: 6px; color: var(--flame); animation: blink 1s infinite; font-size: 12px; }
.dlg-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.dlg-choices:empty { display: none; }
.choice { text-align: left; font-size: 14px; }

/* ===== モーダル ===== */
#modal { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(5,3,10,.78); align-items: center; justify-content: center; padding: 12px; }
#modal.show { display: flex; }
.modal-box { width: min(420px, 100%); max-height: 88vh; display: flex; flex-direction: column; background: #10142a; border: 3px double var(--line2); box-shadow: 0 6px 0 #000; animation: fadein .15s; }
.modal-box.wide { width: min(560px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 2px solid var(--line); gap: 8px; }
.modal-title { color: var(--flame); }
.modal-body { padding: 12px; overflow-y: auto; }
.help p { margin: 0 0 10px; font-size: 14px; }

/* ===== トースト・演出 ===== */
#toast { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; width: min(440px, 94vw); pointer-events: none; }
.toast { background: rgba(20,15,32,.95); border: 2px solid var(--line2); padding: 8px 12px; font-size: 13px; animation: drop .25s; transition: opacity .5s, transform .5s; }
.toast.toast-memory { border-color: var(--energy); color: #fff0c0; box-shadow: 0 0 12px rgba(255,212,92,.35); }
.toast.toast-item { border-color: var(--block); color: #d8f2ff; }
.toast.out { opacity: 0; transform: translateY(-8px); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 25; }
.fxtext { position: fixed; transform: translate(-50%, 0); font-size: 20px; text-shadow: 2px 2px 0 #000; animation: floatup 1s ease-out forwards; white-space: nowrap; }
.fxtext.dmg { color: #ff6b5b; font-size: 24px; }
.fxtext.blk { color: var(--block); }
.fxtext.lit { color: var(--energy); font-size: 16px; }
.fxtext.deb { color: var(--purple); font-size: 15px; }
.fxtext.spc { color: var(--energy); font-size: 17px; }
.fxtext.move { color: #fff; font-size: 14px; background: rgba(0,0,0,.6); padding: 2px 6px; }
#flash { position: fixed; inset: 0; z-index: 45; pointer-events: none; opacity: 0; }
#flash.go { animation: flashout 600ms ease-out; }

/* ===== 日記 ===== */
.journal { display: flex; flex-direction: column; gap: 8px; }
.j-sec { color: var(--flame); margin-top: 6px; border-bottom: 1px solid var(--line); }
.mem { padding: 4px 6px; }
.mem.known { background: rgba(255,212,92,.06); border-left: 3px solid var(--energy); }
.mem-t { font-size: 14px; }
.mem-d { font-size: 12.5px; white-space: pre-line; color: #d6cce6; }
.mem-d.dim { color: var(--dim); }
.goal-box { border: 2px solid var(--energy); padding: 8px; background: rgba(255,212,92,.07); }
.goal { font-size: 14px; margin-top: 3px; color: var(--dim); }
.goal.ok { color: var(--good); }

/* ===== エンディング ===== */
.ending { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 30px 0; animation: fadein 1.5s; }
.end-kind { color: var(--flame); letter-spacing: 3px; text-shadow: 2px 2px 0 #000; }
.ending h1 { font-size: 34px; color: #fff4d8; text-shadow: 0 0 14px rgba(255,200,120,.7), 3px 3px 0 #000; }
.end-sprites { display: flex; gap: 4px; }
.end-stats { background: rgba(12,9,20,.8); border: 2px solid var(--line); padding: 10px 18px; font-size: 14px; }
.end-hint { font-size: 13px; text-shadow: 1px 1px 0 #000; }

/* ===== アニメーション ===== */
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes flicker { from { transform: scale(1, 1); } to { transform: scale(1.08, .92); opacity: .85; } }
@keyframes pulse { 50% { box-shadow: 0 0 16px rgba(255,179,71,.55); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

<script>
// ===== js/util.js =====
// ===== 共通ユーティリティ・セーブ =====

const $ = (sel, root = document) => root.querySelector(sel);

// 小さなDOMビルダー: h('div', {class:'x', onclick:fn}, child, ...)
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'html') el.innerHTML = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function weighted(table) { // [[value, weight], ...]
  const total = table.reduce((s, t) => s + t[1], 0);
  let r = Math.random() * total;
  for (const [v, w] of table) { if ((r -= w) < 0) return v; }
  return table[table.length - 1][0];
}

// ===== セーブデータ =====
// ファイルを開く方法によっては保存できない（その場合もゲームは遊べる）
const STORAGE_OK = (() => {
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; }
})();
const SAVE_KEY = 'tenth-day-island-save-v1';
const Save = {
  data: null,
  fresh() {
    return { loops: 0, kws: {}, seen: {}, solved: {}, endings: {}, loop: null, playMs: 0, muted: false };
  },
  load() {
    try {
      const s = localStorage.getItem(SAVE_KEY);
      this.data = s ? Object.assign(this.fresh(), JSON.parse(s)) : null;
    } catch (e) { this.data = null; }
    return this.data;
  },
  write() {
    if (!this.data) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) {}
  },
  clear() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    this.data = null;
  },
};

// 実行中のゲーム状態への近道
const G = {
  get save() { return Save.data; },
  get L() { return Save.data && Save.data.loop; },
};

// プレイ時間の計測（表示中のみ）
setInterval(() => {
  if (Save.data && document.visibilityState === 'visible') { Save.data.playMs += 1000; }
}, 1000);

function formatTime(ms) {
  const m = Math.floor(ms / 60000);
  return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60}分` : `${m}分`;
}

// ===== js/audio.js =====
// ===== 効果音と環境音（WebAudioで生成。音声ファイルなし） =====

const Sound = {
  ctx: null,
  master: null,
  musicTimer: null,
  mood: 'night',

  get muted() { return !!(Save.data && Save.data.muted); },

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);
      this.startMusic();
    } catch (e) { this.ctx = null; }
  },

  tone(freq, dur = 0.1, type = 'square', vol = 0.06, slide = 0, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },

  noise(dur = 0.15, vol = 0.08, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    const g = this.ctx.createGain();
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1200;
    g.gain.value = vol;
    src.buffer = buf; src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },

  // ゆっくり鳴る環境音楽（ペンタトニックのランダムな音）
  startMusic() {
    const scales = {
      night: [220, 261.6, 293.7, 329.6, 392, 440, 523.3],
      dawn: [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3],
      tense: [196, 233.1, 261.6, 293.7, 349.2, 392],
    };
    let step = 0;
    this.musicTimer = setInterval(() => {
      if (!this.ctx || this.muted || document.visibilityState !== 'visible') return;
      const sc = scales[this.mood] || scales.night;
      step++;
      if (step % 8 === 0) this.tone(sc[0] / 2, 3.2, 'sine', 0.035);
      if (Math.random() < 0.45) this.tone(pick(sc), 1.6, 'triangle', 0.022);
    }, 520);
  },
};

function sfx(name) {
  const S = Sound;
  switch (name) {
    case 'card': S.tone(620, 0.05, 'square', 0.03); S.tone(930, 0.05, 'square', 0.02, 0, 0.03); break;
    case 'hit': S.noise(0.12, 0.12); S.tone(160, 0.12, 'sawtooth', 0.05, -80); break;
    case 'hurt': S.noise(0.2, 0.16); S.tone(110, 0.2, 'sawtooth', 0.07, -50); break;
    case 'block': S.tone(320, 0.1, 'triangle', 0.08, 80); break;
    case 'blocked': S.tone(900, 0.06, 'square', 0.03); S.tone(600, 0.08, 'triangle', 0.05, 0, 0.03); break;
    case 'light': S.tone(700, 0.12, 'sine', 0.06, 500); break;
    case 'debuff': S.tone(300, 0.18, 'square', 0.04, -150); break;
    case 'buff': S.tone(400, 0.15, 'square', 0.04, 300); break;
    case 'bell': [523, 784, 1046].forEach((f, i) => S.tone(f, 1.6, 'sine', 0.09 / (i + 1))); break;
    case 'kill': S.tone(400, 0.3, 'square', 0.05, -350); S.noise(0.3, 0.06); break;
    case 'buy': S.tone(880, 0.07, 'square', 0.04); S.tone(1320, 0.12, 'square', 0.04, 0, 0.07); break;
    case 'heal': [523, 659, 784].forEach((f, i) => S.tone(f, 0.2, 'sine', 0.06, 0, i * 0.08)); break;
    case 'learn': [392, 523, 659, 784, 1046].forEach((f, i) => S.tone(f, 0.4, 'sine', 0.05, 0, i * 0.09)); break;
    case 'win': [523, 659, 784, 1046].forEach((f, i) => S.tone(f, 0.25, 'square', 0.035, 0, i * 0.1)); break;
    case 'turn': S.tone(440, 0.08, 'triangle', 0.05); S.tone(660, 0.1, 'triangle', 0.05, 0, 0.08); break;
    case 'die': [392, 330, 262, 196].forEach((f, i) => S.tone(f, 0.5, 'triangle', 0.07, 0, i * 0.22)); break;
    case 'collapse': S.noise(1.6, 0.2); S.tone(60, 1.6, 'sawtooth', 0.08, -30); break;
    case 'select': S.tone(520, 0.04, 'square', 0.025); break;
    case 'deny': S.tone(180, 0.12, 'square', 0.05); break;
    case 'text': S.tone(900 + Math.random() * 200, 0.02, 'square', 0.012); break;
  }
}

  let rows = SPR[name], map = null;
  if (!rows && SWAP[name]) { rows = SPR[SWAP[name][0]]; map = SWAP[name][1]; }
  if (!rows) return '';
  const hgt = rows.length, wid = Math.max(...rows.map(r => r.length));

  cv.width = wid; cv.height = hgt;

  rows.forEach((r, y) => {

      let ch = r[x];
      if (map && map[ch]) ch = map[ch];
      const col = PAL[ch];
      if (!col) continue;
      cx.fillStyle = col;
      cx.fillRect(x, y, 1, 1);
    }
  });
  return (_sprCache[name] = cv.toDataURL());
}

function sprImg(name, px, cls = '') {
  const i = new Image();
  i.src = sprite(name);
  i.className = 'spr ' + cls;
  i.style.width = px + 'px';
  i.style.height = px + 'px';
  i.draggable = false;
  i.alt = '';
  return i;
}

// ===== 背景：空に浮かぶ島 =====
// time: 0朝 1昼 2夕 3夜 / day: 1〜10（日が進むほど島が傾き、ひびが増える）
const BG = {
  cv: null, cx: null, W: 180, H: 320, t: 0, stars: [], clouds: [],
  time: 3, day: 1, mode: 'normal', shake: 0,

  init() {
    this.cv = document.getElementById('bg');
    this.cx = this.cv.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
    const loop = () => { this.t++; if (this.t % 2 === 0) this.draw(); requestAnimationFrame(loop); };
    loop();
  },

  resize() {
    this.H = 240;
    this.W = Math.max(120, Math.round(240 * innerWidth / innerHeight));
    this.cv.width = this.W; this.cv.height = this.H;
    this.stars = Array.from({ length: Math.round(this.W * 0.5) }, () => ({ x: Math.random() * this.W, y: Math.random() * this.H * 0.8, p: Math.random() * 6.28 }));
    this.clouds = Array.from({ length: 6 }, (_, i) => ({ x: Math.random() * this.W, y: 20 + i * 34 + Math.random() * 10, w: 20 + Math.random() * 30, v: 0.05 + Math.random() * 0.1 }));
  },

  set(o) { Object.assign(this, o); },

  draw() {
    const { cx, W, H, t } = this;
    const skies = [
      ['#8fb8e8', '#f4c9a8', '#ffe2b8'], // 朝
      ['#4a8fd8', '#8cc4f0', '#cfe8ff'], // 昼
      ['#4a3f7a', '#e0706a', '#ffb070'], // 夕
      ['#070814', '#141a38', '#232a52'], // 夜
    ];
    let sky = skies[this.time] || skies[3];
    if (this.mode === 'title') sky = skies[3];
    if (this.mode === 'fall') sky = ['#1a0508', '#4a0e14', '#8a2a1a'];
    if (this.mode === 'dawn') sky = ['#6a9ae0', '#f4b890', '#ffe6b0'];
    if (this.day >= 10 && this.mode === 'normal' && this.time >= 2) sky = this.time === 2 ? ['#3a1f3a', '#c0443a', '#f08040'] : ['#0a0508', '#2a0c18', '#4a1420'];
    const sx = this.shake > 0 ? (Math.random() * 4 - 2) : 0;
    if (this.shake > 0) this.shake--;

    const g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, sky[0]); g.addColorStop(0.6, sky[1]); g.addColorStop(1, sky[2]);
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);

    const night = this.time === 3 || this.mode === 'title';
    if (night) {
      for (const s of this.stars) {
        const a = 0.3 + 0.7 * Math.abs(Math.sin(s.p + t * 0.02));
        cx.fillStyle = `rgba(255,245,220,${a * 0.8})`;
        cx.fillRect(Math.floor(s.x), Math.floor(s.y), 1, 1);
      }
    }
    // 雲
    for (const c of this.clouds) {
      c.x += c.v; if (c.x > W + 40) c.x = -40;
      cx.fillStyle = night ? 'rgba(80,90,130,.35)' : 'rgba(255,255,255,.55)';
      cx.fillRect(Math.floor(c.x), Math.floor(c.y), Math.floor(c.w), 3);
      cx.fillRect(Math.floor(c.x + 4), Math.floor(c.y - 2), Math.floor(c.w - 10), 2);
    }

    // 島（日が進むほど下がり、傾く）
    const drop = this.mode === 'fall' ? 16 + Math.min(180, (t - (this.fallT || 0)) * 0.5) : Math.max(0, this.day - 6) * 4;
    const bob = Math.sin(t * 0.03) * 1.5;
    const ix = Math.floor(W / 2) + sx, iy = Math.floor(H * (this.mode === 'title' ? 0.6 : 0.76) + drop + bob);
    const tilt = this.day >= 8 ? (this.day - 7) * 0.04 : 0;
    const land = night ? '#1c2a22' : '#3f7a4a', rock = night ? '#1a1620' : '#5a4a44', rock2 = night ? '#120f18' : '#3e3230';
    const half = 46;
    // 下側の岩（逆三角）
    for (let y = 0; y < 44; y++) {
      const w = Math.floor(half * (1 - y / 46));
      cx.fillStyle = y % 7 === 0 ? rock2 : rock;
      const off = Math.floor(tilt * (y - 10) * 6);
      cx.fillRect(ix - w + off, iy + y, w * 2, 1);
    }
    // 地面
    cx.fillStyle = land;
    for (let x = -half; x < half; x++) cx.fillRect(ix + x, iy - 2 + Math.floor(tilt * x), 1, 3);
    // 家々
    const houses = [[-36, 7], [-26, 9], [-15, 6], [12, 8], [22, 10], [33, 7]];
    for (const [hx, hh] of houses) {
      const by = iy - 2 + Math.floor(tilt * hx);
      cx.fillStyle = night ? '#2a2230' : '#d8c8b0';
      cx.fillRect(ix + hx, by - hh, 7, hh);
      cx.fillStyle = night ? '#1a1420' : '#b8483a';
      cx.fillRect(ix + hx - 1, by - hh - 2, 9, 2);
      cx.fillStyle = night ? '#ffc860' : '#5a6a8a';
      cx.fillRect(ix + hx + 2, by - hh + 2, 2, 2);
    }
    // 時計塔
    const ty = iy - 2;
    cx.fillStyle = night ? '#2a2432' : '#c8b8a0';
    cx.fillRect(ix - 4, ty - 34, 9, 34);
    cx.fillStyle = night ? '#1a1420' : '#6a4a3a';
    for (let i = 0; i < 6; i++) cx.fillRect(ix - 4 + i, ty - 40 + i, 9 - i * 2 > 0 ? 9 - i * 2 : 1, 1);
    cx.fillStyle = '#f6f1e4';
    this.circle(ix, ty - 26, 3);
    cx.fillStyle = '#1a1420';
    const ang = t * 0.01;
    cx.fillRect(ix, ty - 26, 1, 1);
    cx.fillRect(ix + Math.round(Math.cos(ang) * 2), ty - 26 + Math.round(Math.sin(ang) * 2), 1, 1);
    // 灯台（右端）
    cx.fillStyle = night ? '#e0e0f0' : '#f6f1e4';
    cx.fillRect(ix + 40, ty - 16 + Math.floor(tilt * 40), 4, 14);
    if (night) {
      const lg = cx.createRadialGradient(ix + 42, ty - 17, 1, ix + 42, ty - 17, 14);
      lg.addColorStop(0, 'rgba(255,230,140,.8)'); lg.addColorStop(1, 'rgba(255,230,140,0)');
      cx.fillStyle = lg; cx.fillRect(ix + 26, ty - 32, 32, 30);
    }
    // ひび（8日目以降）
    if (this.day >= 8) {
      cx.fillStyle = '#ff5a3a';
      const n = (this.day - 7) * 3;
      for (let i = 0; i < n; i++) {
        const x0 = ix - 30 + ((i * 23) % 60), y0 = iy + 4 + ((i * 7) % 20);
        for (let k = 0; k < 6; k++) cx.fillRect(x0 + k, y0 + ((k * 3 + i) % 4), 1, 1);
      }
    }
    // 島の心臓の光
    const hb = 0.4 + 0.3 * Math.sin(t * (this.day >= 8 ? 0.2 : 0.06));
    cx.fillStyle = `rgba(120,220,255,${hb})`;
    cx.fillRect(ix - 1, iy + 14, 3, 3);
  },

  circle(x, y, r) {
    for (let dy = -r; dy <= r; dy++) {
      const w = Math.floor(Math.sqrt(r * r - dy * dy));
      this.cx.fillRect(x - w, y + dy, w * 2 + 1, 1);
    }
  },
};

// 特別な日の予定。null はその時間に島にいない
function whereIs(who, d, s, L) {
  const f = L.flags;
  if (who === 'pino' && f.pinoWith) return L.loc;
  if (d === 10 && s === 3) {
    if (who === 'toki') return 'heart';
    if (f.evacuation) return null;
    if (who === 'feri') return null;
    if (who === 'mayor' && !f.gaveStaff) return null;
    if (who === 'gai' && !f.reconciled) return null;
  }
  if (d === 10 && s === 2) {
    if (f.evacuation && who !== 'toki') return 'dock';
    if (who === 'mayor' && !f.gaveStaff) return 'dock';
    if (who === 'gai' && !f.reconciled) return 'dock';
  }
  if (d === 3 && s === 3 && who === 'mayor') return 'clock';
  if (d === 5 && s === 1 && (who === 'johann' || who === 'pino')) return 'cliff';
  if (d === 6 && s === 2 && who === 'rita' && f.ritaInformed) return 'light';
  if (d === 9 && s === 2 && who === 'mayor') return 'hall';
  return BASE[who][s];
}

// 町長が真実を認める（ループごとに一度だけ選べる）
async function mayorConfess() {
  const Lp = L();
  if (Lp.flags.mayorDecided) {
    await say([['mayor', Lp.flags.evacuation ? '最終便に、島のみんなを乗せる。……10日目の夕方、船着き場へ' : '杖の飾りは君に預けた。……頼んだよ']]);
    return;
  }
  await say([
    ['haru', '島が落ちるのは、心臓のゼンマイが、百年目で尽きるからです'],
    ['mayor', '……！'],
    ['mayor', '……トキも、同じことを言っていた。わしは、それを……'],
    ['mayor', 'わしは怖かったんだ。島のみんなに言えば、大混乱になる。だから、自分だけ逃げようと……'],
    ['mayor', '……わしは、どうすればいい？'],
  ], true);
  const opts = ['「島のみんなを、最終便で避難させてください」'];
  if (has('three_pieces') || has('staff_piece')) opts.push('「その杖の飾りを、貸してください」');
  opts.push('「……少し考えさせてください」');
  const c = await choose(opts);
  const pickLabel = opts[c];
  if (pickLabel.includes('避難')) {
    await say([
      ['mayor', '……そうだな。それが、町長の仕事だ'],
      ['mayor', '10日目の夕方、最終便に島のみんなを乗せる。わしが説得してまわろう'],
      '《町長が島のみんなの避難を決めた》',
    ]);
    Lp.flags.evacuation = true;
    Lp.flags.mayorDecided = true;
    sfx('learn');
  } else if (pickLabel.includes('杖')) {
    await say([
      ['mayor', 'この杖の飾りが……鍵のかけら？'],
      ['mayor', '……わかった。逃げるのは、やめだ。島に残って、君を信じよう'],
      '《三つ葉のかけら（町長の杖）を受け取った》',
    ]);
    giveItem('pieceA');
    Lp.flags.gaveStaff = true;
    Lp.flags.mayorDecided = true;
  } else {
    await say([['mayor', '……わかった。決まったら、また来てくれたまえ']]);
  }
}

// ===== js/ui.js =====
// ===== 画面・会話・モーダルなどUIの共通部品 =====

let screenKeys = null; // 現在の画面のキーボード処理

function setScreen(el, keys = null) {
  const app = $('#app');
  app.innerHTML = '';
  app.appendChild(el);
  screenKeys = keys;
  $('#fx').innerHTML = '';
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (Dlg.active) { Dlg.key(e); return; }
  if (Modal.active) { Modal.key(e); return; }
  if (screenKeys) screenKeys(e);
});

// ===== 会話ウィンドウ =====
const Dlg = {
  active: false,
  el: null,
  _next: null,
  _typing: null,

  open() {
    const ov = $('#overlay');
    if (!this.el) {
      this.el = h('div', { class: 'dlg' },
        h('div', { class: 'dlg-portrait' }),
        h('div', { class: 'dlg-body' },
          h('div', { class: 'dlg-name' }),
          h('div', { class: 'dlg-text' }),
          h('div', { class: 'dlg-choices' })),
        h('div', { class: 'dlg-next' }, '▼'));
      ov.appendChild(this.el);
      // 会話中は画面のどこをクリック・タップしても進む（選択肢の表示中は進まない）
      ov.addEventListener('click', () => this.advance());
    }
    ov.classList.add('show');
    this.active = true;
  },

  close() {
    $('#overlay').classList.remove('show');
    this.active = false;
  },

  line(ln) {
    return new Promise(resolve => {
      const el = this.el;
      const who = Array.isArray(ln) ? WHO[ln[0]] : null;
      const text = Array.isArray(ln) ? ln[1] : ln;
      const por = el.querySelector('.dlg-portrait');
      por.innerHTML = '';
      if (who) por.appendChild(sprImg(who.spr, 56));
      el.classList.toggle('narration', !who);
      el.querySelector('.dlg-name').textContent = who ? (typeof who.name === 'function' ? who.name() : who.name) : '';
      el.querySelector('.dlg-choices').innerHTML = '';
      el.querySelector('.dlg-next').style.visibility = 'hidden';
      const tx = el.querySelector('.dlg-text');
      tx.textContent = '';
      let i = 0;
      const done = () => {
        clearInterval(this._typing); this._typing = null;
        tx.textContent = text;
        el.querySelector('.dlg-next').style.visibility = 'visible';
        this._next = () => { this._next = null; resolve(); };
      };
      this._next = done;
      this._typing = setInterval(() => {
        i++;
        tx.textContent = text.slice(0, i);
        if (i % 3 === 0 && who) sfx('text');
        if (i >= text.length) done();
      }, 28);
    });
  },

  advance() { if (this._next) this._next(); },

  key(e) {
    if (this._choiceKeys) { this._choiceKeys(e); return; }
    if (['Enter', ' ', 'z', 'Z'].includes(e.key)) { e.preventDefault(); this.advance(); }
  },
};

async function say(lines, keep = false) {
  Dlg.open();
  for (const ln of lines) await Dlg.line(ln);
  if (!keep) Dlg.close();
}

// 選択肢。opts: 文字列 or {label, disabled}
function choose(opts) {
  Dlg.open();
  return new Promise(resolve => {
    const box = Dlg.el.querySelector('.dlg-choices');
    Dlg.el.querySelector('.dlg-next').style.visibility = 'hidden';
    box.innerHTML = '';
    Dlg._next = null;
    const items = opts.map(o => (typeof o === 'string' ? { label: o } : o));
    let focus = items.findIndex(o => !o.disabled);
    const finish = i => {
      if (items[i].disabled) { sfx('deny'); return; }
      sfx('select');
      Dlg._choiceKeys = null;
      box.innerHTML = '';
      Dlg.close();
      resolve(i);
    };
    const btns = items.map((o, i) => {
      const b = h('button', { class: 'btn choice', disabled: o.disabled, onclick: ev => { ev.stopPropagation(); finish(i); } }, `${i + 1}. ${o.label}`);
      box.appendChild(b);
      return b;
    });
    const paint = () => btns.forEach((b, i) => b.classList.toggle('focus', i === focus));
    paint();
    Dlg._choiceKeys = e => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= items.length) finish(n - 1);
      else if (e.key === 'ArrowDown') { focus = (focus + 1) % items.length; paint(); }
      else if (e.key === 'ArrowUp') { focus = (focus - 1 + items.length) % items.length; paint(); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); finish(focus); }
    };
  });
}

// ===== モーダル =====
const Modal = {
  active: false,
  _close: null,
  open(title, content, { closable = true, wide = false } = {}) {
    return new Promise(resolve => {
      const root = $('#modal');
      root.innerHTML = '';
      const close = v => { root.classList.remove('show'); root.innerHTML = ''; this.active = false; this._close = null; resolve(v); };
      this._close = closable ? () => close(null) : null;
      const box = h('div', { class: 'modal-box' + (wide ? ' wide' : '') },
        h('div', { class: 'modal-head' }, h('div', { class: 'modal-title' }, title),
          closable ? h('button', { class: 'btn small', onclick: () => close(null) }, '閉じる') : null),
        h('div', { class: 'modal-body' }, typeof content === 'function' ? content(close) : content));
      root.appendChild(box);
      root.classList.add('show');
      this.active = true;
    });
  },
  key(e) { if (e.key === 'Escape' && this._close) this._close(); },
};

// ===== トースト =====
function toast(text, cls = '') {
  const t = h('div', { class: 'toast' + (cls ? ' toast-' + cls : '') }, text);
  $('#toast').appendChild(t);
  setTimeout(() => t.classList.add('out'), 2600);
  setTimeout(() => t.remove(), 3200);
}

function flash(color = '#fff', ms = 600) {
  const f = $('#flash');
  f.style.background = color;
  f.style.animationDuration = ms + 'ms';
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}

const L = () => Save.data.loop;
const has = id => !!(Save.data && Save.data.kws[id]);
const hasItem = id => !!(L() && L().items.includes(id));
const LOC_SHORT = { dock: '港', square: '広場', hall: '役場', bakery: 'パン', clock: '時計', school: '学校', church: '教会', light: '灯台', cliff: '崖', heart: '心臓' };

function learn(id) {
  if (!Save.data || Save.data.kws[id]) return false;
  Save.data.kws[id] = Save.data.loops;
  Save.write();
  sfx('learn');
  toast(`手帳に書きとめた：「${KW[id].t}」`, 'memory');
  // 推理できるようになったら知らせる
  for (const dd of DEDUCTIONS) {
    if (!has(dd.id) && dd.need.includes(id) && dd.need.every(has)) {
      setTimeout(() => toast(`手がかりがそろった。手帳で「${dd.title}」を推理できそうだ`, 'memory'), 700);
    }
  }
  return true;
}

function giveItem(id) {
  if (hasItem(id)) return;
  L().items.push(id);
  sfx('buy');
  toast(`手に入れた：${ITEMS[id]}`, 'item');
  Save.write();
}

function timeLabel(d, s) { return `${d}日目・${SLOT_JP[s]}`; }
function nextTime(d, s) { return s === 3 ? [d + 1, 0] : [d, s + 1]; }
function peopleAt(loc) {
  const Lp = L();
  return PEOPLE_ORDER.filter(p => whereIs(p, Lp.day, Lp.slot, Lp) === loc);
}

function recordSeen() {
  const Lp = L(), S = Save.data;
  const key = `${Lp.day}-${Lp.slot}`;
  for (const p of peopleAt(Lp.loc)) {
    if (p === 'pino' && Lp.flags.pinoWith) continue;
    (S.seen[p] = S.seen[p] || {})[key] = Lp.loc;
  }
}

// ===== ループの開始 =====
function newLoop() {
  const S = Save.data;
  S.loops++;
  S.loop = { day: 1, slot: 0, loc: 'dock', items: [], delivered: {}, flags: {}, done: {}, asked: {} };

async function loopIntro() {
  const S = Save.data;
  BG.set({ mode: 'normal', day: 1, time: 0 });
  Sound.mood = 'dawn';

async function nightCard(text, sub) {
  const el = h('div', { class: 'nightcard' }, h('div', { class: 'nc-main' }, text), sub ? h('div', { class: 'nc-sub' }, sub) : null);

// ===== 時間を進める =====
let busy = false;

async function goTo(loc) {
  if (busy) return;
  const Lp = L();
  if (Lp.day === 10 && Lp.slot === 3) return;
  const [d, s] = nextTime(Lp.day, Lp.slot);
  Lp.day = d; Lp.slot = s; Lp.loc = loc;
  sfx('select');
  await arrive();
}

async function waitHere(untilMorning = false) {
  if (busy) return;
  const Lp = L();
  if (untilMorning) {
    // 次の朝まで（途中の出来事はここでは起きない）
    Lp.day++; Lp.slot = 0;
  } else {
    [Lp.day, Lp.slot] = nextTime(Lp.day, Lp.slot);
  }
  sfx('turn');
  await arrive();
}

async function arrive() {
  busy = true;
  const Lp = L();
  BG.set({ day: Lp.day, time: Lp.slot, mode: 'normal' });
  Sound.mood = Lp.day >= 8 ? 'tense' : (Lp.slot === 3 ? 'night' : 'dawn');
  recordSeen();
  Save.write();
  renderScene();
  // 8日目：大揺れ
  if (Lp.day >= 8 && !Lp.done.quake) {
    Lp.done.quake = true;
    BG.shake = 50; sfx('collapse');
    await say(QUAKE);
  }
  const key = `${Lp.day}-${Lp.slot}-${Lp.loc}`;
  if (EVENTS[key] && !Lp.done[key]) {
    Lp.done[key] = true;
    await EVENTS[key]();
    Save.write();
  }
  if (Lp.day === 10 && Lp.slot === 2 && Lp.loc === 'dock') {
    const r = await ferryEvent();
    if (r) { busy = false; return endingSequence(r); }
  }
  if (Lp.day === 10 && Lp.slot === 3) {
    busy = false;
    return finalNight();
  }
  busy = false;
  renderScene();
}

// ===== 10日目の夕方：最終便 =====
async function ferryEvent() {
  const Lp = L();
  const evac = Lp.flags.evacuation;
  await say(evac
    ? ['船着き場は、島の人たちでいっぱいだ。', ['mayor', 'みんな、落ち着いて乗るんだ！ 荷物は最小限に！'], ['feri', '最終便、出るぞ！ 乗るなら今だ！']]
    : [['feri', '最終便、出るぞ！ 乗るなら今だ、配達員！']], true);
  const c = await choose(['船に乗る', '島に残る']);
  if (c !== 0) { await say([['feri', 'そうか。……達者でな！'], '最終便は、夕陽の中を島から離れていった。']); return null; }
  if (!has('fall')) {
    const n = Object.keys(Lp.delivered).length;
    if (n < 8) {
      await say([['feri', 'おいおい、配達がまだ残ってるだろ？ 仕事を放り出して帰る気か？'], ['haru', '（あと' + (8 - n) + '通、残ってる……）'], '最終便は、ハルを置いて出ていった。']);
      return null;
    }
    return 'e5';
  }
  return evac ? 'e2' : 'e1';
}

// ===== 10日目の夜 =====
async function finalNight() {
  const Lp = L();
  busy = true;
  renderScene();
  if (Lp.loc === 'heart') {
    const r = await heartFinal();
    busy = false;
    if (r) return endingSequence(r);
  } else if (Save.data.endings.e4 && has('loop_cause')) {
    await say(['10日目の夜。島の底から、低い音が響きはじめた。', ['haru', '（手紙を届けなければ……この十日間は、終わらない）']], true);
    const c = await choose(['「十日目の島へ」を、かばんの底にしまう', '……']);
    busy = false;
    if (c === 0) return endingSequence('e6');
  }
  busy = false;
  return fallSequence();
}

async function heartFinal() {
  const Lp = L();
  const pieces = ['pieceA', 'pieceB', 'pieceC'].filter(hasItem).length;
  const ready = pieces === 3 && Lp.flags.pinoWith && has('heir');
  await say(['10日目の夜。島の心臓。', '青い光が、今にも消えそうに明滅している。', ['toki', '……来たか。もう、ゼンマイが持たん']], true);
  if (ready) {
    if (Save.data.endings.e4 && has('loop_cause')) {
      const c = await choose(['「十日目の島へ」をピノに渡す', '手紙を、かばんの底にしまう']);
      return c === 0 ? 'e4' : 'e6';
    }
    await say([['haru', 'トキさん、鍵のかけらが三つそろいました。それに……'], ['pino', 'ぼくが、巻くんだよね'], ['toki', '……エルダの血筋か。頼んだぞ、坊主']]);
    return 'e4';
  }
  // 足りないものを知らせる
  const miss = [];
  if (pieces < 3) miss.push(`鍵のかけらが足りない（${pieces}/3）`);
  if (!has('heir')) miss.push('鍵を回せる人が誰なのか、わからない');
  else if (!Lp.flags.pinoWith) miss.push('ピノがここにいない');
  await say(miss.map(m => ['haru', `（${m}……）`]), true);
  if (has('manual_crank')) {
    const c = await choose(['トキに任せる', '……何もできない']);
    if (c === 0) return 'e3';
  }
  return null;
}

async function fallSequence() {
  busy = true;
  BG.set({ mode: 'fall', fallT: BG.t });
  BG.shake = 90;
  sfx('collapse');
  Sound.mood = 'tense';
  setScreen(h('div', { class: 'scene' }));
  await say(STORY.fall);
  if (!has('fall')) {
    await say(STORY.fallFirst);
    learn('fall');
  }
  flash('#fff', 1400);
  sfx('die');
  await sleep(900);
  newLoop();
  busy = false;
  await loopIntro();
}

// ===== 場面の描画 =====
function renderScene() {
  const Lp = L();
  const loc = LOCS[Lp.loc];
  const present = peopleAt(Lp.loc).filter(p => !(p === 'pino' && Lp.flags.pinoWith));
  const acts = [];
  if (Lp.loc === 'church' && Lp.slot === 3 && has('church_bell') && !hasItem('pieceC')) {
    acts.push(h('button', { class: 'btn', onclick: climbBell }, '鐘楼に登る'));
  }
  if (Lp.loc === 'heart') acts.push(h('button', { class: 'btn', onclick: inspectKeyhole }, '鍵穴を調べる'));
  const final = Lp.day === 10 && Lp.slot === 3;
  const left = 40 - ((Lp.day - 1) * 4 + Lp.slot) - 1;
  const el = h('div', { class: 'scene' },
    h('div', { class: 'topbar' },
      h('div', { class: 'tb-time' }, h('span', { class: 'tb-day' + (Lp.day >= 8 ? ' danger' : '') }, timeLabel(Lp.day, Lp.slot)), h('span', { class: 'dim small' }, `　残り${left}　第${Save.data.loops}周`)),
      h('div', { class: 'tb-btns' },
        h('button', { class: 'btn small', onclick: openBag }, 'かばん (B)'),
        h('button', { class: 'btn small primary', onclick: () => openNotebook() }, '手帳 (J)'))),
    timeline(),
    h('div', { class: 'place' },
      h('div', { class: 'place-name' }, loc.name),
      h('div', { class: 'place-desc' }, loc.desc[Lp.slot])),
    h('div', { class: 'people' },
      present.length ? present.map(p => h('button', { class: 'person', onclick: () => talkTo(p) },
        sprImg(PEOPLE[p].spr, 64, 'bob'),
        h('div', { class: 'p-name' }, PEOPLE[p].name),
        h('div', { class: 'p-role' }, PEOPLE[p].role),
        LETTERS[p] && !Lp.delivered[p] ? h('div', { class: 'p-mail', title: 'この人宛ての手紙がある' }, sprImg('i_letter', 14)) : null))
        : h('div', { class: 'nobody dim' }, 'いまは誰もいない。')),
    Lp.flags.pinoWith ? h('div', { class: 'companion' }, sprImg('pino', 28), h('span', { class: 'small dim' }, 'ピノが一緒にいる')) : null,
    h('div', { class: 'actions' },
      acts,
      h('button', { class: 'btn primary', disabled: final, onclick: openMap }, '移動する (M)'),
      h('div', { class: 'act-row' },
        h('button', { class: 'btn', disabled: final, onclick: () => waitHere() }, '待つ (W)'),
        h('button', { class: 'btn', disabled: final || Lp.day >= 10, onclick: () => waitHere(true) }, '眠る（次の朝まで）'))));
  setScreen(el, e => {
    if (busy) return;
    const k = e.key.toLowerCase();
    if (k === 'm') openMap();
    else if (k === 'w') waitHere();
    else if (k === 'j') openNotebook();
    else if (k === 'b') openBag();
    else {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= present.length) talkTo(present[n - 1]);
    }
  });
}

function timeline() {
  const Lp = L();
  const cur = (Lp.day - 1) * 4 + Lp.slot;
  return h('div', { class: 'timeline', title: '10日間の残り時間' },
    Array.from({ length: 10 }, (_, d) => h('div', { class: 'tl-day' + (d >= 7 ? ' late' : '') },
      Array.from({ length: 4 }, (_, s) => {
        const i = d * 4 + s;
        return h('span', { class: 'tl-pip' + (i < cur ? ' past' : i === cur ? ' now' : '') });
      }))));
}

// 見かけた記録から、その日時にいそうな場所を推測する
function guessWhere(p, d, s) {
  const rec = Save.data.seen[p];
  if (!rec) return null;
  if (rec[`${d}-${s}`]) return { loc: rec[`${d}-${s}`], exact: true };
  // 同じ時間帯で、いちばん近い日の記録
  for (let k = 1; k < 10; k++) {
    for (const dd of [d - k, d + k]) {
      const v = rec[`${dd}-${s}`];
      if (v && v !== 'heart') return { loc: v, exact: false };
    }
  }
  return null;
}

// ===== 移動（地図）=====
function openMap() {
  if (busy) return;
  const Lp = L();
  const [nd, ns] = nextTime(Lp.day, Lp.slot);
  const seen = Save.data.seen;
  const locs = LOC_ORDER.filter(l => l !== Lp.loc && (!LOCS[l].hidden || has('heart_access')));
  Modal.open(`移動する（着くのは ${timeLabel(nd, ns)}）`, close => h('div', {},
    h('div', { class: 'dim small mb' }, '移動すると時間がひとつ進む。顔は、その時間に見かけたことのある人（薄い顔は、別の日の同じ時間帯に見かけた場所）。'),
    h('div', { class: 'map-grid' }, locs.map(l => {
      const faces = PEOPLE_ORDER.map(p => ({ p, g: guessWhere(p, nd, ns) })).filter(x => x.g && x.g.loc === l);
      return h('button', { class: 'map-loc' + (l === 'heart' ? ' secret' : ''), onclick: () => { close(null); goTo(l); } },
        h('div', { class: 'ml-name' }, LOCS[l].name),
        h('div', { class: 'ml-faces' }, faces.length ? faces.map(x => sprImg(PEOPLE[x.p].spr, 22, x.g.exact ? '' : 'guess')) : h('span', { class: 'dim small' }, '—')));
    }))), { wide: true });
}

// ===== 会話 =====
async function talkTo(id) {
  if (busy) return;
  busy = true;
  const Lp = L();
  const T = TALK[id];
  const handled = T.talk ? await T.talk() : false;
  if (!handled) await say(T.greet(), true);
  for (;;) {
    const askable = Object.keys(T.ask || {}).filter(has);
    const opts = [];
    const acts = [];
    if (LETTERS[id] && !Lp.delivered[id]) { opts.push(`手紙を渡す（${LETTERS[id]}）`); acts.push({ t: 'letter' }); }
    for (const k of askable) {
      const asked = Lp.asked[id + ':' + k];
      opts.push(`${asked ? '✓ ' : ''}「${KW[k].t}」について聞く`);
      acts.push({ t: 'ask', k });
    }
    opts.push('またね');
    acts.push({ t: 'bye' });
    const c = await choose(opts);
    const a = acts[c];
    if (a.t === 'bye') break;
    if (a.t === 'letter') {
      Lp.delivered[id] = true;
      sfx('buy');
      await T.letter();
      const n = Object.keys(Lp.delivered).length;
      toast(`配達した（${n}/8）`, 'item');
    } else {
      Lp.asked[id + ':' + a.k] = true;
      await T.ask[a.k]();
    }
    Save.write();
    await say([[id, pick(['ほかに何か？', '……それで？', 'まだ何かあるかい？'])]], true);
  }
  Dlg.close();
  busy = false;
  Save.write();
  renderScene();
}

async function climbBell() {
  if (busy) return;
  busy = true;
  await say(['ノエに見守られて、きしむ梯子を登る。', '大きな鐘の内側。鐘の舌の根もとに、金色の金具が埋めこまれている。', '三つ葉の一枚の形をしている。', ['noe', '……本当に、あったのね。持っていって']]);
  giveItem('pieceC');
  busy = false;
  renderScene();
}

async function inspectKeyhole() {
  if (busy) return;

// ===== かばん =====
function openBag() {

    h('div', { class: 'j-sec' }, '宛先不明の手紙'),
    h('div', { class: 'bag-row special' },
      sprImg('i_letter', 24),
      h('div', {}, h('div', {}, '「十日目の島へ」'), h('div', { class: 'dim small' }, '差出人：エルダ　消印：百年前'),
        h('button', { class: 'btn small mt-s', onclick: async () => {
          close(null);
          await say(['封を開けようとしてみる。', '……びくともしない。', '封の裏に、小さな字で「島守の血を引く者のみ開封のこと」とある。']);
          learn('letter_seal');
        } }, '開けてみる'))),
    Lp.items.length ? h('div', { class: 'j-sec' }, '持ち物（この周だけ）') : null,
    Lp.items.map(it => h('div', { class: 'bag-row' }, sprImg('i_key', 24), h('div', {}, ITEMS[it])))));
}

// ===== 手帳 =====
function openNotebook(tab = 'kw') {
  if (busy) return;
  Modal.open('手帳', close => {
    const body = h('div', {});
    const tabs = [['kw', 'キーワード'], ['deduce', '推理'], ['sched', '予定表'], ['end', 'エンディング']];
    const bar = h('div', { class: 'tabs' });
    const show = t => {
      bar.innerHTML = '';
      tabs.forEach(([id, label]) => bar.appendChild(h('button', { class: 'tab' + (id === t ? ' on' : ''), onclick: () => show(id) }, label)));
      body.innerHTML = '';
      body.appendChild(t === 'kw' ? kwTab() : t === 'deduce' ? deduceTab(() => show('deduce')) : t === 'sched' ? schedTab() : endTab(close));
    };
    show(tab);
    return h('div', {}, bar, body);
  }, { wide: true });
}

function kwTab() {
  const known = KW_ORDER.filter(has);
  return h('div', { class: 'journal' },
    h('div', { class: 'dim small' }, `キーワード ${known.length}/${KW_ORDER.length}　・　住人に「〇〇について聞く」ことができる`),
    known.length ? known.map(k => h('div', { class: 'mem known' + (KW[k].deduced ? ' deduced' : '') }, h('div', { class: 'mem-t' }, '◆ ' + KW[k].t), h('div', { class: 'mem-d' }, KW[k].d)))
      : h('div', { class: 'dim' }, 'まだ何も書かれていない。'),
    KW_ORDER.length - known.length ? h('div', { class: 'mem dim' }, `◇ まだ知らないこと ×${KW_ORDER.length - known.length}`) : null);
}

function deduceTab(refresh) {
  return h('div', { class: 'journal' },
    h('div', { class: 'dim small' }, '手がかりがそろうと推理できる。正しく推理すると、新しいキーワードになる。'),
    DEDUCTIONS.map(dd => {
      if (has(dd.id)) {
        return h('div', { class: 'deduce solved' }, h('div', { class: 'mem-t' }, '☑ ' + dd.title),
          h('div', { class: 'mem-d' }, dd.qs.map(q => q.q + '【' + q.opts[q.a] + '】' + q.tail).join('')));
      }
      const got = dd.need.filter(has);
      if (got.length < dd.need.length) {
        return h('div', { class: 'deduce locked' }, h('div', { class: 'mem-t' }, '☐ ' + dd.title),
          h('div', { class: 'mem-d dim' }, `手がかり ${got.length}/${dd.need.length}：` + dd.need.map(k => has(k) ? KW[k].t : '？？？').join('、')));
      }
      const sels = dd.qs.map(q => h('select', { class: 'sel' }, h('option', { value: '-1' }, '……'), q.opts.map((o, i) => h('option', { value: String(i) }, o))));
      return h('div', { class: 'deduce open' },
        h('div', { class: 'mem-t' }, '◎ ' + dd.title),
        h('div', { class: 'deduce-q' }, dd.qs.map((q, i) => h('span', {}, q.q, sels[i], q.tail))),
        h('button', { class: 'btn small primary mt-s', onclick: () => {
          const ok = dd.qs.every((q, i) => parseInt(sels[i].value, 10) === q.a);
          if (ok) { learn(dd.id); Save.data.solved[dd.id] = true; Save.write(); refresh(); }
          else { sfx('deny'); toast('……何かが違う気がする'); }
        } }, '推理する'));
    }));
}

function schedTab() {
  const seen = Save.data.seen;
  const wrap = h('div', {});
  const grid = h('div', {});
  let cur = PEOPLE_ORDER[0];
  const draw = () => {
    wrap.querySelectorAll('.who').forEach(b => b.classList.toggle('on', b.dataset.p === cur));
    grid.innerHTML = '';
    const s = seen[cur] || {};
    grid.appendChild(h('table', { class: 'sched' },
      h('tr', {}, h('th', {}, ''), SLOT_JP.map(t => h('th', {}, t))),
      Array.from({ length: 10 }, (_, d) => h('tr', {}, h('th', {}, `${d + 1}日`),
        [0, 1, 2, 3].map(sl => { const v = s[`${d + 1}-${sl}`]; return h('td', { class: v ? 'hit' : '' }, v ? LOC_SHORT[v] : '・'); })))));
  };
  wrap.appendChild(h('div', { class: 'dim small' }, '見かけた場所だけが記録される。住人はだいたい毎日同じ予定で動く。'));
  wrap.appendChild(h('div', { class: 'who-row' }, PEOPLE_ORDER.map(p => {
    const b = h('button', { class: 'who', onclick: () => { cur = p; draw(); } }, sprImg(PEOPLE[p].spr, 24), h('span', { class: 'small' }, PEOPLE[p].name));
    b.dataset.p = p;
    return b;
  })));
  wrap.appendChild(grid);
  draw();
  return wrap;
}

function endTab(close) {
  const E = Save.data.endings;
  return h('div', { class: 'journal' },
    ENDINGS.map(e => h('div', { class: 'mem' + (E[e.id] ? ' known' : '') },
      h('div', { class: 'mem-t' }, `${e.true ? '★' : '◆'} ${e.no}. ${E[e.id] ? e.name : '？？？'}${e.true ? '（真エンド）' : ''}`),
      h('div', { class: 'mem-d dim' }, 'ヒント：' + e.hint))),
    Save.data.loops >= 2 && L() ? h('div', { class: 'center mt' }, h('button', { class: 'btn small', onclick: async () => {
      if (!confirm('いまの周を終えて、1日目の朝に戻りますか？（覚えたことは残る）')) return;
      close(null);
      flash('#fff', 900);
      newLoop();
      await loopIntro();
    } }, '手紙を握りしめて目を閉じる（1日目の朝に戻る）')) : null);
}

// ===== エンディング =====
async function endingSequence(id) {
  busy = true;
  const S = Save.data;
  const e = ENDINGS.find(x => x.id === id);
  const first = !S.endings[id];
  S.endings[id] = true;
  Save.write();
  const scene = h('div', { class: 'scene' });
  setScreen(scene);
  if (id === 'e4') {
    BG.set({ mode: 'dawn' }); Sound.mood = 'dawn'; flash('#bfe8ff', 1600);
    await say(ENDING_TEXT.e4);
    BG.set({ mode: 'dawn', day: 1, time: 0 });
    await nightCard('11日目・朝', '');
    await say(ENDING_TEXT.e4epilogue);
    await credits();
  } else {
    if (id === 'e1' || id === 'e2') BG.set({ mode: 'normal', time: 3, day: 10 });
    if (id === 'e3') { BG.set({ mode: 'dawn' }); }
    if (id === 'e5') BG.set({ mode: 'normal', time: 2, day: 1 });
    await say(ENDING_TEXT[id]);
  }
  S.loop = null;
  S.afterEnd = true;
  Save.write();
  busy = false;
  const got = ENDINGS.filter(x => S.endings[x.id]).length;
  return new Promise(resolve => {
    const el = h('div', { class: 'ending' },
      h('div', { class: 'end-kind' }, e.true ? '★ 真エンド' : `エンディング ${e.no}`),
      h('h1', {}, e.name),
      first ? h('div', { class: 'end-new' }, 'NEW') : null,
      h('div', { class: 'end-stats' },
        h('div', {}, `くり返した周：${S.loops}`),
        h('div', {}, `キーワード：${KW_ORDER.filter(has).length}/${KW_ORDER.length}`),
        h('div', {}, `エンディング：${got}/${ENDINGS.length}`),
        h('div', {}, `プレイ時間：${formatTime(S.playMs)}`)),
      !S.endings.e4 ? h('div', { class: 'end-hint' }, 'まだ、届いていない手紙がある。') : got < ENDINGS.length ? h('div', { class: 'end-hint' }, 'ほかの結末も、どこかにある。') : h('div', { class: 'end-hint' }, 'すべての結末を見届けた。あそんでくれて、ありがとう。'),
      h('div', { class: 'title-menu' },
        h('button', { class: 'btn primary', onclick: async () => { newLoop(); await loopIntro(); resolve(); } }, 'もう一度、1日目の朝から'),
        h('button', { class: 'btn', onclick: () => { resolve(); titleScreen(); } }, 'タイトルへ')));
    setScreen(el);
  });
}

async function credits() {
  const lines = ['十日目に、島は落ちる', '', '— 登場人物 —', 'ハル　郵便配達見習い', 'ピノ　孤児の男の子', 'トキ　時計職人', 'マレ　町長', 'リタとガイ　パン屋と灯台守', 'ノエ　シスター', 'ヨハン　学校の先生', 'フェリ　定期船の船長', 'エルダ　島の創設者', '', '— おわり —'];
  const el = h('div', { class: 'credits' }, h('div', { class: 'cr-roll' }, lines.map(t => h('div', {}, t || ' '))));
  setScreen(el);
  await sleep(9000);
}

// ===== タイトル =====
function titleScreen() {
  BG.set({ mode: 'title', day: 1, time: 3 });
  Sound.mood = 'night';
  const S = Save.load();
  const cont = !!(S && S.loop);
  const E = (S && S.endings) || {};
  const el = h('div', { class: 'title' },
    h('div', { class: 'title-logo' },
      h('div', { class: 't-sub' }, '郵便配達見習いハルと、くり返す十日間'),
      h('h1', {}, '十日目に、', h('br'), '島は落ちる')),
    h('div', { class: 'title-menu' },
      cont ? h('button', { class: 'btn primary', onclick: () => startGame(false) }, `つづきから（第${S.loops}周 ${timeLabel(S.loop.day, S.loop.slot)}）`) : null,
      S && !cont && S.loops > 0 ? h('button', { class: 'btn primary', onclick: () => startGame(false) }, 'つづきから（1日目の朝へ）') : null,
      h('button', { class: 'btn' + (S && S.loops > 0 ? '' : ' primary'), onclick: () => {
        if (S && S.loops > 0 && !confirm('手帳の記録をすべて消して、最初からはじめますか？')) return;
        startGame(true);
      } }, 'はじめから'),
      h('button', { class: 'btn', onclick: showHowTo }, 'あそびかた')),
    S && S.loops > 0 ? h('div', { class: 'title-ends' }, ENDINGS.map(e => (E[e.id] ? (e.true ? '★' : '◆') : '◇')).join(' '), h('span', { class: 'dim' }, `　エンディング ${ENDINGS.filter(e => E[e.id]).length}/${ENDINGS.length}`)) : null,
    STORAGE_OK ? null : h('div', { class: 'title-warn' }, '※ この開き方ではセーブできません。ページを閉じると進行が消えます。', h('br'), 'ChromeやSafariでファイルを開くと保存できます。'),
    h('div', { class: 'title-foot dim small' }, 'PC：クリック／キーボード　スマホ：タップ', h('br'), '目安プレイ時間 約1時間'));
  setScreen(el, e => { if (e.key === 'Enter') el.querySelector('.title-menu .btn').click(); });
}

function showHowTo() {
  Modal.open('あそびかた', h('div', { class: 'help' },
    h('p', {}, 'あなたは郵便配達見習いのハル。空に浮かぶ島で、10日間の配達をします。'),
    h('p', {}, '■ 「移動する」と時間がひとつ進みます（1日＝朝・昼・夕・夜）。場所の中で話すだけなら、時間は進みません。'),
    h('p', {}, '■ 住人はそれぞれ自分の予定で動いています。決まった日時に、決まった場所で、出来事が起こります。'),
    h('p', {}, '■ 10日目の夜が来ると……。そのとき、知ったことだけは手帳に残ります。'),
    h('p', {}, '■ 手帳のキーワードを使うと、住人に「〇〇について聞く」ことができます。手がかりがそろったら、手帳で推理しましょう。'),
    h('p', {}, '■ エンディングは6つ。★の真エンドを目指してください。'),
    h('p', {}, '■ キーボード：M 移動　W 待つ　J 手帳　B かばん　1〜8 その場の人と話す')));
}

async function startGame(fresh) {
  Sound.init();
  if (fresh || !Save.data) { Save.data = Save.fresh(); Save.write(); }
  if (!Save.data.loop) { newLoop(); await loopIntro(); return; }
  const Lp = L();
  BG.set({ mode: 'normal', day: Lp.day, time: Lp.slot });
  renderScene();
  if (Lp.day === 10 && Lp.slot === 3) finalNight();
}

// ===== 起動 =====
BG.init();
titleScreen();
document.addEventListener('pointerdown', () => Sound.init(), { once: true });
document.addEventListener('keydown', () => Sound.init(), { once: true });
