:root {
  --bg: #0e0b16;
  --panel: rgba(24, 19, 38, 0.92);
  --panel2: #251e36;
  --line: #3d3357;
  --line2: #5b4a80;
  --text: #efe6d2;
  --dim: #9a90ad;
  --flame: #ffb347;
  --flame2: #ff7a3c;
  --hp: #e5534b;
  --block: #6fb7d9;
  --energy: #ffd45c;
  --good: #8fd16a;
  --purple: #b48be8;
  --atk: #b8544a;
  --skl: #4a78ae;
  --pow: #8e5fc6;
  --spc: #caa04a;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: 'DotGothic16', 'Hiragino Kaku Gothic ProN', monospace; }
body { overflow-x: hidden; user-select: none; -webkit-user-select: none; font-size: 15px; line-height: 1.5; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
#app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 12px env(safe-area-inset-bottom); }
.spr { image-rendering: pixelated; display: inline-block; vertical-align: middle; }
.dim { color: var(--dim); }
.small { font-size: 12px; }
.center { text-align: center; }
.mt { margin-top: 14px; }
h1, h2 { font-weight: normal; margin: 8px 0; }

/* ===== ボタン ===== */
.btn {
  font-family: inherit; font-size: 15px; color: var(--text);
  background: var(--panel2); border: 2px solid var(--line2);
  padding: 10px 16px; cursor: pointer; box-shadow: 0 3px 0 #000, inset 0 0 0 2px rgba(0,0,0,.3);
  transition: border-color .1s;
}
.btn:hover:not(:disabled) { border-color: var(--flame); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { border-color: var(--flame); color: var(--flame); }
.btn.small { font-size: 13px; padding: 5px 9px; }
.btn.focus { border-color: var(--flame); background: #342848; }

/* ===== タイトル ===== */
.title { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8vh 0 4vh; text-align: center; }
.title-logo h1 { font-size: 44px; line-height: 1.15; letter-spacing: 4px; color: #fff4d8; text-shadow: 0 0 16px rgba(255,180,80,.55), 3px 3px 0 #000; margin: 10px 0 0; }
.t-sub { color: var(--flame); font-size: 13px; letter-spacing: 2px; text-shadow: 2px 2px 0 #000; }
.title-menu { display: flex; flex-direction: column; gap: 12px; width: min(280px, 100%); margin-top: 20px; }
.title-ends { color: var(--energy); font-size: 13px; text-shadow: 1px 1px 0 #000; }
.title-warn { font-size: 12px; color: #ffcf8a; background: rgba(40,20,10,.85); border: 1px solid var(--flame2); padding: 6px 10px; margin-top: 12px; }
.title-foot { text-shadow: 1px 1px 0 #000; margin-top: 12px; }

.nightcard { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: fadein 1.2s; }
.nc-main { font-size: 34px; letter-spacing: 6px; text-shadow: 0 0 12px rgba(255,200,120,.5), 3px 3px 0 #000; }
.nc-sub { color: var(--dim); margin-top: 8px; text-shadow: 1px 1px 0 #000; }

/* ===== ステータスバー ===== */
.statusbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; margin: 8px 0 4px; background: var(--panel); border: 2px solid var(--line); flex-wrap: wrap; }
.sb-left { display: flex; gap: 12px; align-items: center; }
.sb-item { display: inline-flex; gap: 4px; align-items: center; }
.sb-lbl { font-size: 13px; color: #c9bfdc; }
.sb-shard { color: #bfe6f5; }
.shop-wallet { display: flex; gap: 6px; align-items: center; color: #bfe6f5; font-size: 15px; }
.relics { display: flex; gap: 4px; flex-wrap: wrap; }
.relic-ico { font-family: inherit; font-size: 12px; width: 24px; height: 24px; padding: 0; background: #3a2d18; color: var(--energy); border: 2px solid var(--spc); cursor: pointer; }

/* ===== 場面 ===== */
.scene { flex: 1; display: flex; flex-direction: column; padding-bottom: 200px; }
.scene-place { font-size: 18px; color: var(--flame); text-shadow: 2px 2px 0 #000; margin: 10px 2px; }
.scene-stage { flex: 1; min-height: 180px; display: flex; align-items: flex-end; justify-content: center; gap: 12px; padding-bottom: 20px; }
.scene-stage.fire { flex: 0; min-height: 200px; align-items: center; }
.campfire { width: 48px; height: 48px; position: relative; }
.campfire::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 70%, #fff3b0 0 12%, #ffb347 13% 32%, #ff5a2a 33% 48%, transparent 50%); animation: flicker .25s infinite alternate; }
.rest-opts { display: flex; flex-direction: column; gap: 12px; margin: 16px auto; width: min(320px, 100%); }
.bob { animation: bob 2.4s ease-in-out infinite; }

/* ===== 会話 ===== */
#overlay { position: fixed; inset: 0; z-index: 30; display: none; justify-content: center; align-items: flex-end; padding: 0 10px calc(10px + env(safe-area-inset-bottom)); cursor: pointer; }
#overlay.show { display: flex; }
.dlg { pointer-events: auto; width: min(480px, 100%); min-height: 132px; background: rgba(12, 9, 20, .96); border: 3px double var(--line2); padding: 12px; display: flex; gap: 10px; position: relative; cursor: pointer; box-shadow: 0 4px 0 #000; animation: fadein .2s; }
.dlg-portrait { flex: 0 0 56px; }
.dlg-portrait:empty { display: none; }
.dlg-portrait .spr { background: #1d1730; border: 2px solid var(--line); }
.dlg-body { flex: 1; min-width: 0; }
.dlg-name { color: var(--flame); font-size: 14px; min-height: 0; }
.dlg-name:empty { display: none; }
.dlg-text { font-size: 16px; white-space: pre-line; min-height: 48px; }
.dlg.narration .dlg-text { color: #d9d0f0; }
.dlg-next { position: absolute; right: 10px; bottom: 6px; color: var(--flame); animation: blink 1s infinite; font-size: 12px; }
.dlg-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.dlg-choices:empty { display: none; }
.choice { text-align: left; font-size: 14px; }

/* ===== モーダル ===== */
#modal { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(5,3,10,.78); align-items: center; justify-content: center; padding: 12px; }
#modal.show { display: flex; }
.modal-box { width: min(420px, 100%); max-height: 88vh; display: flex; flex-direction: column; background: #151021; border: 3px double var(--line2); box-shadow: 0 6px 0 #000; animation: fadein .15s; }
.modal-box.wide { width: min(560px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 2px solid var(--line); gap: 8px; }
.modal-title { color: var(--flame); }
.modal-body { padding: 12px; overflow-y: auto; }
.help p { margin: 0 0 10px; font-size: 14px; }

/* ===== トースト・演出 ===== */
#toast { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; width: min(440px, 94vw); pointer-events: none; }
.toast { background: rgba(20,15,32,.95); border: 2px solid var(--line2); padding: 8px 12px; font-size: 13px; animation: drop .25s; transition: opacity .5s, transform .5s; }
.toast.toast-memory { border-color: var(--energy); color: #fff0c0; box-shadow: 0 0 12px rgba(255,212,92,.35); }
.toast.toast-relic { border-color: var(--spc); }
.toast.out { opacity: 0; transform: translateY(-8px); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 25; }
.fxtext { position: fixed; transform: translate(-50%, 0); font-size: 20px; text-shadow: 2px 2px 0 #000; animation: floatup 1s ease-out forwards; white-space: nowrap; }
.fxtext.dmg { color: #ff6b5b; font-size: 24px; }
.fxtext.blk { color: var(--block); }
.fxtext.lit { color: var(--energy); font-size: 16px; }
.fxtext.deb { color: var(--purple); font-size: 15px; }

/* ===== カード ===== */
.card {
  position: relative; flex: 0 0 auto; width: 84px; height: 118px; padding: 4px 5px;

}

.c-cost { position: absolute; top: -8px; left: -8px; width: 22px; height: 22px; border-radius: 50%; background: var(--energy); color: #2a1a00; font-size: 14px; display: flex; align-items: center; justify-content: center; border: 2px solid #000; }

.bt-info { min-height: 42px; padding: 4px 4px; font-size: 13px; text-shadow: 1px 1px 0 #000; }

.bt-hand { display: flex; justify-content: center; align-items: flex-end; min-height: 132px; padding: 10px 0 4px; }

/* ===== 報酬・店 ===== */

/* ===== 日記 ===== */

/* ===== エンディング ===== */
.ending { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 30px 0; animation: fadein 1.5s; }
.end-kind { color: var(--flame); letter-spacing: 3px; text-shadow: 2px 2px 0 #000; }
.ending h1 { font-size: 34px; color: #fff4d8; text-shadow: 0 0 14px rgba(255,200,120,.7), 3px 3px 0 #000; }
.end-sprites { display: flex; gap: 4px; }
.end-stats { background: rgba(12,9,20,.8); border: 2px solid var(--line); padding: 10px 18px; font-size: 14px; }

/* ===== アニメーション ===== */
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes flicker { from { transform: scale(1, 1); } to { transform: scale(1.08, .92); opacity: .85; } }
@keyframes pulse { 50% { box-shadow: 0 0 16px rgba(255,179,71,.55); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes lunge { 50% { transform: translateY(10px) scale(1.08); } }
@keyframes floatup { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -46px); } }
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } }
@keyframes flashout { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes glow { from { box-shadow: 0 0 6px #ffd98a; } to { box-shadow: 0 0 22px #fff2c0; } }

@media (max-width: 380px) {
  .card { width: 76px; height: 112px; }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}

<body>
<canvas id="bg"></canvas>
<div id="app"></div>
<div id="fx"></div>
<div id="modal"></div>
<div id="overlay"></div>
<div id="toast"></div>
<div id="flash"></div>

<script>
// ===== js/util.js =====
// ===== 共通ユーティリティ・セーブ =====

const $ = (sel, root = document) => root.querySelector(sel);

// 小さなDOMビルダー: h('div', {class:'x', onclick:fn}, child, ...)
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'html') el.innerHTML = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function weighted(table) { // [[value, weight], ...]
  const total = table.reduce((s, t) => s + t[1], 0);
  let r = Math.random() * total;
  for (const [v, w] of table) { if ((r -= w) < 0) return v; }
  return table[table.length - 1][0];
}

// ===== セーブデータ =====
// ファイルを開く方法によっては保存できない（その場合もゲームは遊べる）
const STORAGE_OK = (() => {
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; }
})();
const SAVE_KEY = 'dawn-tower-save-v1';
const Save = {
  data: null,
  fresh() {
    return { loop: 0, memories: {}, endings: {}, run: null, playMs: 0, nezBuys: 0, muted: false };
  },
  load() {
    try {
      const s = localStorage.getItem(SAVE_KEY);
      this.data = s ? Object.assign(this.fresh(), JSON.parse(s)) : null;
    } catch (e) { this.data = null; }
    return this.data;
  },
  write() {
    if (!this.data) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) {}
  },
  clear() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    this.data = null;
  },
};

// 実行中のゲーム状態への近道
const G = {
  get save() { return Save.data; },
  get run() { return Save.data && Save.data.run; },
};

// プレイ時間の計測（表示中のみ）
setInterval(() => {
  if (Save.data && document.visibilityState === 'visible') { Save.data.playMs += 1000; }
}, 1000);

function formatTime(ms) {
  const m = Math.floor(ms / 60000);
  return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60}分` : `${m}分`;
}

// ===== js/audio.js =====
// ===== 効果音と環境音（WebAudioで生成。音声ファイルなし） =====

const Sound = {
  ctx: null,
  master: null,
  musicTimer: null,
  mood: 'night',

  get muted() { return !!(Save.data && Save.data.muted); },

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);
      this.startMusic();
    } catch (e) { this.ctx = null; }
  },

  tone(freq, dur = 0.1, type = 'square', vol = 0.06, slide = 0, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },

  noise(dur = 0.15, vol = 0.08, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    const g = this.ctx.createGain();
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1200;
    g.gain.value = vol;
    src.buffer = buf; src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },

  // ゆっくり鳴る環境音楽（ペンタトニックのランダムな音）
  startMusic() {
    const scales = {
      night: [220, 261.6, 293.7, 329.6, 392, 440, 523.3],
      dawn: [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3],
      tense: [196, 233.1, 261.6, 293.7, 349.2, 392],
    };
    let step = 0;
    this.musicTimer = setInterval(() => {
      if (!this.ctx || this.muted || document.visibilityState !== 'visible') return;
      const sc = scales[this.mood] || scales.night;
      step++;
      if (step % 8 === 0) this.tone(sc[0] / 2, 3.2, 'sine', 0.035);
      if (Math.random() < 0.45) this.tone(pick(sc), 1.6, 'triangle', 0.022);
    }, 520);
  },
};

function sfx(name) {
  const S = Sound;
  switch (name) {
    case 'card': S.tone(620, 0.05, 'square', 0.03); S.tone(930, 0.05, 'square', 0.02, 0, 0.03); break;
    case 'hit': S.noise(0.12, 0.12); S.tone(160, 0.12, 'sawtooth', 0.05, -80); break;
    case 'hurt': S.noise(0.2, 0.16); S.tone(110, 0.2, 'sawtooth', 0.07, -50); break;
    case 'block': S.tone(320, 0.1, 'triangle', 0.08, 80); break;
    case 'blocked': S.tone(900, 0.06, 'square', 0.03); S.tone(600, 0.08, 'triangle', 0.05, 0, 0.03); break;
    case 'light': S.tone(700, 0.12, 'sine', 0.06, 500); break;
    case 'debuff': S.tone(300, 0.18, 'square', 0.04, -150); break;
    case 'buff': S.tone(400, 0.15, 'square', 0.04, 300); break;
    case 'bell': [523, 784, 1046].forEach((f, i) => S.tone(f, 1.6, 'sine', 0.09 / (i + 1))); break;
    case 'kill': S.tone(400, 0.3, 'square', 0.05, -350); S.noise(0.3, 0.06); break;
    case 'buy': S.tone(880, 0.07, 'square', 0.04); S.tone(1320, 0.12, 'square', 0.04, 0, 0.07); break;
    case 'heal': [523, 659, 784].forEach((f, i) => S.tone(f, 0.2, 'sine', 0.06, 0, i * 0.08)); break;
    case 'learn': [392, 523, 659, 784, 1046].forEach((f, i) => S.tone(f, 0.4, 'sine', 0.05, 0, i * 0.09)); break;
    case 'win': [523, 659, 784, 1046].forEach((f, i) => S.tone(f, 0.25, 'square', 0.035, 0, i * 0.1)); break;
    case 'turn': S.tone(440, 0.08, 'triangle', 0.05); S.tone(660, 0.1, 'triangle', 0.05, 0, 0.08); break;
    case 'die': [392, 330, 262, 196].forEach((f, i) => S.tone(f, 0.5, 'triangle', 0.07, 0, i * 0.22)); break;
    case 'collapse': S.noise(1.6, 0.2); S.tone(60, 1.6, 'sawtooth', 0.08, -30); break;
    case 'select': S.tone(520, 0.04, 'square', 0.025); break;
    case 'deny': S.tone(180, 0.12, 'square', 0.05); break;
    case 'text': S.tone(900 + Math.random() * 200, 0.02, 'square', 0.012); break;
  }
}

// ===== js/sprites.js =====
// ===== ドット絵（文字列で定義 → Canvasで描画してdataURL化） =====

const PAL = {
  k: '#140f1c', w: '#f4efe0', y: '#ffd45c', o: '#ff8a3c', r: '#d9483b', R: '#8c2a2a',
  b: '#3b5aa8', B: '#26305e', c: '#6fb7d9', g: '#8a95a5', d: '#4b5362', s: '#f2c29b', S: '#c98f6b',
  h: '#5a3a2a', H: '#8a5a3a', p: '#7a4fa0', P: '#4a2d66', n: '#241d33', m: '#3d3257', M: '#5b4a80',
  e: '#ff5c7a', l: '#8fd16a', L: '#4e8a3a', t: '#d9b066', T: '#8a6a3a', a: '#b8b0c8', z: '#e8e0ff',
};

const SPR = {
  yui: [
    '................',
    '.....kkkkkk.....',

// 既存スプライトの色だけ差し替えたもの
const SWAP = {
  echo: ['yui', { b: 'n', B: 'k', s: 'M', S: 'm', w: 'e', H: 'n', y: 'e', o: 'p' }],
  master: ['yui', { b: 'P', B: 'n', s: 'z', S: 'a', w: 'e', H: 'n', y: 'e', o: 'p' }],
  sentry: ['gard', { g: 'm', d: 'n', c: 'M', y: 'e', r: 'e' }],
  sentry2: ['gard', { g: 'R', d: 'n', c: 'r', y: 'y', r: 'y' }],
  shelfguard: ['gard', { g: 'T', d: 'h', c: 'p', y: 'e', r: 'w' }],
  moth2: ['moth', { m: 'p', n: 'P', e: 'y' }],
  hound: ['dog', { m: 'p', n: 'P', e: 'y' }],
};

const _sprCache = {};
function sprite(name) {
  if (_sprCache[name]) return _sprCache[name];
  let rows = SPR[name], map = null;
  if (!rows && SWAP[name]) { rows = SPR[SWAP[name][0]]; map = SWAP[name][1]; }
  if (!rows) return '';
  const hgt = rows.length, wid = Math.max(...rows.map(r => r.length));
  const cv = document.createElement('canvas');
  cv.width = wid; cv.height = hgt;
  const cx = cv.getContext('2d');
  rows.forEach((r, y) => {
    for (let x = 0; x < r.length; x++) {
      let ch = r[x];
      if (map && map[ch]) ch = map[ch];
      const col = PAL[ch];
      if (!col) continue;
      cx.fillStyle = col;
      cx.fillRect(x, y, 1, 1);
    }
  });
  return (_sprCache[name] = cv.toDataURL());
}

function sprImg(name, px, cls = '') {
  const i = new Image();
  i.src = sprite(name);
  i.className = 'spr ' + cls;
  i.style.width = px + 'px';
  i.style.height = px + 'px';
  i.draggable = false;
  i.alt = '';
  return i;
}

// ===== 背景（夜の塔）=====
const BG = {
  cv: null, cx: null, W: 180, H: 320, mode: 'night', t: 0, stars: [], windows: [], shake: 0,

  init() {
    this.cv = document.getElementById('bg');
    this.cx = this.cv.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
    const loop = () => { this.t++; if (this.t % 2 === 0) this.draw(); requestAnimationFrame(loop); };
    loop();
  },

  resize() {
    this.H = 240;
    this.W = Math.max(120, Math.round(240 * innerWidth / innerHeight));
    this.cv.width = this.W; this.cv.height = this.H;
    this.stars = Array.from({ length: Math.round(this.W * 0.5) }, () => ({
      x: Math.random() * this.W, y: Math.random() * this.H * 0.7, p: Math.random() * 6.28, b: Math.random() < 0.15,
    }));
    this.windows = [];
    for (let y = 60; y < 225; y += 13) {
      for (const dx of [-7, 0, 7]) { if (Math.random() < 0.55) this.windows.push({ dx, y, p: Math.random() * 6.28 }); }
    }
  },

  set(mode) { this.mode = mode; },

  draw() {
    const { cx, W, H, t } = this;
    const skies = {
      night: ['#07050e', '#1c1533', '#2e2150'],
      act0: ['#07050e', '#171230', '#2a2050'],
      act1: ['#0a0612', '#1f1230', '#3a1f4a'],
      act2: ['#0c050a', '#26101e', '#4a1a2c'],
      dark: ['#030206', '#0a0712', '#120c1e'],
      dawn: ['#3a4a8a', '#e38a6a', '#ffd49a'],
    };
    const sky = skies[this.mode] || skies.night;
    const dawn = this.mode === 'dawn';
    const sx = this.shake > 0 ? (Math.random() * 4 - 2) : 0;
    if (this.shake > 0) this.shake--;
    const g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, sky[0]); g.addColorStop(0.6, sky[1]); g.addColorStop(1, sky[2]);
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);

    // 星
    if (!dawn) {
      for (const s of this.stars) {
        const a = 0.35 + 0.65 * Math.abs(Math.sin(s.p + t * 0.02));
        cx.fillStyle = `rgba(255,245,220,${a * (s.b ? 1 : 0.6)})`;
        cx.fillRect(Math.floor(s.x), Math.floor(s.y), 1, 1);
      }
      // 月
      cx.fillStyle = '#efe6c8';
      this.circle(Math.floor(W * 0.82), 88, 9);
      cx.fillStyle = sky[0];
      this.circle(Math.floor(W * 0.82) + 4, 85, 8);
    } else {
      // 朝日
      const sg = cx.createRadialGradient(W / 2, H + 10, 4, W / 2, H + 10, 140);
      sg.addColorStop(0, 'rgba(255,240,190,1)'); sg.addColorStop(0.25, 'rgba(255,200,120,.6)'); sg.addColorStop(1, 'rgba(255,160,100,0)');
      cx.fillStyle = sg; cx.fillRect(0, 0, W, H);
    }

    // 塔
    const cxm = Math.floor(W / 2) + sx;
    const top = 38;
    cx.fillStyle = dawn ? '#3a2a40' : '#110c1b';
    for (let y = top; y < H; y++) {
      const half = Math.floor(10 + (y - top) * 0.045);
      cx.fillRect(cxm - half, y, half * 2, 1);
    }
    // 屋根と灯室
    cx.fillRect(cxm - 12, top - 4, 24, 4);
    cx.fillRect(cxm - 8, top - 14, 16, 10);
    for (let i = 0; i < 8; i++) cx.fillRect(cxm - 8 + i, top - 20 + i, 16 - i * 2, 1);
    // 石の段差
    cx.fillStyle = dawn ? '#4a3850' : '#1a1428';
    for (let y = top + 8; y < H; y += 26) {
      const half = Math.floor(10 + (y - top) * 0.045) + 1;
      cx.fillRect(cxm - half, y, half * 2, 2);
    }
    // 窓
    for (const w of this.windows) {
      const lit = Math.sin(w.p + t * 0.01) > -0.6;
      cx.fillStyle = lit ? (dawn ? '#ffe7b0' : '#ffc860') : '#2a2038';
      cx.fillRect(cxm + w.dx - 1, w.y, 2, 3);
    }
    // 大灯火
    const fl = 0.7 + 0.3 * Math.sin(t * 0.15) + Math.random() * 0.1;
    const fg = cx.createRadialGradient(cxm, top - 9, 1, cxm, top - 9, 26 * fl);
    fg.addColorStop(0, 'rgba(255,220,120,.9)'); fg.addColorStop(0.3, 'rgba(255,150,60,.35)'); fg.addColorStop(1, 'rgba(255,120,40,0)');
    cx.fillStyle = fg; cx.fillRect(cxm - 40, top - 40, 80, 70);
    cx.fillStyle = '#ffd45c'; cx.fillRect(cxm - 2, top - 11, 4, 4);
    cx.fillStyle = '#fff6d0'; cx.fillRect(cxm - 1, top - 10, 2, 2);

    // 手前の丘
    cx.fillStyle = dawn ? '#2a1e30' : '#07050c';
    for (let x = 0; x < W; x++) {
      const hh = 12 + Math.sin(x * 0.05) * 5 + Math.sin(x * 0.13 + 1) * 3;
      cx.fillRect(x, Math.floor(H - hh), 1, Math.ceil(hh));
    }
  },

  circle(x, y, r) {
    for (let dy = -r; dy <= r; dy++) {
      const w = Math.floor(Math.sqrt(r * r - dy * dy));
      this.cx.fillRect(x - w, y + dy, w * 2, 1);
    }
  },
};

const REWARD_POOL = {
  common: Object.keys(CARDS).filter(k => CARDS[k].rar === 'common'),
  uncommon: Object.keys(CARDS).filter(k => CARDS[k].rar === 'uncommon'),
  rare: Object.keys(CARDS).filter(k => CARDS[k].rar === 'rare'),
};
const LIGHT_CARDS = ['oil', 'illum', 'lightwall', 'torch', 'spark', 'wick', 'blaze', 'arrow', 'scorch', 'ember'];

function rollCards(n, kind) {
  const w = kind === 'boss' ? [['uncommon', 50], ['rare', 50]]
    : kind === 'elite' ? [['common', 45], ['uncommon', 40], ['rare', 15]]
    : kind === 'rare' ? [['uncommon', 60], ['rare', 40]]
    : [['common', 60], ['uncommon', 33], ['rare', 7]];
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 100) {
    const id = pick(REWARD_POOL[weighted(w)]);
    if (!out.includes(id)) out.push(id);
  }
  return out;
}

let screenKeys = null; // 現在の画面のキーボード処理

function setScreen(el, keys = null) {
  const app = $('#app');
  app.innerHTML = '';
  app.appendChild(el);
  screenKeys = keys;
  $('#fx').innerHTML = '';
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (Dlg.active) { Dlg.key(e); return; }
  if (Modal.active) { Modal.key(e); return; }
  if (screenKeys) screenKeys(e);
});

// ===== 会話ウィンドウ =====
const Dlg = {
  active: false,
  el: null,
  _next: null,
  _typing: null,

  open() {
    const ov = $('#overlay');
    if (!this.el) {
      this.el = h('div', { class: 'dlg' },
        h('div', { class: 'dlg-portrait' }),
        h('div', { class: 'dlg-body' },
          h('div', { class: 'dlg-name' }),
          h('div', { class: 'dlg-text' }),
          h('div', { class: 'dlg-choices' })),
        h('div', { class: 'dlg-next' }, '▼'));
      ov.appendChild(this.el);
      // 会話中は画面のどこをクリック・タップしても進む（選択肢の表示中は進まない）
      ov.addEventListener('click', () => this.advance());
    }
    ov.classList.add('show');
    this.active = true;
  },

  close() {
    $('#overlay').classList.remove('show');
    this.active = false;
  },

  line(ln) {
    return new Promise(resolve => {
      const el = this.el;
      const who = Array.isArray(ln) ? WHO[ln[0]] : null;
      const text = Array.isArray(ln) ? ln[1] : ln;
      const por = el.querySelector('.dlg-portrait');
      por.innerHTML = '';
      if (who) por.appendChild(sprImg(who.spr, 56));
      el.classList.toggle('narration', !who);
      el.querySelector('.dlg-name').textContent = who ? (typeof who.name === 'function' ? who.name() : who.name) : '';
      el.querySelector('.dlg-choices').innerHTML = '';
      el.querySelector('.dlg-next').style.visibility = 'hidden';
      const tx = el.querySelector('.dlg-text');
      tx.textContent = '';
      let i = 0;
      const done = () => {
        clearInterval(this._typing); this._typing = null;
        tx.textContent = text;
        el.querySelector('.dlg-next').style.visibility = 'visible';
        this._next = () => { this._next = null; resolve(); };
      };
      this._next = done;
      this._typing = setInterval(() => {
        i++;
        tx.textContent = text.slice(0, i);
        if (i % 3 === 0 && who) sfx('text');
        if (i >= text.length) done();
      }, 28);
    });
  },

  advance() { if (this._next) this._next(); },

  key(e) {
    if (this._choiceKeys) { this._choiceKeys(e); return; }
    if (['Enter', ' ', 'z', 'Z'].includes(e.key)) { e.preventDefault(); this.advance(); }
  },
};

async function say(lines, keep = false) {
  Dlg.open();
  for (const ln of lines) await Dlg.line(ln);
  if (!keep) Dlg.close();
}

// 選択肢。opts: 文字列 or {label, disabled}
function choose(opts) {
  Dlg.open();
  return new Promise(resolve => {
    const box = Dlg.el.querySelector('.dlg-choices');
    Dlg.el.querySelector('.dlg-next').style.visibility = 'hidden';
    box.innerHTML = '';
    Dlg._next = null;
    const items = opts.map(o => (typeof o === 'string' ? { label: o } : o));
    let focus = items.findIndex(o => !o.disabled);
    const finish = i => {
      if (items[i].disabled) { sfx('deny'); return; }
      sfx('select');
      Dlg._choiceKeys = null;
      box.innerHTML = '';
      Dlg.close();
      resolve(i);
    };
    const btns = items.map((o, i) => {
      const b = h('button', { class: 'btn choice', disabled: o.disabled, onclick: ev => { ev.stopPropagation(); finish(i); } }, `${i + 1}. ${o.label}`);
      box.appendChild(b);
      return b;
    });
    const paint = () => btns.forEach((b, i) => b.classList.toggle('focus', i === focus));
    paint();
    Dlg._choiceKeys = e => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= items.length) finish(n - 1);
      else if (e.key === 'ArrowDown') { focus = (focus + 1) % items.length; paint(); }
      else if (e.key === 'ArrowUp') { focus = (focus - 1 + items.length) % items.length; paint(); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); finish(focus); }
    };
  });
}

// ===== モーダル =====
const Modal = {
  active: false,
  _close: null,
  open(title, content, { closable = true, wide = false } = {}) {
    return new Promise(resolve => {
      const root = $('#modal');
      root.innerHTML = '';
      const close = v => { root.classList.remove('show'); root.innerHTML = ''; this.active = false; this._close = null; resolve(v); };
      this._close = closable ? () => close(null) : null;
      const box = h('div', { class: 'modal-box' + (wide ? ' wide' : '') },
        h('div', { class: 'modal-head' }, h('div', { class: 'modal-title' }, title),
          closable ? h('button', { class: 'btn small', onclick: () => close(null) }, '閉じる') : null),
        h('div', { class: 'modal-body' }, typeof content === 'function' ? content(close) : content));
      root.appendChild(box);
      root.classList.add('show');
      this.active = true;
    });
  },
  key(e) { if (e.key === 'Escape' && this._close) this._close(); },
};

}

function deckGrid(cards, onpick) {

// デッキからカードを1枚選ぶ。戻り値は run.deck のインデックス（キャンセルは-1）
async function pickDeckCard(title, filter) {
  const run = G.run;
  const idx = run.deck.map((c, i) => i).filter(i => filter(run.deck[i]));
  if (!idx.length) { await say(['選べるカードがない。']); return -1; }
  const r = await Modal.open(title, close => h('div', {},
    h('div', { class: 'deck-grid' }, idx.map(i => cardEl(run.deck[i], { onclick: () => close(i), cls: 'pickable' })))), { wide: true });
  return r == null ? -1 : r;
}

// 3枚から1枚選んでデッキに加える
async function cardChoice(ids, title = 'カードを1枚選ぶ') {
  const run = G.run;
  const r = await Modal.open(title, close => h('div', {},
    h('div', { class: 'deck-grid three' }, ids.map((id, i) => cardEl({ id }, { onclick: () => close(i), cls: 'pickable' }))),
    h('div', { class: 'center mt' }, h('button', { class: 'btn', onclick: () => close(-1) }, 'いらない'))), { closable: false });
  if (r != null && r >= 0) { run.deck.push({ id: ids[r] }); sfx('buy'); toast(`「${CARDS[ids[r]].name}」を手に入れた`); return ids[r]; }
  return null;
}

function showDeck() {
  const run = G.run;
  const sorted = run.deck.slice().sort((a, b) => a.id.localeCompare(b.id));
  Modal.open(`デッキ（${run.deck.length}枚）`, deckGrid(sorted), { wide: true });
}

// ===== ランの状態変化 =====
function heal(n) {
  const run = G.run;
  const before = run.hp;
  run.hp = Math.min(run.maxHp, run.hp + n);
  if (run.hp > before) sfx('heal');
}
function damageRun(n) {
  const run = G.run;
  run.hp = Math.max(1, run.hp - n);
  sfx('hurt');
}
function gainRelic(id) {
  const run = G.run;
  if (run.relics.includes(id)) return;
  run.relics.push(id);
  if (RELICS[id].onGain) RELICS[id].onGain(run);
  sfx('buy');
  toast(`お守り「${RELICS[id].name}」を手に入れた`, 'relic');
}
function learn(id) {
  if (!Save.data || Save.data.memories[id]) return false;
  Save.data.memories[id] = Save.data.loop;
  if (G.run) G.run.learnedThisRun = true;
  // 最大HPが増える記憶は即座に反映
  if ((id === 'm_hp' || id === 'm_hp2') && G.run) { G.run.maxHp += 6; G.run.hp += 6; }
  Save.write();
  sfx('learn');
  toast(`記憶が日記に刻まれた：「${MEM[id].t}」`, 'memory');
  return true;
}

  const d = ENEMIES[id];
  const hp = rnd(d.hp[0], d.hp[1]);
  const e = { id, d, i, name: d.name, hp, maxHp: hp, block: 0, st: Object.assign({}, d.start || {}), turn: 0, intent: null, dead: false };
  if (d.init) d.init(e);
  return e;
}

function startBattle(encIds, kind) {
  return new Promise(resolve => {
    const run = G.run;
    B = {
      kind, resolve, turn: 0, over: false, phase: 'start', sel: -1, tgt: 0, dawnGiven: false,
      p: { block: 0, energy: 0, light: 0, st: {} },
      enemies: encIds.map((id, i) => makeEnemy(id, i)),
      draw: shuffle(run.deck.map((c, i) => ({ id: c.id, up: !!c.up, uid: i }))),
      hand: [], discard: [], exhaust: [],
    };
    // 戦闘開始時の効果
    let light = 0;
    if (hasRelic('lantern')) light += 1;
    if (hasRelic('flint')) light += 2;
    if (hasRelic('almaring')) light += 1;
    if (hasMem('m_light')) light += 1;
    B.p.light = Math.min(LIGHT_MAX, light);
    if (hasRelic('gloves')) B.p.st.str = 1;
    // 「鐘の音」は最初の手札に来やすく（鐘守戦のみ）
    if (encIds.includes('bellkeeper')) {
      const bi = B.draw.findIndex(c => c.id === 'bell');
      if (bi >= 0) { const [c] = B.draw.splice(bi, 1); B.draw.push(c); }
    }
    B.enemies.forEach(chooseIntent);
    Sound.mood = kind === 'boss' ? 'tense' : 'night';
    buildBattleDOM();
    beginPlayerTurn();
  });
}

function alive() { return B.enemies.filter(e => !e.dead); }

function chooseIntent(e) {
  e.intent = e.d.ai(e);
  e.turn++;
}

function shadowNeed(e) {
  if (hasRelic('owl')) return 0;
  return Math.max(0, e.d.shadow - (hasMem('m_eyes') ? 1 : 0));
}

// ===== ダメージ計算 =====
function calcDmg(base, atkSt, defSt) {
  let d = base + (atkSt.str || 0);
  if (atkSt.weak) d = Math.floor(d * 0.75);
  if (defSt.vuln) d = Math.floor(d * 1.5);
  return Math.max(0, d);
}

// ===== カードから呼ばれるAPI =====
const api = {
  get p() { return B.p; },
  attack(t, n, hits = 1) {
    for (let k = 0; k < hits; k++) {
      if (!t || t.dead) { t = alive()[0]; if (!t) return; }
      let dmg = calcDmg(n, B.p.st, t.st);
      if (t.st.bellward) dmg = Math.min(dmg, 1);
      hitEnemy(t, dmg);
    }
  },
  attackAll(n) { alive().forEach(e => api.attack(e, n)); },
  gainBlock(n) { B.p.block += n; sfx('block'); fxText(meEl(), `+${n}`, 'blk'); },
  addLight(n) {
    const before = B.p.light;
    B.p.light = clamp(B.p.light + n, 0, LIGHT_MAX);
    if (B.p.light > before) { sfx('light'); fxText(meEl(), `灯+${B.p.light - before}`, 'lit'); }
  },
  drawCards(n) { drawCards(n); },
  gainEnergy(n) { B.p.energy += n; },
  debuff(t, key, n) { if (t && !t.dead) { t.st[key] = (t.st[key] || 0) + n; sfx('debuff'); fxText(enEl(t), `${STATUS_JP[key]}${n}`, 'deb'); } },
  debuffAll(key, n) { alive().forEach(e => api.debuff(e, key, n)); },
  power(key, n) { B.p.st[key] = (B.p.st[key] || 0) + n; sfx('buff'); },
  removeBellward() {
    sfx('bell');
    alive().forEach(e => { if (e.st.bellward) { delete e.st.bellward; fxText(enEl(e), '加護が消えた！', 'spc'); } });
  },
  triggerDawn() { finishBattle('true'); },
};

function hitEnemy(e, dmg) {
  const blocked = Math.min(e.block, dmg);
  e.block -= blocked;
  const rest = dmg - blocked;
  e.hp -= rest;
  e.hitAt = Date.now();
  const el = enEl(e);
  if (rest > 0) { sfx('hit'); fxText(el, String(rest), 'dmg'); }
  else { sfx('blocked'); fxText(el, blocked ? '防がれた' : '0', 'blk'); }
  // 真エンドの条件がそろっていれば、塔の主は倒れない
  if (e.id === 'master' && trueReady() && e.hp < 1) e.hp = 1;
  if (e.hp <= 0) { e.hp = 0; e.dead = true; sfx('kill'); }
}

function hitPlayer(dmg) {
  const p = B.p, run = G.run;
  const blocked = Math.min(p.block, dmg);
  p.block -= blocked;
  const rest = dmg - blocked;
  run.hp = Math.max(0, run.hp - rest);
  if (rest > 0) { sfx('hurt'); fxText(meEl(), String(rest), 'dmg'); B.hurtAt = Date.now(); }
  else { sfx('blocked'); fxText(meEl(), '防いだ', 'blk'); }
}

function drawCards(n) {
  for (let k = 0; k < n; k++) {
    if (B.hand.length >= 10) return;
    if (!B.draw.length) {
      if (!B.discard.length) return;
      B.draw = shuffle(B.discard);
      B.discard = [];
    }
    B.hand.push(B.draw.pop());
  }
}

// ===== ターン進行 =====
async function beginPlayerTurn() {
  if (B.over) return;
  B.turn++;
  const p = B.p, run = G.run;
  p.block = 0;
  if (B.turn === 1) {
    if (hasRelic('armor')) p.block += 8;
    if (run.flags.gardAlly) p.block += 6;
  }
  p.energy = 3 + (p.st.nextEnergy || 0) + (B.turn === 1 && hasRelic('hourglass') ? 1 : 0);
  delete p.st.nextEnergy;
  if (p.st.wick) p.light = Math.min(LIGHT_MAX, p.light + p.st.wick);
  if (p.st.undying) p.st.str = (p.st.str || 0) + p.st.undying;
  drawCards(5 + (B.turn === 1 && hasRelic('silverring') ? 2 : 0));
  B.phase = 'player';
  B.sel = -1;
  if (B.turn > 1) sfx('turn');
  renderBattle();
  await checkDawn();
}

async function checkDawn() {
  if (B.dawnGiven || B.over || !trueReady()) return;
  const m = B.enemies.find(e => e.id === 'master' && !e.dead);
  if (!m || m.hp >= m.maxHp / 2) return; // HPが半分を下回ったら「夜明け」
  B.dawnGiven = true;
  B.phase = 'busy';
  await say(STORY.masterHold.concat(STORY.dawnCard));
  B.hand.push({ id: 'dawn', up: false, uid: 999 });
  B.phase = 'player';
  sfx('learn');
  renderBattle();
}

async function playCard(hi, target) {
  if (B.phase !== 'player' || B.over) return;
  const c = B.hand[hi];
  if (!c) return;
  const d = CARDS[c.id];
  const cost = cardCost(c);
  if (cost > B.p.energy) { sfx('deny'); toast('エネルギーが足りない'); return; }
  if (d.need && B.p.light < d.need) { sfx('deny'); toast(`灯が${d.need}以上必要`); return; }
  B.p.energy -= cost;
  B.hand.splice(hi, 1);
  B.sel = -1;
  sfx('card');
  d.fx(api, c.up ? 1 : 0, target);
  if (d.type === 'atk' && B.p.st.flameBlade) api.addLight(B.p.st.flameBlade);
  if (d.exhaust) B.exhaust.push(c);
  else if (d.type !== 'pow' && c.id !== 'dawn') B.discard.push(c);
  if (B.over) return;
  if (!alive().length) { renderBattle(); await sleep(500); finishBattle('win'); return; }
  if (B.tgt >= 0 && B.enemies[B.tgt] && B.enemies[B.tgt].dead) B.tgt = B.enemies.findIndex(e => !e.dead);
  renderBattle();
  await checkDawn();
}

async function endTurn() {
  if (B.phase !== 'player' || B.over) return;
  B.phase = 'enemy';
  B.sel = -1;
  const p = B.p, run = G.run;
  if (p.st.ember && p.light >= 3) api.gainBlock(p.st.ember);
  B.discard.push(...B.hand);
  B.hand = [];
  decStatus(p.st);
  renderBattle();
  await sleep(350);
  for (const e of alive()) {
    if (B.over) return;
    e.block = 0;
    await enemyAct(e);
    if (run.hp <= 0) { await sleep(400); finishBattle('lose'); return; }
    decStatus(e.st);
    renderBattle();
    await sleep(380);
  }
  alive().forEach(chooseIntent);
  beginPlayerTurn();
}

function decStatus(st) {
  for (const k of ['weak', 'vuln']) { if (st[k]) { st[k]--; if (st[k] <= 0) delete st[k]; } }
}

async function enemyAct(e) {
  const m = e.d.moves[e.intent];
  const el = enEl(e);
  if (el) { el.classList.remove('act'); void el.offsetWidth; el.classList.add('act'); }
  fxText(el, m.name, 'move');
  await sleep(260);
  if (m.block) { e.block += m.block; sfx('block'); }
  if (m.str) { e.st.str = (e.st.str || 0) + m.str; sfx('buff'); }
  if (m.atk != null) {
    for (let k = 0; k < (m.hits || 1); k++) {
      hitPlayer(calcDmg(m.atk, e.st, B.p.st));
      renderBattle();
      if (G.run.hp <= 0) return;
      if (m.hits > 1) await sleep(180);
    }
  }
  if (m.drain) {
    const lost = Math.min(B.p.light, m.drain);
    B.p.light -= lost;
    if (lost) fxText(meEl(), `灯-${lost}`, 'deb');
  }
  if (m.weak) { B.p.st.weak = (B.p.st.weak || 0) + m.weak; sfx('debuff'); }
  if (m.vuln) { B.p.st.vuln = (B.p.st.vuln || 0) + m.vuln; sfx('debuff'); }
  renderBattle();
}

function finishBattle(result) {
  if (B.over) return;
  B.over = true;
  B.phase = 'over';
  screenKeys = null;
  if (result === 'win') sfx('win');
  const resolve = B.resolve;
  setTimeout(() => resolve(result), result === 'lose' ? 600 : 200);
}

// ===== 描画 =====
function meEl() { return $('#bt-me'); }
function enEl(e) { return $('#en-' + e.i); }

function buildBattleDOM() {
  const actName = ['石の階', '書の階', '時計の階'][G.run.act];
  const root = h('div', { class: 'battle' },
    h('div', { class: 'bt-top' },
      h('span', {}, `${actName}　`, h('span', { class: 'dim', id: 'bTurn' })),
      h('span', { class: 'bt-help' }, h('span', { class: 'sb-shard' }, sprImg('i_shard', 12), ` 欠片 ${G.run.shards}　`), h('button', { class: 'btn small', onclick: showBattleHelp }, '？'))),
    h('div', { class: 'bt-enemies', id: 'bEnemies' }),
    h('div', { class: 'bt-player', id: 'bPlayer' }),
    h('div', { class: 'bt-info', id: 'bInfo' }),
    h('div', { class: 'bt-hand', id: 'bHand' }),
    h('div', { class: 'bt-bottom', id: 'bBottom' }));
  setScreen(root, battleKeys);
}

function intentLabel(e) {
  const m = e.d.moves[e.intent];
  if (!m) return h('span', {}, '');
  if (B.p.light < shadowNeed(e)) {
    return h('div', { class: 'intent hidden', title: `灯が${shadowNeed(e)}以上あると見える` }, `？ 灯${shadowNeed(e)}で見える`);
  }
  const parts = [];
  if (m.atk != null) {
    const dmg = calcDmg(m.atk, e.st, B.p.st);
    parts.push(h('span', { class: 'i-atk' }, `攻${dmg}${m.hits > 1 ? '×' + m.hits : ''}`));
  }
  if (m.block) parts.push(h('span', { class: 'i-blk' }, '防'));
  if (m.str) parts.push(h('span', { class: 'i-buf' }, '強'));
  if (m.weak || m.vuln || m.drain) parts.push(h('span', { class: 'i-deb' }, m.drain ? '灯奪' : '妨'));
  return h('div', { class: 'intent', title: m.name }, parts);
}

function statusChips(st) {
  return h('div', { class: 'sts' }, Object.keys(st).filter(k => st[k]).map(k =>
    h('span', { class: 'st st-' + k, title: STATUS_TIP[k] || '' }, k === 'bellward' ? '鐘の加護' : `${STATUS_JP[k] || k}${st[k]}`)));
}

function renderBattle() {
  if (!B || !$('#bEnemies')) return;
  const run = G.run, p = B.p;
  $('#bTurn').textContent = `ターン${B.turn}`;
  const selCard = B.sel >= 0 ? B.hand[B.sel] : null;
  const targeting = selCard && CARDS[selCard.id].target;

  // 敵
  const ens = $('#bEnemies');
  ens.innerHTML = '';
  B.enemies.forEach((e, idx) => {
    if (e.dead) { ens.appendChild(h('div', { class: 'en dead', id: 'en-' + e.i })); return; }
    const size = e.d.boss ? 128 : e.d.elite ? 104 : 84;
    const recent = e.hitAt && Date.now() - e.hitAt < 300;
    const el = h('div', {
      class: `en${targeting ? ' targetable' : ''}${targeting && B.tgt === idx ? ' tgt' : ''}${recent ? ' hit' : ''}`,
      id: 'en-' + e.i,
      onclick: () => onEnemyClick(idx),
    },
      intentLabel(e),
      sprImg(e.d.spr, size, 'bob'),
      h('div', { class: 'en-name' }, e.name),
      hpBar(e.hp, e.maxHp, e.block),
      statusChips(e.st));
    ens.appendChild(el);
  });

  // プレイヤー
  const pl = $('#bPlayer');
  pl.innerHTML = '';
  const hurt = B.hurtAt && Date.now() - B.hurtAt < 300;
  const allies = h('div', { class: 'allies' },
    run.flags.gardAlly ? sprImg('gard', 32) : null,
    run.flags.mioWith && !run.flags.mioFree ? sprImg('mio', 28) : null);
  const lights = h('div', { class: 'lightbar', title: '灯：敵の行動を見たり、カードの力を引き出す' },
    h('span', { class: 'lb-num' }, `灯 ${p.light}`),
    h('span', { class: 'lb-pips' }, Array.from({ length: LIGHT_MAX }, (_, i) => sprImg(i < p.light ? 'i_flame' : 'i_flame_off', 12))));
  pl.appendChild(h('div', { class: 'me' + (hurt ? ' hit' : ''), id: 'bt-me' },
    h('div', { class: 'me-spr' }, sprImg('yui', 56), allies),
    h('div', { class: 'me-stat' },
      h('div', { class: 'me-row' }, h('span', { class: 'energy', title: 'エネルギー' }, `${p.energy}`), hpBar(run.hp, run.maxHp, p.block)),
      lights,
      statusChips(p.st))));

  // 選択中カードの説明
  const info = $('#bInfo');
  info.innerHTML = '';
  if (selCard) {
    const d = CARDS[selCard.id];
    info.appendChild(h('div', { class: 'info-card' },
      h('b', {}, `${cardName(selCard)}（${cardCost(selCard)}）`), '　',
      cardText(selCard).replace(/\n/g, ' '),
      h('div', { class: 'dim small' }, targeting ? (alive().length > 1 ? '敵をタップして使う（←→で選んでEnter）' : 'もう一度タップ、または敵をタップで使う')
        : 'もう一度タップ（Enter）で使う')));
  } else if (B.phase === 'player') {
    info.appendChild(h('div', { class: 'dim small' }, 'カードをタップして選ぶ　／　数字キー1〜9でも選べる'));
  } else if (B.phase === 'enemy') {
    info.appendChild(h('div', { class: 'dim small' }, '敵の行動中……'));
  }

  // 手札
  const hand = $('#bHand');
  hand.innerHTML = '';
  const n = B.hand.length;
  const avail = Math.min(hand.clientWidth || 360, 470);
  const gap = 4;
  // 5枚が横に並ぶ幅を基準にし、それより多いときは重ねる
  const cw = clamp(Math.floor((avail - gap * 4) / 5), 60, 88);
  hand.style.setProperty('--cw', cw + 'px');
  const overlap = n > 1 ? (n * cw + (n - 1) * gap - avail) / (n - 1) : 0;
  B.hand.forEach((c, i) => {
    const d = CARDS[c.id];
    const ok = cardCost(c) <= p.energy && (!d.need || p.light >= d.need) && B.phase === 'player';
    const el = cardEl(c, { playable: ok, cls: (B.sel === i ? 'sel' : '') + (c.id === 'dawn' ? ' dawn' : ''), onclick: () => onCardClick(i) });
    if (i > 0) el.style.marginLeft = (overlap > 0 ? -overlap : gap) + 'px';
    el.style.zIndex = B.sel === i ? 50 : i;
    el.appendChild(h('div', { class: 'c-key' }, String((i + 1) % 10)));
    hand.appendChild(el);
  });

  // 下部
  const bot = $('#bBottom');
  bot.innerHTML = '';
  bot.appendChild(h('button', { class: 'btn small', onclick: () => pileView('山札（順番はランダム）', B.draw.slice().sort((a, b) => a.id.localeCompare(b.id))) }, `山札 ${B.draw.length}`));
  bot.appendChild(h('button', { class: 'btn small', onclick: () => pileView('捨て札', B.discard) }, `捨て札 ${B.discard.length}`));
  bot.appendChild(h('button', { class: 'btn primary endturn', disabled: B.phase !== 'player', onclick: () => endTurn() }, 'ターン終了 (E)'));
}

function hpBar(hp, max, block) {
  return h('div', { class: 'hpbar' + (block ? ' has-block' : '') },
    h('div', { class: 'hp-fill', style: { width: (100 * hp / max) + '%' } }),
    h('span', { class: 'hp-txt' }, `${hp}/${max}`),
    block ? h('span', { class: 'blk-badge' }, `防${block}`) : null);
}

function pileView(title, cards) {
  Modal.open(`${title}（${cards.length}枚）`, cards.length ? deckGrid(cards) : h('div', { class: 'dim' }, 'なし'), { wide: true });
}

function onCardClick(i) {
  if (B.phase !== 'player') return;
  const c = B.hand[i];
  const d = CARDS[c.id];
  if (B.sel === i) {
    if (d.target) {
      if (alive().length === 1 || B.tgt >= 0) playCard(i, B.enemies[B.tgt] && !B.enemies[B.tgt].dead ? B.enemies[B.tgt] : alive()[0]);
    } else playCard(i);
    return;
  }
  B.sel = i;
  if (d.target && (B.tgt < 0 || !B.enemies[B.tgt] || B.enemies[B.tgt].dead)) B.tgt = B.enemies.findIndex(e => !e.dead);
  sfx('select');
  renderBattle();
}

function onEnemyClick(idx) {
  if (B.phase !== 'player') return;
  const e = B.enemies[idx];
  if (e.dead) return;
  B.tgt = idx;
  if (B.sel >= 0 && CARDS[B.hand[B.sel].id].target) { playCard(B.sel, e); return; }
  // 敵をタップしたら、その敵の情報を表示
  const m = e.d.moves[e.intent];
  const seen = B.p.light >= shadowNeed(e);
  toast(`${e.name}：${seen ? `次は「${m.name}」` : `行動は灯${shadowNeed(e)}以上で見える`}`);
  renderBattle();
}

function battleKeys(e) {
  if (!B || B.phase !== 'player') return;
  const n = parseInt(e.key, 10);
  if (!isNaN(n)) { const i = n === 0 ? 9 : n - 1; if (i < B.hand.length) onCardClick(i); return; }
  if (e.key === 'e' || e.key === 'E') { endTurn(); return; }
  if (e.key === 'Escape') { B.sel = -1; renderBattle(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const idxs = B.enemies.map((x, i) => i).filter(i => !B.enemies[i].dead);
    if (!idxs.length) return;
    let k = idxs.indexOf(B.tgt);
    k = (k + (e.key === 'ArrowRight' ? 1 : -1) + idxs.length) % idxs.length;
    B.tgt = idxs[k];
    renderBattle();
    return;
  }
  if (e.key === 'Enter' && B.sel >= 0) { e.preventDefault(); onCardClick(B.sel); }
}

function showBattleHelp() {
  Modal.open('バトルのあそびかた', h('div', { class: 'help' },
    h('p', {}, '■ 毎ターン、エネルギー3と手札5枚。カードを使ってエネルギーを消費する。'),
    h('p', {}, '■ 「ターン終了」で敵が行動。ブロックは次の自分のターン開始時に消える。'),
    h('p', {}, '■ 【灯】は戦闘中ずっと残る（最大10）。敵の頭上の「？ 灯2で見える」は、灯がその数以上あると次の行動が見える。灯を使って強い効果を出すカードもある。'),
    h('p', {}, '■ 弱体：与えるダメージ-25%　脆弱：受けるダメージ+50%　筋力：攻撃ダメージ+'),
    h('p', {}, '■ キーボード：1〜9でカード選択（もう一度押すと使う）、←→で対象、E でターン終了。')));
}

// ===== js/nodes.js =====
// ===== マップと各部屋（ノード）=====

const ACT_NAMES = ['第一幕　石の階', '第二幕　書の階', '第三幕　時計の階'];
const BOSS_ROOMS = ['鐘楼', '大書庫の奥', '大時計の間'];
const ACT_LAYOUT = [
  [['battle', 'battle', 'event'], ['battle', 'mio', 'event'], ['shop', 'battle', 'event'], ['gard'], ['rest', 'event'], ['boss']],
  [['battle', 'event', 'battle'], ['shop', 'battle', 'elite'], ['sion'], ['battle', 'event', 'hidden'], ['rest', 'shop'], ['boss']],
  [['battle', 'event', 'elite'], ['battle', 'shop', 'battle'], ['rest', 'event', 'battle'], ['elite', 'battle'], ['rest'], ['boss']],
];
const NODE_INFO = {
  battle: { ico: '影', label: '戦闘' },
  elite: { ico: '強', label: '強い影' },
  event: { ico: '？', label: 'できごと' },
  rest: { ico: '火', label: '焚き火' },
  shop: { ico: '店', label: 'ネズの店' },
  mio: { ico: '声', label: '泣き声', story: true },
  gard: { ico: '門', label: '大扉', story: true },
  sion: { ico: '書', label: '書庫', story: true },
  hidden: { ico: '鍵', label: '隠し扉', story: true },
  boss: { ico: '主', label: 'ボス' },
};

function genMap(act) {
  return ACT_LAYOUT[act].map(row => {
    const r = row.slice();
    // 物語ノード・隠し扉以外は並びをシャッフル
    if (!r.some(t => NODE_INFO[t].story)) shuffle(r);
    return r;
  });
}

function floorLabel(act, row) {
  return row === 5 ? BOSS_ROOMS[act] : `${act * 5 + row + 1}F`;
}

function nodeVisible(type) {
  return type !== 'hidden' || (G.run.flags.hasKey && !G.run.flags.nezFree);
}

// ===== マップ画面 =====
function mapScreen() {
  return new Promise(resolve => {
    const run = G.run;
    BG.set('act' + run.act);
    Sound.mood = 'night';
    const next = run.row + 1;
    const rows = [];
    for (let r = run.map.length - 1; r >= 0; r--) {
      const nodes = run.map[r].map((type, col) => ({ type, col })).filter(n => nodeVisible(n.type));
      const isNext = r === next;
      rows.push(h('div', { class: 'm-row' + (isNext ? ' next' : '') + (r < next ? ' past' : '') },
        h('div', { class: 'm-floor' }, floorLabel(run.act, r)),
        h('div', { class: 'm-nodes' }, nodes.map(n => {
          const info = NODE_INFO[n.type];
          const chosen = r < next && run.path[r] === n.col;
          const label = n.type === 'boss' ? '???' : info.label;
          return h('button', {
            class: `m-node n-${n.type}${info.story ? ' story' : ''}${chosen ? ' chosen' : ''}`,
            disabled: !isNext,
            onclick: () => { sfx('select'); resolve({ type: n.type, row: r, col: n.col }); },
          }, h('span', { class: 'm-ico' }, info.ico), h('span', { class: 'm-lbl' }, label));
        }))));
    }
    const el = h('div', { class: 'map' },
      statusBar(),
      h('div', { class: 'map-head' },
        h('div', { class: 'map-title' }, ACT_NAMES[run.act]),
        h('div', { class: 'map-btns' },
          h('button', { class: 'btn small', onclick: openJournal }, '日記 (J)'),
          h('button', { class: 'btn small', onclick: showDeck }, `デッキ ${run.deck.length} (D)`),
          muteButton())),
      h('div', { class: 'tower' }, rows),
      h('div', { class: 'map-foot dim small' }, '光っている部屋をえらんで、上へ進もう'));
    setScreen(el, e => {
      if (e.key === 'j' || e.key === 'J') openJournal();
      if (e.key === 'd' || e.key === 'D') showDeck();
      const n = parseInt(e.key, 10);
      if (n >= 1) {
        const btns = [...document.querySelectorAll('.m-row.next .m-node')];
        if (btns[n - 1]) btns[n - 1].click();
      }
    });
    const cur = el.querySelector('.m-row.next');
    if (cur) setTimeout(() => cur.scrollIntoView({ block: 'center' }), 30);
  });
}

function muteButton() {
  const b = h('button', { class: 'btn small', onclick: () => {
    Save.data.muted = !Save.data.muted; Save.write();
    b.textContent = Save.data.muted ? '音 OFF' : '音 ON';
  } }, Save.data.muted ? '音 OFF' : '音 ON');
  return b;
}

// ===== ノードに入る =====
async function enterNode(node) {
  const run = G.run;
  const act = run.act;
  switch (node.type) {
    case 'battle': {
      let enc = pick(ENCOUNTERS[act].normal);
      if (act === 0 && !run.fought) enc = ENCOUNTERS[0].first;
      run.fought = true;
      return fightNode(enc, 'normal');
    }
    case 'elite': return fightNode(pick(ENCOUNTERS[act].elite), 'elite');
    case 'boss': return bossNode();
    case 'event': await eventNode(); return 'ok';
    case 'rest': await restNode(); return 'ok';
    case 'shop': await shopNode(); return 'ok';
    case 'mio': await mioNode(); return 'ok';
    case 'gard': return gardNode();
    case 'sion': await sionNode(); return 'ok';
    case 'hidden': await hiddenNode(); return 'ok';
  }
  return 'ok';
}

async function fightNode(enc, kind) {
  const res = await startBattle(enc, kind);
  if (res === 'lose') { G.run.deathBy = enc[0]; return 'dead'; }
  if (res === 'true') return 'true';
  if (kind === 'boss' && G.run.act === 2) return 'normal';
  await rewardScreen(kind);
  return 'ok';
}

// ===== 報酬 =====
function rewardScreen(kind) {
  return new Promise(resolve => {
    const run = G.run;
    const gold = kind === 'boss' ? rnd(70, 90) : kind === 'elite' ? rnd(35, 50) : rnd(14, 24);
    run.shards += gold;
    if (hasRelic('herbs')) heal(4);
    let relic = null;
    if (kind === 'elite' || kind === 'boss') { relic = randomRelic(); if (relic) gainRelic(relic); }
    const ids = rollCards(3, kind);
    Save.write();
    const done = () => { Save.write(); resolve(); };
    const el = h('div', { class: 'reward' },
      statusBar(),
      h('h2', { class: 'center' }, '勝利！'),
      h('div', { class: 'rw-items' },
        h('div', { class: 'rw-item' }, sprImg('i_shard', 16), `欠片 +${gold}`),
        hasRelic('herbs') ? h('div', { class: 'rw-item' }, sprImg('i_heart', 16), '薬草袋でHP+4') : null,
        relic ? h('div', { class: 'rw-item rw-relic' }, `お守り「${RELICS[relic].name}」— ${RELICS[relic].txt}`) : null),
      h('div', { class: 'center dim' }, 'カードを1枚えらんでデッキに加える'),
      h('div', { class: 'deck-grid three' }, ids.map(id => cardEl({ id }, { cls: 'pickable', onclick: () => {
        run.deck.push({ id }); sfx('buy'); toast(`「${CARDS[id].name}」を手に入れた`); done();
      } }))),
      h('div', { class: 'center mt' }, h('button', { class: 'btn', onclick: done }, 'えらばずに進む')));
    setScreen(el, e => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 3) el.querySelectorAll('.deck-grid .card')[n - 1].click();
      if (e.key === 'Escape') done();
    });
  });
}

// ===== イベント =====
async function eventNode() {
  const run = G.run;
  run.seenEvents = run.seenEvents || [];
  let pool = EVENTS.filter(ev => ev.acts.includes(run.act) && !run.seenEvents.includes(ev.id) && (!ev.cond || ev.cond()));
  if (!pool.length) pool = EVENTS.filter(ev => ev.acts.includes(run.act));
  const ev = pick(pool);
  run.seenEvents.push(ev.id);
  sceneScreen(ev.title, null);
  await ev.run();
}

// ===== ネズの店 =====
async function shopNode() {
  const run = G.run;
  if (run.flags.nezFree) {
    sceneScreen('ネズの店（空っぽ）', null);
    await say(['店には、誰もいない。', 'カウンターに「ありがとよ」と書かれたメモと、カードが置いてあった。']);
    await cardChoice(rollCards(3, 'elite'), 'ネズの置き土産');
    return;
  }
  const disc = hasMem('m_nez') ? 0.8 : 1;
  const price = n => Math.round(n * disc);
  const cards = rollCards(3, 'normal').map(id => ({ id, cost: price({ common: 45, uncommon: 70, rare: 110 }[CARDS[id].rar]), sold: false }));
  const relicId = randomRelic();
  const relic = relicId ? { id: relicId, cost: price(130), sold: false } : null;
  let removed = false;
  const removeCost = price(70);

  sceneScreen('ネズの店', 'nez');
  if (!run.flags.metNez) {
    run.flags.metNez = true;
    await say([['nez', 'へっへ、いらっしゃい。こんな夜更けにお客とは珍しい'], ['nez', 'ここは塔でいちばんの品ぞろえ、ネズの店さ。欠片さえあれば、なんでも売るぜ']]);
  }

  await new Promise(resolve => {
    const buy = async (cost, fn) => {
      if (run.shards < cost) { sfx('deny'); toast('欠片が足りない'); return; }
      run.shards -= cost;
      fn();
      sfx('buy');
      Save.data.nezBuys++;
      Save.write();
      if (Save.data.nezBuys >= 3 && !hasMem('nez_key')) {
        await say([['nez', '毎度あり！ ……へへ、こんなにお得意さんなら、あの鍵のことも……'], ['nez', '……いや、なんでもねえ！ 今のは忘れてくれ！']]);
        learn('nez_key');
      }
      render();
    };
    const render = () => {
      const el = h('div', { class: 'shop' },
        statusBar(),
        h('div', { class: 'shop-head' }, sprImg('nez', 64, 'bob'), h('div', {}, h('div', { class: 'scene-place' }, 'ネズの店'), h('div', { class: 'shop-wallet' }, sprImg('i_shard', 16), `持っている欠片：${run.shards}`))),
        h('div', { class: 'shop-cards' }, cards.map(it => h('div', { class: 'shop-item' + (it.sold ? ' sold' : '') },
          cardEl({ id: it.id }, { cls: it.sold ? '' : 'pickable', onclick: it.sold ? null : () => buy(it.cost, () => { it.sold = true; run.deck.push({ id: it.id }); toast(`「${CARDS[it.id].name}」を買った`); }) }),
          h('div', { class: 'price' + (run.shards < it.cost ? ' short' : '') }, it.sold ? '売り切れ' : `欠片 ${it.cost}`)))),
        h('div', { class: 'shop-row' },
          relic ? h('button', { class: 'btn shop-wide', disabled: relic.sold, onclick: () => buy(relic.cost, () => { relic.sold = true; gainRelic(relic.id); }) },
            relic.sold ? '売り切れ' : `お守り「${RELICS[relic.id].name}」　欠片 ${relic.cost}`, h('div', { class: 'dim small' }, RELICS[relic.id].txt)) : null,
          h('button', { class: 'btn shop-wide', disabled: removed || run.deck.length <= 5, onclick: async () => {
            if (run.shards < removeCost) { sfx('deny'); toast('欠片が足りない'); return; }
            const i = await pickDeckCard('手放すカードを選ぶ', () => true);
            if (i < 0) return;
            await buy(removeCost, () => { removed = true; const nm = cardName(run.deck[i]); run.deck.splice(i, 1); toast(`「${nm}」を手放した`); });
          } }, removed ? '処分済み' : `カードを1枚処分する（手数料 欠片 ${removeCost}）`, removed ? null : h('div', { class: 'dim small' }, 'デッキから取りのぞく。欠片はもらえない'))),
        hasMem('nez_key') && !run.flags.hasKey && run.act <= 1
          ? h('button', { class: 'btn primary shop-wide', onclick: async () => { await askKey(); render(); } }, '「隠し扉の鍵、持ってるでしょ」') : null,
        h('div', { class: 'center mt' }, h('button', { class: 'btn', onclick: async () => {
          await say([['nez', pick(['また来な。……次の夜も、な', 'へっへ、毎度！', '気をつけてな。上は物騒だぜ'])]]);
          resolve();
        } }, '店を出る')));
      setScreen(el);
    };
    render();
  });
}

    ['nez', 'あんたが来てくれて、やっと踏ん切りがついた。先に、朝のほうへ行ってるぜ'],
    'ネズは小さく手を振って、扉の向こうの光に消えた。',
    '《ネズの未練が解けた》',
  ]);
  run.flags.nezFree = true;
}

// ===== js/main.js =====
// ===== ゲーム全体の流れ =====

function titleScreen() {
  BG.set('night');
  Sound.mood = 'night';
  const S = Save.load();
  const hasData = !!(S && S.loop > 0);
  const el = h('div', { class: 'title' },
    h('div', { class: 'title-logo' },
      h('div', { class: 't-sub' }, '灯守見習いユイと、終わらない夜'),
      h('h1', {}, '夜明けに', h('br'), '崩れる塔')),
    h('div', { class: 'title-menu' },
      hasData ? h('button', { class: 'btn primary', onclick: () => startGame(false) }, `つづきから（第${S.loop}夜）`) : null,
      h('button', { class: 'btn' + (hasData ? '' : ' primary'), onclick: () => {
        if (hasData && !confirm('日記の記憶をすべて失って、最初からはじめますか？')) return;
        startGame(true);
      } }, 'はじめから'),
      h('button', { class: 'btn', onclick: showHowTo }, 'あそびかた')),
    S && (S.endings.normal || S.endings.true)
      ? h('div', { class: 'title-ends' }, S.endings.normal ? '☆ ひとりの夜明け' : '', S.endings.true ? '　★ 夜明けの灯守' : '') : null,
    STORAGE_OK ? null : h('div', { class: 'title-warn' }, '※ この開き方ではセーブできません。ページを閉じると進行が消えます。', h('br'), 'ChromeやSafariでファイルを開くと保存できます。'),
    h('div', { class: 'title-foot dim small' }, 'PC：クリック／キーボード　スマホ：タップ', h('br'), '目安プレイ時間 約1時間'));
  setScreen(el, e => { if (e.key === 'Enter') el.querySelector('.title-menu .btn').click(); });
}

function showHowTo() {
  Modal.open('あそびかた', h('div', { class: 'help' },
    h('p', {}, '夜明けに崩れる塔を、カードで戦いながら登っていくゲームです。'),
    h('p', {}, '■ 力尽きるか夜明けが来ると、塔のふもとで目を覚まし、同じ夜をくり返します。カードやお守りは失いますが、「知ったこと」は日記に残ります。'),
    h('p', {}, '■ 日記の記憶は、次の夜に役立ちます。住人との会話やルート選びが変わることも。負けても、必ず何かを覚えて戻ってきます。'),
    h('p', {}, '■ バトル：エネルギー3で手札のカードを使います。【灯】が多いほど、敵の次の行動が見えるようになります。'),
    h('p', {}, '■ セーブは自動（このブラウザに保存）。')));
}

async function startGame(fresh) {
  Sound.init();
  if (fresh || !Save.data) { Save.data = Save.fresh(); Save.write(); }
  await gameLoop();
}

function newRun() {
  const S = Save.data;
  S.loop++;
  const deck = [];
  for (let i = 0; i < 5; i++) deck.push({ id: 'strike' });
  for (let i = 0; i < 4; i++) deck.push({ id: 'defend' });
  deck.push({ id: 'kindle' });
  if (hasMem('bell_weak')) deck.push({ id: 'bell' });
  const maxHp = 60 + (hasMem('m_hp') ? 6 : 0) + (hasMem('m_hp2') ? 6 : 0);
  S.run = { act: 0, row: -1, path: [], hp: maxHp, maxHp, deck, relics: ['lantern'], shards: 50, map: genMap(0), flags: {}, learnedThisRun: false };
  Save.write();
}

async function gameLoop() {
  for (;;) {
    if (!G.run) { newRun(); await loopIntro(); }
    const r = await playRun();
    if (r === 'dead') { await deathSequence(); continue; }
    const again = await endingSequence(r);
    if (!again) { titleScreen(); return; }
    Save.data.afterEnd = true;
    Save.write();
  }
}

async function nightCard(text, sub) {
  const el = h('div', { class: 'nightcard' }, h('div', { class: 'nc-main' }, text), sub ? h('div', { class: 'nc-sub' }, sub) : null);
  setScreen(el);
  await sleep(1900);
}

async function loopIntro() {
  const S = Save.data;
  BG.set('night');
  await nightCard(`第${S.loop}夜`, '塔のふもと');
  sceneScreen('塔のふもと', 'yui');
  if (S.loop === 1) await say(STORY.prologue);
  else if (S.afterEnd) { S.afterEnd = false; await say(STORY.loopAfterEnd); }
  else if (S.loop === 2) {
    await say(STORY.loop2);
    await say(['（マップ画面の「日記」から、覚えたことをいつでも確かめられる）']);
  } else await say(STORY.loopN);
  Save.write();
}

async function playRun() {
  const run = G.run;
  for (;;) {
    const node = await mapScreen();
    const r = await enterNode(node);
    if (r !== 'ok') return r;
    run.row = node.row;
    run.path[node.row] = node.col;
    if (node.type === 'boss' && run.act < 2) {
      run.act++;
      run.row = -1;
      run.path = [];
      run.map = genMap(run.act);
      const healed = Math.ceil((run.maxHp - run.hp) * 0.6);
      run.hp += healed;
      Save.write();
      BG.set('act' + run.act);
      await nightCard(ACT_NAMES[run.act], `階段で一息ついた（HP+${healed}）`);
    }
    Save.write();
  }
}

async function deathSequence() {
  const run = G.run;
  sfx('die');
  BG.set('dawn');
  flash('#fff', 1600);
  setScreen(h('div', { class: 'scene' }, h('div', { class: 'scene-stage' })));
  await sleep(700);
  sfx('collapse');
  BG.shake = 60;
  await say(STORY.death);
  let learned = false;
  if (run.deathBy === 'bellkeeper' && !hasMem('bell_weak')) {
    await say(STORY.deathBell);
    learned = learn('bell_weak');
  }
  if (!learned && !run.learnedThisRun) {
    const m = MEMS.find(x => x.minor && !hasMem(x.id));
    if (m) { await say(STORY.deathMinor); learn(m.id); }
  }
  BG.set('dark');
  Save.data.run = null;
  Save.write();
  await sleep(400);
}

async function endingSequence(kind) {
  const S = Save.data;
  S.endings[kind] = true;
  Save.write();
  if (kind === 'true') {
    sceneScreen('大時計の間', 'master');
    BG.set('dawn');
    Sound.mood = 'dawn';
    flash('#ffe8b0', 1400);
    await say(STORY.trueEnd());
  } else {
    sceneScreen('大時計の間', null);
    flash('#fff', 1200);
    BG.set('dawn');
    Sound.mood = 'dawn';
    await say(STORY.normalEnd);
  }
  S.run = null;
  Save.write();
  const known = MEMS.filter(m => S.memories[m.id]).length;
  return new Promise(resolve => {
    const el = h('div', { class: 'ending' },
      h('div', { class: 'end-kind' }, kind === 'true' ? '真エンド' : '通常エンド'),
      h('h1', {}, kind === 'true' ? '夜明けの灯守' : 'ひとりの夜明け'),
      kind === 'true' ? h('div', { class: 'end-sprites' }, ['gard', 'mio', 'yui', 'alma', 'sion', 'nez'].map(s => sprImg(s, 56, 'bob'))) : null,
      h('div', { class: 'end-stats' },
        h('div', {}, `くり返した夜：${S.loop}回`),
        h('div', {}, `日記の記憶：${known}/${MEMS.length}`),
        h('div', {}, `プレイ時間：${formatTime(S.playMs)}`)),
      kind === 'normal' ? h('div', { class: 'end-hint' }, '……住人たちは、光になって消えてしまった。', h('br'), '日記を読み返せば、まだできることがあるかもしれない。') : h('div', { class: 'end-hint' }, 'あそんでくれて、ありがとう。'),
      h('div', { class: 'title-menu' },
        kind === 'normal' ? h('button', { class: 'btn primary', onclick: () => resolve(true) }, 'もう一度、夜へ（記憶は残る）') : null,
        h('button', { class: 'btn', onclick: () => openJournalFromEnd() }, '日記を見る'),
        h('button', { class: 'btn', onclick: () => resolve(false) }, 'タイトルへ')));
    setScreen(el);
  });
}

function openJournalFromEnd() { openJournal(); }

// ===== 起動 =====
BG.init();
titleScreen();

document.addEventListener('pointerdown', () => Sound.init(), { once: true });
document.addEventListener('keydown', () => Sound.init(), { once: true });
