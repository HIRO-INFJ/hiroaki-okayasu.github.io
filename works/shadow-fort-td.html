    const c = reclassCost();
    advBox = h('div', { class: 'job-box re' },
      h('div', { class: 'small' }, '別の上級職に転職し直す（', sprImg('i_coin', 10), `${c}）　★はそのまま`),
      h('div', { class: 'job-row' }, others.map(k => {
        const ok = advOptions(tw.type).includes(k);
        return h('button', { class: 'btn small job-btn' + (ok ? '' : ' locked') + (R.gold < c ? ' short' : ''), disabled: !ok, onclick: () => reclass(k) },
          h('div', {}, ok ? T.adv[k].name : '？？？'), h('div', { class: 'dim tiny' }, ok ? T.adv[k].desc : '星の祭壇「もうひとつの上級職」で解放'));
      })));

    actions.push(h('button', { class: 'btn small' + (R.gold < c ? ' short' : ''), onclick: master }, `極める ★${(tw.star || 0) + 1}（`, sprImg('i_coin', 10), `${c}）`));

      Object.entries(TARGET_MODES).map(([k, v]) => h('button', { class: 'btn tiny-btn' + (tw.target === k ? ' on' : ''), onclick: () => setTarget(k) }, v))) : null,
    advBox,

// 連携の欄：条件を満たしている連携と、ON/OFF・維持費・状態
function synergyBox() {
  const rows = [];
  for (const id of SYN_ORDER) {
    const S = SYNERGIES[id];
    if (!synCond(id)) continue;
    if (!synKnown(id)) {
      if (S.kind !== 'hidden') rows.push(h('div', { class: 'syn-row dim' }, h('span', {}, `🔒 ${S.name}`), h('span', { class: 'tiny' }, '条件は満たしている（星の祭壇で解放）')));
      continue;
    }
    const off = (R.synOff || {})[id];
    const cost = curUpkeep(id);
    const state = R.phase === 'wave' ? (synActive(id) ? '発動中' : off ? 'OFF' : '金貨不足で不発') : (off ? 'OFF' : R.gold >= cost ? '次の波で発動' : '金貨が足りない');
    rows.push(h('div', { class: 'syn-row' + (synActive(id) ? ' on' : '') },
      h('span', { title: S.desc }, `${S.kind === 'hidden' ? '✦ ' : ''}${S.name}`),
      h('span', { class: 'tiny dim' }, `維持費 ${cost}/波・${state}`),
      R.phase === 'build' ? h('button', { class: 'btn tiny-btn' + (off ? '' : ' on'), onclick: () => toggleSyn(id) }, off ? 'OFF' : 'ON') : null));
  }
  if (!rows.length) return null;
  return h('div', { class: 'syn-box' }, h('div', { class: 'small' }, '連携'), rows);
}

        !hidden && ENEMIES[t].fly ? h('span', { class: 'tag' }, '空') : null);
    })));
    if ((nx.affix || []).length) body.push(h('div', { class: 'affix' }, '特性：', nx.affix.map(a => h('span', { class: 'af', title: AFFIXES[a].desc }, `${AFFIXES[a].name}（${AFFIXES[a].desc}）`))));
    const q = QUESTS[nx.quest];
    body.push(h('div', { class: 'quest' }, `クエスト：${q.text}（金貨+${q.reward}）`));
  }
  return h('div', {}, h('div', { class: 'pn-title' }, title, h('span', { class: 'dim small' }, `　予知Lv${lvl}`)),
    h('div', { class: 'mapline dim small' }, `戦場：${CURMAP.name}（難易度 ${diffLabel(CURMAP.id)}）　${CURMAP.desc}`), body,
    synergyBox(),
    h('div', { class: 'dim tiny mt-s' }, '台座をタップして塔を建てる／塔をタップして強化・狙いの変更'));
}

function runMenu() {
  UI.paused = true;
  refreshUI(true);
  Modal.open('メニュー', close => h('div', { class: 'title-menu' },
    h('button', { class: 'btn primary', onclick: () => { close(); UI.paused = false; refreshUI(true); } }, '戦いにもどる'),
    h('button', { class: 'btn', onclick: () => { close(); showHowTo(); } }, 'あそびかた'),
    h('button', { class: 'btn', onclick: () => { Save.data.muted = !Save.data.muted; Save.write(); close(); UI.paused = false; toast(Save.data.muted ? '音 OFF' : '音 ON'); } }, Save.data.muted ? '音をONにする' : '音をOFFにする'),
    h('button', { class: 'btn', onclick: () => { close(); UI.paused = false; R = null; W = null; titleScreen(); } }, 'タイトルへ（準備中の状態から再開できる）'),
    h('button', { class: 'btn', onclick: () => { if (!confirm('この挑戦をあきらめますか？（星はもらえる）')) return; close(); UI.paused = false; R.phase = 'over'; endRun(false); } }, 'この挑戦をあきらめる')));
}

// ===== メインループ =====
let lastT = 0, hudTick = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
  lastT = t;
  if (!R || !UI.cx || !document.body.contains(UI.cv)) return;
  if (!UI.paused && R.phase === 'wave' && !Modal.active) {
    const steps = UI.speed;
    for (let i = 0; i < steps; i++) {
      step(dt);
      for (const k in R.spellCd) if (R.spellCd[k] > 0) R.spellCd[k] -= dt;
      if (!W.running) break;
    }
  }
  render(UI.cx);
  if (++hudTick % 10 === 0) refreshUI();
}
requestAnimationFrame(frame);

// ===== タイトル・祭壇・図鑑・実績 =====
function titleScreen() {
  Save.load();
  if (!Save.data) { Save.data = Save.fresh(); Save.write(); }
  const S = Save.data;
  const cont = !!S.run;
  const el = h('div', { class: 'title' },
    titleBackdrop(),
    h('div', { class: 'title-logo' },
      h('div', { class: 't-sub' }, 'ローグライト・タワーディフェンス'),
      h('h1', {}, '影喰いの砦'),
      h('div', { class: 'title-stars' }, sprImg('i_star', 16), ` 星 ${S.stars}`, S.stats.bestWave ? `　最高 第${S.stats.bestWave}波` : '')),
    h('div', { class: 'title-menu' },
      cont ? h('button', { class: 'btn primary', onclick: () => resumeRun() }, `つづきから（第${S.run.wave + 1}波の準備から）`) : null,
      h('button', { class: 'btn' + (cont ? '' : ' primary'), onclick: () => {
        if (cont && !confirm('いまの挑戦を捨てて、新しく出撃しますか？')) return;
        sortie();
      } }, '出撃する'),
      (S.maxAsc || 0) > 0 ? h('div', { class: 'asc-row' }, h('span', { class: 'small' }, '昇格（敵が強くなり、戦場がランダムになる）'),
        h('select', { class: 'sel', onchange: e => { S.asc = parseInt(e.target.value, 10); Save.write(); } },
          Array.from({ length: S.maxAsc + 1 }, (_, i) => h('option', { value: String(i), selected: i === (S.asc || 0) ? true : null }, i ? `昇格 ${i}` : 'ふつう')))) : null,
      h('button', { class: 'btn', onclick: altarScreen }, '星の祭壇（解放）'),
      h('div', { class: 'row2' },
        h('button', { class: 'btn', onclick: codexScreen }, '図鑑'),
        h('button', { class: 'btn', onclick: achScreen }, `実績 ${Object.keys(S.ach).length}/${ACHIEVEMENTS.length}`)),
      h('button', { class: 'btn', onclick: showHowTo }, 'あそびかた')),
    STORAGE_OK ? null : h('div', { class: 'title-warn' }, '※ この開き方ではセーブできません。ページを閉じると進行が消えます。'),
    h('div', { class: 'title-foot dim small' }, 'PC：クリック／キーボード　スマホ：タップ'));
  setScreen(el, e => { if (e.key === 'Enter') el.querySelector('.title-menu .btn').click(); });
}

function resumeRun() {
  Sound.init();
  R = JSON.parse(JSON.stringify(Save.data.run));
  R.runSpells = R.runSpells || [];
  R.map = R.map || 'forest'; R.visited = R.visited || [R.map];
  setMap(R.map);
  R.towers.forEach(t => { t.cd = 0; });
  enterBuild();
}

function altarScreen() {
  const S = Save.data;
  const el = h('div', { class: 'altar' },
    h('div', { class: 'scr-head' }, h('button', { class: 'btn small', onclick: titleScreen }, '← もどる'), h('div', { class: 'scr-title' }, '星の祭壇'), h('div', { class: 'title-stars' }, sprImg('i_star', 16), ` ${S.stars}`)),
    h('div', { class: 'dim small mb' }, '星は、挑戦の結果と実績で手に入る。解放したものは、次の挑戦からずっと使える。'),
    h('div', { class: 'unlock-list' }, UNLOCKS.map(u => {
      const got = unlocked(u.id);
      const reqOk = !u.req || unlocked(u.req);
      return h('div', { class: 'unlock' + (got ? ' got' : '') },
        h('div', {}, h('div', { class: 'u-name' }, (got ? '✓ ' : '') + u.name), h('div', { class: 'dim small' }, u.desc + (reqOk ? '' : `（先に「${UNLOCKS.find(x => x.id === u.req).name}」）`))),
        got ? h('span', { class: 'dim small' }, '解放済み') : h('button', { class: 'btn small', disabled: !reqOk || S.stars < u.cost, onclick: () => {
          S.stars -= u.cost; S.unlocked[u.id] = 1; Save.write(); sfx('learn'); toast(`「${u.name}」を解放した`, 'item');
          if (u.id === 'p2') achieve('p2');
          altarScreen();
        } }, sprImg('i_star', 12), ` ${u.cost}`));
    })));
  setScreen(el, e => { if (e.key === 'Escape') titleScreen(); });
}

function codexScreen(tab = 'enemy') {
  const C = Save.data.codex;
  const tabs = [['enemy', '敵'], ['tower', '塔'], ['class', '上級職'], ['syn', '連携']];
  let body;
  if (tab === 'enemy') {
    body = ENEMY_ORDER.map(t => C.enemies[t]
      ? h('div', { class: 'cx-item' }, sprImg(ENEMIES[t].spr, 32), h('div', {}, h('div', {}, ENEMIES[t].name + (ENEMIES[t].boss ? '（ボス）' : '')), h('div', { class: 'dim small' }, ENEMIES[t].desc)))
      : h('div', { class: 'cx-item dim' }, h('div', { class: 'cx-q' }, '？'), h('div', {}, '？？？')));
  } else if (tab === 'tower') {
    body = TOWER_ORDER.map(t => C.towers[t]
      ? h('div', { class: 'cx-item' }, towerImg(t, 32), h('div', {}, h('div', {}, TOWERS[t].name), h('div', { class: 'dim small' }, TOWERS[t].desc)))
      : h('div', { class: 'cx-item dim' }, h('div', { class: 'cx-q' }, '？'), h('div', {}, '？？？')));
  } else if (tab === 'syn') {
    const seen = C.syn || {};
    body = SYN_ORDER.map(id => {
      const S = SYNERGIES[id];
      const show = S.kind === 'hidden' ? seen[id] : true;
      if (!show) return h('div', { class: 'cx-item dim' }, h('div', { class: 'cx-q' }, '？'), h('div', {}, '？？？（隠し連携）'));
      return h('div', { class: 'cx-item' + (seen[id] ? ' got' : '') }, h('div', { class: 'cx-q' }, S.kind === 'hidden' ? '✦' : seen[id] ? '◆' : '◇'),
        h('div', {}, h('div', {}, `${S.name}（維持費 ${S.upkeep ? S.upkeep + '〜' : 0}/波）`), h('div', { class: 'dim small' }, `条件：${S.cond}`), h('div', { class: 'dim small' }, S.desc)));
    });
  } else {
    body = TOWER_ORDER.flatMap(t => Object.keys(TOWERS[t].adv).map(k => C.classes[k]
      ? h('div', { class: 'cx-item' }, towerImg(t, 32, k), h('div', {}, h('div', {}, `${TOWERS[t].adv[k].name}（${TOWERS[t].name}）`), h('div', { class: 'dim small' }, TOWERS[t].adv[k].desc)))
      : h('div', { class: 'cx-item dim' }, h('div', { class: 'cx-q' }, '？'), h('div', {}, `？？？（${C.towers[t] ? TOWERS[t].name : '？？？'}の上級職）`))));
  }
  const el = h('div', { class: 'altar' },
    h('div', { class: 'scr-head' }, h('button', { class: 'btn small', onclick: titleScreen }, '← もどる'), h('div', { class: 'scr-title' }, '図鑑')),
    h('div', { class: 'tabs' }, tabs.map(([id, l]) => h('button', { class: 'tab' + (id === tab ? ' on' : ''), onclick: () => codexScreen(id) }, l))),
    h('div', { class: 'cx-list' }, body));
  setScreen(el, e => { if (e.key === 'Escape') titleScreen(); });
}

function achScreen() {
  const A = Save.data.ach;
  const el = h('div', { class: 'altar' },
    h('div', { class: 'scr-head' }, h('button', { class: 'btn small', onclick: titleScreen }, '← もどる'), h('div', { class: 'scr-title' }, `実績 ${Object.keys(A).length}/${ACHIEVEMENTS.length}`)),

    h('div', { class: 'cx-list' }, ACHIEVEMENTS.map(a => h('div', { class: 'cx-item' + (A[a.id] ? ' got' : ' dim') },
      h('div', { class: 'cx-q' }, A[a.id] ? '★' : '☆'), h('div', {}, h('div', {}, a.name), h('div', { class: 'small dim' }, a.desc))))));
  setScreen(el, e => { if (e.key === 'Escape') titleScreen(); });
}

    h('p', {}, '■ キーボード：Space 波を始める／F 速度／P 一時停止／Q・W・E 呪文／1〜8 塔を選ぶ／Esc 選択解除')));
