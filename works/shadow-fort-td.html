:root {
  --bg: #101418;
  --panel: rgba(16, 20, 38, 0.9);
  --panel2: #1e2440;
  --line: #3a4466;
  --line2: #5a6a9a;
  --text: #efe6d2;
  --dim: #9a90ad;
  --flame: #ffc86a;
  --flame2: #ff7a3c;
  --hp: #e5534b;
  --block: #6fb7d9;
  --energy: #ffd45c;
  --good: #8fd16a;
  --purple: #b48be8;
  --atk: #b8544a;
  --skl: #4a78ae;
  --pow: #8e5fc6;
  --spc: #caa04a;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: 'DotGothic16', 'Hiragino Kaku Gothic ProN', monospace; }
body { overflow-x: hidden; user-select: none; -webkit-user-select: none; font-size: 15px; line-height: 1.5; }

#app { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 12px env(safe-area-inset-bottom); }
.spr { image-rendering: pixelated; display: inline-block; vertical-align: middle; }
.dim { color: var(--dim); }
.small { font-size: 12px; }
.center { text-align: center; }
.mt { margin-top: 14px; }
h1, h2 { font-weight: normal; margin: 8px 0; }

/* ===== ボタン ===== */
.btn {
  font-family: inherit; font-size: 15px; color: var(--text);
  background: var(--panel2); border: 2px solid var(--line2);
  padding: 10px 16px; cursor: pointer; box-shadow: 0 3px 0 #000, inset 0 0 0 2px rgba(0,0,0,.3);
  transition: border-color .1s;
}
.btn:hover:not(:disabled) { border-color: var(--flame); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { border-color: var(--flame); color: var(--flame); }
.btn.small { font-size: 13px; padding: 5px 9px; }
.btn.focus { border-color: var(--flame); background: #342848; }

/* ===== タイトル ===== */
.title { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8vh 0 4vh; text-align: center; }
.title-logo h1 { font-size: 44px; line-height: 1.15; letter-spacing: 4px; color: #fff4d8; text-shadow: 0 0 16px rgba(255,180,80,.55), 3px 3px 0 #000; margin: 10px 0 0; }
.t-sub { color: var(--flame); font-size: 13px; letter-spacing: 2px; text-shadow: 2px 2px 0 #000; }
.title-menu { display: flex; flex-direction: column; gap: 12px; width: min(280px, 100%); margin-top: 20px; }
.title-ends { color: var(--energy); font-size: 13px; text-shadow: 1px 1px 0 #000; }
.title-warn { font-size: 12px; color: #ffcf8a; background: rgba(40,20,10,.85); border: 1px solid var(--flame2); padding: 6px 10px; margin-top: 12px; }
.title-foot { text-shadow: 1px 1px 0 #000; margin-top: 12px; }

.nightcard { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: fadein 1.2s; }
.nc-main { font-size: 34px; letter-spacing: 6px; text-shadow: 0 0 12px rgba(255,200,120,.5), 3px 3px 0 #000; }
.nc-sub { color: var(--dim); margin-top: 8px; text-shadow: 1px 1px 0 #000; }

/* ===== ステータスバー ===== */
.statusbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; margin: 8px 0 4px; background: var(--panel); border: 2px solid var(--line); flex-wrap: wrap; }
.sb-left { display: flex; gap: 12px; align-items: center; }
.sb-item { display: inline-flex; gap: 4px; align-items: center; }
.sb-lbl { font-size: 13px; color: #c9bfdc; }
.sb-shard { color: #bfe6f5; }
.shop-wallet { display: flex; gap: 6px; align-items: center; color: #bfe6f5; font-size: 15px; }
.relics { display: flex; gap: 4px; flex-wrap: wrap; }
.relic { font-family: inherit; font-size: 12px; width: 24px; height: 24px; padding: 0; background: #3a2d18; color: var(--energy); border: 2px solid var(--spc); cursor: pointer; }

/* ===== 場面 ===== */
.scene { flex: 1; display: flex; flex-direction: column; padding-bottom: 200px; }
.scene-place { font-size: 18px; color: var(--flame); text-shadow: 2px 2px 0 #000; margin: 10px 2px; }
.scene-stage { flex: 1; min-height: 180px; display: flex; align-items: flex-end; justify-content: center; gap: 12px; padding-bottom: 20px; }
.scene-stage.fire { flex: 0; min-height: 200px; align-items: center; }
.campfire { width: 48px; height: 48px; position: relative; }
.campfire::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 70%, #fff3b0 0 12%, #ffb347 13% 32%, #ff5a2a 33% 48%, transparent 50%); animation: flicker .25s infinite alternate; }
.rest-opts { display: flex; flex-direction: column; gap: 12px; margin: 16px auto; width: min(320px, 100%); }
.bob { animation: bob 2.4s ease-in-out infinite; }

/* ===== 会話 ===== */
#overlay { position: fixed; inset: 0; z-index: 30; display: none; justify-content: center; align-items: flex-end; padding: 0 10px calc(10px + env(safe-area-inset-bottom)); cursor: pointer; }
#overlay.show { display: flex; }
.dlg { pointer-events: auto; width: min(480px, 100%); min-height: 132px; background: #0a0c1a; border: 3px double var(--line2); padding: 12px; display: flex; gap: 10px; position: relative; cursor: pointer; box-shadow: 0 4px 0 #000; animation: fadein .2s; }
.dlg-portrait { flex: 0 0 56px; }
.dlg-portrait:empty { display: none; }
.dlg-portrait .spr { background: #1d1730; border: 2px solid var(--line); }
.dlg-body { flex: 1; min-width: 0; }
.dlg-name { color: var(--flame); font-size: 14px; min-height: 0; }
.dlg-name:empty { display: none; }
.dlg-text { font-size: 16px; white-space: pre-line; min-height: 48px; }
.dlg.narration .dlg-text { color: #d9d0f0; }
.dlg-next { position: absolute; right: 10px; bottom: 6px; color: var(--flame); animation: blink 1s infinite; font-size: 12px; }
.dlg-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.dlg-choices:empty { display: none; }
.choice { text-align: left; font-size: 14px; }

/* ===== モーダル ===== */
#modal { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(5,3,10,.78); align-items: center; justify-content: center; padding: 12px; }
#modal.show { display: flex; }
.modal-box { width: min(420px, 100%); max-height: 88vh; display: flex; flex-direction: column; background: #10142a; border: 3px double var(--line2); box-shadow: 0 6px 0 #000; animation: fadein .15s; }
.modal-box.wide { width: min(560px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 2px solid var(--line); gap: 8px; }
.modal-title { color: var(--flame); }
.modal-body { padding: 12px; overflow-y: auto; }
.help p { margin: 0 0 10px; font-size: 14px; }

/* ===== トースト・演出 ===== */
#toast { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; width: min(440px, 94vw); pointer-events: none; }
.toast { background: rgba(20,15,32,.95); border: 2px solid var(--line2); padding: 8px 12px; font-size: 13px; animation: drop .25s; transition: opacity .5s, transform .5s; }
.toast.toast-memory { border-color: var(--energy); color: #fff0c0; box-shadow: 0 0 12px rgba(255,212,92,.35); }
.toast.toast-item { border-color: var(--block); color: #d8f2ff; }
.toast.out { opacity: 0; transform: translateY(-8px); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 25; }
.fxtext { position: fixed; transform: translate(-50%, 0); font-size: 20px; text-shadow: 2px 2px 0 #000; animation: floatup 1s ease-out forwards; white-space: nowrap; }
.fxtext.dmg { color: #ff6b5b; font-size: 24px; }
.fxtext.blk { color: var(--block); }
.fxtext.lit { color: var(--energy); font-size: 16px; }
.fxtext.deb { color: var(--purple); font-size: 15px; }
.fxtext.spc { color: var(--energy); font-size: 17px; }
.fxtext.move { color: #fff; font-size: 14px; background: rgba(0,0,0,.6); padding: 2px 6px; }
#flash { position: fixed; inset: 0; z-index: 45; pointer-events: none; opacity: 0; }
#flash.go { animation: flashout 600ms ease-out; }

/* ===== 日記 ===== */
.journal { display: flex; flex-direction: column; gap: 8px; }
.j-sec { color: var(--flame); margin-top: 6px; border-bottom: 1px solid var(--line); }
.mem { padding: 4px 6px; }
.mem.known { background: rgba(255,212,92,.06); border-left: 3px solid var(--energy); }
.mem-t { font-size: 14px; }
.mem-d { font-size: 12.5px; white-space: pre-line; color: #d6cce6; }
.mem-d.dim { color: var(--dim); }
.goal-box { border: 2px solid var(--energy); padding: 8px; background: rgba(255,212,92,.07); }

<script>
// ===== js/util.js =====
// ===== 共通ユーティリティ・セーブ =====

const $ = (sel, root = document) => root.querySelector(sel);

// 小さなDOMビルダー: h('div', {class:'x', onclick:fn}, child, ...)
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'html') el.innerHTML = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function weighted(table) { // [[value, weight], ...]
  const total = table.reduce((s, t) => s + t[1], 0);
  let r = Math.random() * total;
  for (const [v, w] of table) { if ((r -= w) < 0) return v; }
  return table[table.length - 1][0];
}

// ===== セーブデータ =====
// ファイルを開く方法によっては保存できない（その場合もゲームは遊べる）
const STORAGE_OK = (() => {
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; }
})();
const SAVE_KEY = 'shadow-fort-td-save-v1';
const Save = {
  data: null,
  fresh() {
    return { stars: 0, unlocked: {}, codex: { enemies: {}, towers: {}, classes: {} }, ach: {}, stats: {}, run: null, asc: 0, maxAsc: 0, playMs: 0, muted: false };
  },
  load() {
    try {
      const s = localStorage.getItem(SAVE_KEY);
      this.data = s ? Object.assign(this.fresh(), JSON.parse(s)) : null;
    } catch (e) { this.data = null; }
    return this.data;
  },
  write() {
    if (!this.data) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) {}
  },
  clear() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    this.data = null;
  },
};

// 実行中のゲーム状態への近道
const G = {
  get save() { return Save.data; },
  get run() { return Save.data && Save.data.run; },
};

// プレイ時間の計測（表示中のみ）
setInterval(() => {
  if (Save.data && document.visibilityState === 'visible') { Save.data.playMs += 1000; }
}, 1000);

function formatTime(ms) {
  const m = Math.floor(ms / 60000);
  return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60}分` : `${m}分`;
}

// ===== js/audio.js =====
// ===== 効果音と環境音（WebAudioで生成。音声ファイルなし） =====

const Sound = {
  ctx: null,
  master: null,
  musicTimer: null,
  mood: 'night',

  get muted() { return !!(Save.data && Save.data.muted); },

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);
      this.startMusic();
    } catch (e) { this.ctx = null; }
  },

  tone(freq, dur = 0.1, type = 'square', vol = 0.06, slide = 0, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },

  noise(dur = 0.15, vol = 0.08, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    const g = this.ctx.createGain();
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1200;
    g.gain.value = vol;
    src.buffer = buf; src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },

  // ゆっくり鳴る環境音楽（ペンタトニックのランダムな音）
  startMusic() {
    const scales = {
      night: [220, 261.6, 293.7, 329.6, 392, 440, 523.3],
      dawn: [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3],
      tense: [196, 233.1, 261.6, 293.7, 349.2, 392],
    };
    let step = 0;
    this.musicTimer = setInterval(() => {
      if (!this.ctx || this.muted || document.visibilityState !== 'visible') return;
      const sc = scales[this.mood] || scales.night;
      step++;
      if (step % 8 === 0) this.tone(sc[0] / 2, 3.2, 'sine', 0.035);
      if (Math.random() < 0.45) this.tone(pick(sc), 1.6, 'triangle', 0.022);
    }, 520);
  },
};

function sfx(name) {
  const S = Sound;
  switch (name) {
    case 'card': S.tone(620, 0.05, 'square', 0.03); S.tone(930, 0.05, 'square', 0.02, 0, 0.03); break;
    case 'hit': S.noise(0.12, 0.12); S.tone(160, 0.12, 'sawtooth', 0.05, -80); break;
    case 'hurt': S.noise(0.2, 0.16); S.tone(110, 0.2, 'sawtooth', 0.07, -50); break;
    case 'block': S.tone(320, 0.1, 'triangle', 0.08, 80); break;
    case 'blocked': S.tone(900, 0.06, 'square', 0.03); S.tone(600, 0.08, 'triangle', 0.05, 0, 0.03); break;
    case 'light': S.tone(700, 0.12, 'sine', 0.06, 500); break;
    case 'debuff': S.tone(300, 0.18, 'square', 0.04, -150); break;
    case 'buff': S.tone(400, 0.15, 'square', 0.04, 300); break;
    case 'bell': [523, 784, 1046].forEach((f, i) => S.tone(f, 1.6, 'sine', 0.09 / (i + 1))); break;
    case 'kill': S.tone(400, 0.3, 'square', 0.05, -350); S.noise(0.3, 0.06); break;
    case 'buy': S.tone(880, 0.07, 'square', 0.04); S.tone(1320, 0.12, 'square', 0.04, 0, 0.07); break;
    case 'heal': [523, 659, 784].forEach((f, i) => S.tone(f, 0.2, 'sine', 0.06, 0, i * 0.08)); break;
    case 'learn': [392, 523, 659, 784, 1046].forEach((f, i) => S.tone(f, 0.4, 'sine', 0.05, 0, i * 0.09)); break;
    case 'win': [523, 659, 784, 1046].forEach((f, i) => S.tone(f, 0.25, 'square', 0.035, 0, i * 0.1)); break;
    case 'turn': S.tone(440, 0.08, 'triangle', 0.05); S.tone(660, 0.1, 'triangle', 0.05, 0, 0.08); break;
    case 'die': [392, 330, 262, 196].forEach((f, i) => S.tone(f, 0.5, 'triangle', 0.07, 0, i * 0.22)); break;
    case 'collapse': S.noise(1.6, 0.2); S.tone(60, 1.6, 'sawtooth', 0.08, -30); break;
    case 'select': S.tone(520, 0.04, 'square', 0.025); break;
    case 'deny': S.tone(180, 0.12, 'square', 0.05); break;
    case 'shoot': S.tone(1200, 0.04, 'square', 0.012, -400); break;
    case 'throw': S.tone(300, 0.08, 'triangle', 0.03, -120); break;
    case 'boom': S.noise(0.18, 0.08); S.tone(90, 0.18, 'sawtooth', 0.04, -40); break;
    case 'thud': S.noise(0.2, 0.1); S.tone(60, 0.25, 'sine', 0.08, -20); break;
    case 'zap': S.tone(1600, 0.06, 'sawtooth', 0.02, -1200); S.noise(0.06, 0.03); break;
    case 'pop': S.tone(500, 0.05, 'square', 0.02, 300); break;
    case 'build': S.tone(220, 0.06, 'square', 0.05); S.tone(330, 0.08, 'square', 0.05, 0, 0.06); break;
    case 'horn': [196, 262, 330].forEach((f, i) => S.tone(f, 0.35, 'sawtooth', 0.035, 0, i * 0.12)); break;
    case 'meteor': S.tone(800, 0.5, 'sawtooth', 0.05, -700); S.noise(0.6, 0.18, 0.3); break;
    case 'timestop': [1046, 784, 523].forEach((f, i) => S.tone(f, 0.5, 'sine', 0.06, 0, i * 0.08)); break;
    case 'bossdown': S.noise(0.8, 0.15); [392, 523, 659, 784].forEach((f, i) => S.tone(f, 0.4, 'square', 0.04, 0, 0.2 + i * 0.1)); break;
    case 'text': S.tone(900 + Math.random() * 200, 0.02, 'square', 0.012); break;
  }
}

// ===== js/data.js =====
// ===== 塔・敵・呪文・強化・クエスト・解放・実績 =====

const WHO = {}; // 会話ウィンドウ（ui.js）用。このゲームでは話者なし

// ===== マップ（論理サイズ 320x192、1マス16px）=====

const TILE = 16, MAP_W = 20, MAP_H = 12;

  twin: { name: '双子の門', diff: 3, desc: '門が2つ。敵は上下から来て、途中で合流する。', fort: [19, 6],
    colors: ['#3a4a3a', '#3e503e', '#8a7a5a', '#5a4a36'], trees: '#2a3a2a',
    paths: [
      [[-1, 1], [6, 1], [6, 6], [13, 6], [13, 3], [17, 3], [17, 6], [20, 6]],
      [[-1, 10], [6, 10], [6, 6], [13, 6], [13, 3], [17, 3], [17, 6], [20, 6]],
    ],

const _sprCache = {};
function spriteCanvas(name) {
  if (_sprCache[name]) return _sprCache[name];
  const rows = SPR[name];
  const hgt = rows.length, wid = Math.max(...rows.map(r => r.length));
  const cv = document.createElement('canvas');
  cv.width = wid; cv.height = hgt;
  const cx = cv.getContext('2d');
  rows.forEach((r, y) => {
    for (let x = 0; x < r.length; x++) {
      const col = PAL[r[x]];
      if (!col) continue;
      cx.fillStyle = col;
      cx.fillRect(x, y, 1, 1);
    }
  });
  return (_sprCache[name] = cv);
}
function sprImg(name, px, cls = '') {
  const i = new Image();
  i.src = spriteCanvas(name).toDataURL();
  i.className = 'spr ' + cls;
  i.style.width = px + 'px';
  i.style.height = px + 'px';
  i.draggable = false;
  i.alt = '';
  return i;
}

// 塔のアイコン（UI用）：canvasに塔を描いてimg化
const _towerIco = {};
function towerImg(type, px = 32, adv = null) {
  const key = type + ':' + adv;
  if (!_towerIco[key]) {
    const cv = document.createElement('canvas');
    cv.width = 16; cv.height = 16;
    drawTower(cv.getContext('2d'), type, 8, 9, adv ? 3 : 1, adv);
    _towerIco[key] = cv.toDataURL();
  }
  const i = new Image();
  i.src = _towerIco[key];
  i.className = 'spr';
  i.style.width = px + 'px'; i.style.height = px + 'px';
  i.alt = '';
  return i;
}

// 塔の描画（中心x,y。16x16ほど）
function drawTower(cx, type, x, y, lvl = 1, adv = null) {
  const T = TOWERS[type];
  x = Math.round(x); y = Math.round(y);
  // 土台
  cx.fillStyle = '#15101c';
  cx.fillRect(x - 6, y - 2, 12, 8);
  cx.fillStyle = adv ? '#6a5a8a' : '#6a6a78';
  cx.fillRect(x - 5, y - 1, 10, 6);
  cx.fillStyle = adv ? '#8a7ab0' : '#8a8a98';
  cx.fillRect(x - 5, y - 1, 10, 1);
  // 上部（種類ごと）
  cx.fillStyle = '#15101c';
  cx.fillRect(x - 4, y - 8, 8, 7);
  cx.fillStyle = T.color;
  cx.fillRect(x - 3, y - 7, 6, 5);
  cx.fillStyle = '#15101c';
  switch (type) {
    case 'archer': cx.fillRect(x - 1, y - 6, 2, 3); break;
    case 'stone': cx.fillRect(x - 2, y - 5, 4, 2); break;
    case 'ice': cx.fillStyle = '#f6f1e4'; cx.fillRect(x - 1, y - 7, 2, 5); cx.fillRect(x - 3, y - 5, 6, 1); break;
    case 'fire': cx.fillStyle = '#ffd45c'; cx.fillRect(x - 1, y - 6, 2, 3); break;
    case 'thunder': cx.fillStyle = '#15101c'; cx.fillRect(x, y - 7, 1, 2); cx.fillRect(x - 1, y - 5, 1, 2); break;
    case 'shrine': cx.fillStyle = '#d9b066'; cx.fillRect(x - 1, y - 7, 2, 5); cx.fillRect(x - 2, y - 6, 4, 1); break;
    case 'ballista': cx.fillRect(x - 3, y - 5, 6, 1); cx.fillRect(x, y - 7, 1, 4); break;
    case 'mine': cx.fillStyle = '#ffd45c'; cx.fillRect(x - 2, y - 5, 2, 2); cx.fillRect(x + 1, y - 4, 1, 1); break;
  }
  // レベルの印
  cx.fillStyle = adv ? '#ff9a4c' : '#ffd45c';
  const pips = adv ? 3 : lvl;
  for (let i = 0; i < pips; i++) cx.fillRect(x - 4 + i * 3, y + 3, 2, 1);
  if (adv) { cx.fillStyle = '#ff9a4c'; cx.fillRect(x + 3, y - 10, 1, 4); cx.fillRect(x + 4, y - 10, 2, 2); }
}

// ===== マップの下絵（マップごとに一度だけ描いてキャッシュ）=====
const _mapCache = {};
function mapCanvas(id = CURMAP.id) {
  if (_mapCache[id]) return _mapCache[id];
  const M = MAPS[id];
  const paths = M.paths.map(pt => pt.map(([x, y]) => ({ x: x * TILE + 8, y: y * TILE + 8 })));
  const pads = M.pads.map(([x, y]) => ({ x: x * TILE + 8, y: y * TILE + 8 }));
  const fort = { x: M.fort[0] * TILE + 8, y: M.fort[1] * TILE + 8 };
  const [g1, g2, road, roadEdge] = M.colors;
  const cv = document.createElement('canvas');
  cv.width = MAP_W * TILE; cv.height = MAP_H * TILE;
  const cx = cv.getContext('2d');
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    cx.fillStyle = (x + y) % 2 ? g1 : g2;
    cx.fillRect(x * TILE, y * TILE, TILE, TILE);
  }
  let seed = 7 + id.length * 13;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 260; i++) {
    cx.fillStyle = rand() < 0.5 ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.12)';
    cx.fillRect(Math.floor(rand() * cv.width), Math.floor(rand() * cv.height), 1, 2);
  }
  // 道
  const stroke = (col, w) => {
    cx.lineCap = 'square'; cx.lineJoin = 'miter'; cx.strokeStyle = col; cx.lineWidth = w;
    for (const pt of paths) { cx.beginPath(); pt.forEach((p, i) => (i ? cx.lineTo(p.x, p.y) : cx.moveTo(p.x, p.y))); cx.stroke(); }
  };
  stroke(roadEdge, 14); stroke(road, 11);
  for (let i = 0; i < 140; i++) {
    const pt = paths[i % paths.length];
    const seg = Math.floor(rand() * (pt.length - 1));
    const a = pt[seg], b = pt[seg + 1], t = rand();
    cx.fillStyle = 'rgba(255,255,255,.12)';
    cx.fillRect(Math.round(a.x + (b.x - a.x) * t + (rand() * 8 - 4)), Math.round(a.y + (b.y - a.y) * t + (rand() * 8 - 4)), 1, 1);
  }
  // 木・岩（道と台座を避けて）
  const blocked = (x, y) => pads.some(p => Math.abs(p.x - x) < 14 && Math.abs(p.y - y) < 14) || nearAnyPath(paths, x, y, 16);
  for (let i = 0; i < 40; i++) {
    const x = Math.floor(rand() * cv.width), y = Math.floor(rand() * cv.height);
    if (blocked(x, y) || Math.hypot(x - fort.x, y - fort.y) < 20) continue;
    cx.fillStyle = '#15101c'; cx.fillRect(x - 4, y - 7, 9, 8); cx.fillRect(x, y, 1, 3);
    cx.fillStyle = M.trees; cx.fillRect(x - 3, y - 6, 7, 6);
    cx.fillStyle = 'rgba(255,255,255,.15)'; cx.fillRect(x - 2, y - 6, 3, 2);
  }
  // 台座
  for (const p of pads) {
    cx.fillStyle = '#15101c'; cx.fillRect(p.x - 7, p.y - 5, 14, 11);
    cx.fillStyle = '#5a5a66'; cx.fillRect(p.x - 6, p.y - 4, 12, 9);
    cx.fillStyle = '#6e6e7a'; cx.fillRect(p.x - 6, p.y - 4, 12, 2);
  }
  // 入口（影の門）
  for (const pt of paths) {
    const s0 = pt[0];
    cx.fillStyle = '#15101c'; cx.fillRect(0, s0.y - 10, 6, 20);
    cx.fillStyle = '#4a2d66'; cx.fillRect(0, s0.y - 8, 4, 16);
  }
  // 砦
  cx.drawImage(spriteCanvas('castle'), fort.x - 12, fort.y - 20, 24, 24);
  _mapCache[id] = cv;
  return cv;
}

function mapThumb(id, w = 140) {
  const i = new Image();
  i.src = mapCanvas(id).toDataURL();
  i.className = 'spr map-thumb';
  i.style.width = w + 'px';
  i.alt = MAPS[id].name;
  return i;
}

function nearAnyPath(paths, x, y, d) {
  for (const pt of paths) {
    for (let i = 0; i < pt.length - 1; i++) {
      const a = pt[i], b = pt[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const t = clamp(((x - a.x) * dx + (y - a.y) * dy) / (dx * dx + dy * dy), 0, 1);
      if (Math.hypot(x - (a.x + dx * t), y - (a.y + dy * t)) < d) return true;
    }
  }
  return false;
}

const Dlg = {
  active: false,
  el: null,
  _next: null,
  _typing: null,

  open() {
    const ov = $('#overlay');
    if (!this.el) {
      this.el = h('div', { class: 'dlg' },
        h('div', { class: 'dlg-portrait' }),
        h('div', { class: 'dlg-body' },
          h('div', { class: 'dlg-name' }),
          h('div', { class: 'dlg-text' }),
          h('div', { class: 'dlg-choices' })),
        h('div', { class: 'dlg-next' }, '▼'));
      ov.appendChild(this.el);
      // 会話中は画面のどこをクリック・タップしても進む（選択肢の表示中は進まない）
      ov.addEventListener('click', () => this.advance());
    }
    ov.classList.add('show');
    this.active = true;
  },

  close() {
    $('#overlay').classList.remove('show');
    this.active = false;
  },

  line(ln) {
    return new Promise(resolve => {
      const el = this.el;
      const who = Array.isArray(ln) ? WHO[ln[0]] : null;
      const text = Array.isArray(ln) ? ln[1] : ln;
      const por = el.querySelector('.dlg-portrait');
      por.innerHTML = '';
      if (who) por.appendChild(sprImg(who.spr, 56));
      el.classList.toggle('narration', !who);
      el.querySelector('.dlg-name').textContent = who ? (typeof who.name === 'function' ? who.name() : who.name) : '';
      el.querySelector('.dlg-choices').innerHTML = '';
      el.querySelector('.dlg-next').style.visibility = 'hidden';
      const tx = el.querySelector('.dlg-text');
      tx.textContent = '';
      let i = 0;
      const done = () => {
        clearInterval(this._typing); this._typing = null;
        tx.textContent = text;
        el.querySelector('.dlg-next').style.visibility = 'visible';
        this._next = () => { this._next = null; resolve(); };
      };
      this._next = done;
      this._typing = setInterval(() => {
        i++;
        tx.textContent = text.slice(0, i);
        if (i % 3 === 0 && who) sfx('text');
        if (i >= text.length) done();
      }, 28);
    });
  },

  advance() { if (this._next) this._next(); },

  key(e) {
    if (this._choiceKeys) { this._choiceKeys(e); return; }
    if (['Enter', ' ', 'z', 'Z'].includes(e.key)) { e.preventDefault(); this.advance(); }
  },
};

async function say(lines, keep = false) {
  Dlg.open();
  for (const ln of lines) await Dlg.line(ln);
  if (!keep) Dlg.close();
}

// 選択肢。opts: 文字列 or {label, disabled}
function choose(opts) {
  Dlg.open();
  return new Promise(resolve => {
    const box = Dlg.el.querySelector('.dlg-choices');
    Dlg.el.querySelector('.dlg-next').style.visibility = 'hidden';
    box.innerHTML = '';
    Dlg._next = null;
    const items = opts.map(o => (typeof o === 'string' ? { label: o } : o));
    let focus = items.findIndex(o => !o.disabled);
    const finish = i => {
      if (items[i].disabled) { sfx('deny'); return; }
      sfx('select');
      Dlg._choiceKeys = null;
      box.innerHTML = '';
      Dlg.close();
      resolve(i);
    };
    const btns = items.map((o, i) => {
      const b = h('button', { class: 'btn choice', disabled: o.disabled, onclick: ev => { ev.stopPropagation(); finish(i); } }, `${i + 1}. ${o.label}`);
      box.appendChild(b);
      return b;
    });
    const paint = () => btns.forEach((b, i) => b.classList.toggle('focus', i === focus));
    paint();
    Dlg._choiceKeys = e => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= items.length) finish(n - 1);
      else if (e.key === 'ArrowDown') { focus = (focus + 1) % items.length; paint(); }
      else if (e.key === 'ArrowUp') { focus = (focus - 1 + items.length) % items.length; paint(); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); finish(focus); }
    };
  });
}

const Modal = {

  key(e) { if (e.key === 'Escape' && this._close) this._close(); },

// ===== js/engine.js =====
// ===== 戦闘の中身：敵の移動・塔の攻撃・描画 =====
// R = 挑戦中の状態（保存される）/ W = 戦闘中だけの状態（保存しない）

let R = null;
let W = null;
let enemyUid = 0;

// 道ごとの区間（地上の敵用）と、空の敵の直線。マップを切り替えるたびに作り直す
let ROUTES = [];
let FLY_FROM = null, FLY_TO = null, FLY_LEN = 1;
function buildRoutes() {
  ROUTES = PATHS.map(path => {
    const segs = [];
    let len = 0;
    for (let i = 0; i < path.length - 1; i++) {
      const a = path[i], b = path[i + 1];
      const l = Math.hypot(b.x - a.x, b.y - a.y);
      segs.push({ a, b, len: l, start: len });
      len += l;
    }
    return { segs, len, end: path[path.length - 1] };
  });
  FLY_FROM = { x: PATHS[0][0].x, y: PATHS[0][0].y };
  FLY_TO = { x: FORT.x, y: FORT.y };
  FLY_LEN = Math.hypot(FLY_TO.x - FLY_FROM.x, FLY_TO.y - FLY_FROM.y);
}

function posAt(dist, pi = 0) {
  const r = ROUTES[pi] || ROUTES[0];
  for (const s of r.segs) {
    if (dist <= s.start + s.len) {
      const t = (dist - s.start) / s.len;
      return { x: s.a.x + (s.b.x - s.a.x) * t, y: s.a.y + (s.b.y - s.a.y) * t };
    }
  }
  return { x: r.end.x, y: r.end.y };
}

function newBattleState() {
  return { enemies: [], projs: [], fx: [], queue: [], t: 0, spawnT: 0, timeStopUntil: 0, leaked: false, leakedFly: false, leakedJam: false, spellUsed: false, running: false, targeting: null };
}

// ===== 塔の性能（強化・上級職・呪い・聖堂の効果を反映）=====
function towerStats(tw) {
  const T = TOWERS[tw.type];
  const A = tw.adv ? T.adv[tw.adv] : null;
  const m = R.mods;
  const s = Object.assign({}, T, A || {});
  const lv = tw.adv ? 3 : tw.lvl;
  if (!A || A.dmg == null) s.dmg = T.dmg * LV_MULT[lv - 1] * (A ? 1.25 : 1);
  if (!A || A.range == null) s.range = T.range * (1 + 0.1 * (lv - 1));
  if (!A || A.rate == null) s.rate = T.rate * (1 - 0.08 * (lv - 1));
  // 強化（極めは1段ごとに攻撃+20%・射程+4%）
  const buff = shrineBuff(tw);
  const mm = CURMAP.mod || {};
  const star = tw.star || 0;
  s.dmg *= (1 + (m.dmg[tw.type] || 0) + (m.dmgAll || 0) + buff.dmg) * (1 + 0.2 * star);
  s.range *= (1 + (m.range || 0) + 0.04 * star) * (1 + (mm.range || 0));
  if (s.buff) s.buff *= 1 + 0.12 * star;
  if (s.income) s.income = Math.round(s.income * (1 + 0.25 * star));
  s.rate /= 1 + (m.speed || 0) + buff.haste;
  if (s.splash) s.splash *= 1 + ((m.splash && m.splash[tw.type]) || 0);
  if (s.slow) { s.slow = Math.min(0.85, s.slow + (m.slow || 0)); s.slowT = (s.slowT || 1.6) * (m.slow ? 1.5 : 1); }
  if (s.burn) s.burn *= 1 + (m.burn || 0) + (mm.burn || 0);
  if (s.chain) s.chain += m.chain || 0;
  if (!tw.target) tw.target = (A && A.target) || 'first';
  return s;
}

function shrineBuff(tw) {
  let dmg = 0, haste = 0;
  if (tw.type === 'shrine' || tw.type === 'mine') return { dmg, haste };
  const p = PADS[tw.pad];
  for (const o of R.towers) {
    if (o.type !== 'shrine') continue;
    const op = PADS[o.pad];
    const T = TOWERS.shrine, A = o.adv ? T.adv[o.adv] : null;
    const range = T.range * (1 + 0.1 * ((o.adv ? 3 : o.lvl) - 1));
    if (Math.hypot(op.x - p.x, op.y - p.y) > range) continue;
    const b = ((A && A.buff) || T.buff * (1 + 0.3 * (o.lvl - 1))) * (1 + 0.12 * (o.star || 0));
    dmg = Math.max(dmg, b);
    haste = Math.max(haste, (A && A.haste) || 0);
  }
  return { dmg, haste };
}

function costMult() { return Math.max(0.4, 1 + (R.mods.cost || 0)); }
function buildCost(type) { return Math.round(TOWERS[type].cost * costMult()); }
function upgradeCost(tw) { return Math.round(UP_COST(tw.type)[tw.lvl] * costMult()); }
function advDiscount() { return Save.data.unlocked.u_advcost ? 0.8 : 1; }
function advCost(tw) { return Math.round(ADV_COST(tw.type) * costMult() * advDiscount()); }
function reclassCost() { return Math.round(RECLASS_COST * advDiscount()); }

// ===== ウェーブの準備 =====
function prepareWave() {
  const w = R.wave + 1;
  const base = WAVES[w - 1];
  const asc = Save.data.asc || 0;
  // 特性：8波目から。後半は重なることもある（ボス波は15波目から）
  const affix = [];
  const isBossWave = base.some(([t]) => ENEMIES[t].boss);
  if (w >= 8 && (!isBossWave || w >= 15)) {
    const keys = shuffle(Object.keys(AFFIXES));
    if (w >= 14 || Math.random() < 0.55) affix.push(keys[0]);
    if (w >= 14 && Math.random() < 0.35) affix.push(keys[1]);
  }
  const horde = affix.includes('horde') ? 1.4 : 1;
  let comp = base.map(([type, n]) => [type, ENEMIES[type].boss ? n : Math.round(n * BAL.count * horde * (1 + 0.12 * asc))]);
  // 予知の書き換え
  if (R.rewriteType) {
    comp = comp.map(([type, n]) => [type === R.rewriteType ? 'goblin' : type, n]);
    const merged = {};
    comp.forEach(([t, n]) => { merged[t] = (merged[t] || 0) + n; });
    comp = Object.entries(merged);
    R.rewriteType = null;
  }
  const randJam = Math.random() < (Save.data.unlocked.u_clear ? 0.04 : 0.13);
  const jammed = comp.some(([t]) => ENEMIES[t].jam) || randJam;
  // クエスト：条件に合うものから1つ
  const hasFly = comp.some(([t]) => ENEMIES[t].fly);
  const hasJam = comp.some(([t]) => ENEMIES[t].jam);
  const pool = Object.keys(QUESTS).filter(q => !QUESTS[q].need || (QUESTS[q].need === 'fly' && hasFly) || (QUESTS[q].need === 'jam' && hasJam));
  R.next = { w, comp, jammed, randJam, affix, quest: pick(pool), hide: Math.floor(Math.random() * comp.length) };
}

function startWave() {
  W = W || newBattleState();
  const nx = R.next;
  // 出現の順番：種類を交互に混ぜる。ボスは真ん中あたり
  const groups = nx.comp.map(([t, n]) => ({ t, n }));
  const seq = [];
  let left = true;
  while (left) {
    left = false;
    for (const g of groups) { if (g.n > 0) { seq.push(g.t); g.n--; left = true; } }
  }
  const bi = seq.findIndex(t => ENEMIES[t].boss);
  if (bi >= 0) { const [b] = seq.splice(bi, 1); seq.splice(Math.floor(seq.length / 2), 0, b); }
  W.queue = seq;
  W.spawnT = 0;
  W.t = 0;
  W.leaked = W.leakedFly = W.leakedJam = W.spellUsed = false;
  W.running = true;
  R.phase = 'wave';
}

function spawnEnemy(type, at = null) {
  const d = ENEMIES[type];
  const af = (R.next && R.next.affix) || [];
  const has = k => af.includes(k);
  const hp = Math.round(d.hp * WAVE_HP(R.wave + 1) * (1 + (R.mods.enemyHp || 0)) * (has('elite') ? 1.6 : 1));
  const pi = at ? at.pi : (W.spawnCount = (W.spawnCount || 0) + 1) % ROUTES.length;
  const spMod = d.fly ? 1 : 1 + ((CURMAP.mod && CURMAP.mod.enemySpeed) || 0);
  const e = { id: ++enemyUid, type, d, hp, maxHp: hp, pos: at ? at.pos : 0, pi, x: 0, y: 0,
    speed: d.speed * spMod * (has('swift') ? 1.35 : 1), fly: !!d.fly, regen: has('regen') ? 0.025 : 0,
    armor: (d.armor || 0) + (has('armored') ? 4 : 0), slowAmt: 0, slowUntil: 0, frozenUntil: 0, burnDps: 0, burnUntil: 0, burnSpread: 0, alive: true, summonT: 3 };
  placeEnemy(e);
  W.enemies.push(e);
  seeEnemy(type);
}

function placeEnemy(e) {
  if (e.fly) {
    const t = Math.min(1, e.pos / FLY_LEN);
    e.x = FLY_FROM.x + (FLY_TO.x - FLY_FROM.x) * t;
    e.y = FLY_FROM.y + (FLY_TO.y - FLY_FROM.y) * t;
  } else {
    const p = posAt(e.pos, e.pi); e.x = p.x; e.y = p.y;
  }
}
function progress(e) { return e.fly ? e.pos / FLY_LEN : e.pos / (ROUTES[e.pi] || ROUTES[0]).len; }

// ===== 1コマ進める =====
function step(dt) {
  if (!W || !W.running) return;
  W.t += dt;
  const now = W.t;
  // 出現
  if (W.queue.length) {
    W.spawnT -= dt;
    if (W.spawnT <= 0) {
      const t = W.queue.shift();
      spawnEnemy(t);
      W.spawnT = ENEMIES[t].boss ? 2.0 : Math.max(0.35, 0.9 - R.wave * 0.02);
    }
  }
  const stopped = now < W.timeStopUntil;
  // 敵の移動と状態
  for (const e of W.enemies) {
    if (!e.alive) continue;
    if (e.burnUntil > now) damageEnemy(e, e.burnDps * dt, null, true);
    if (!e.alive) continue;
    if (e.regen && e.hp < e.maxHp) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * e.regen * dt);
    let sp = e.speed;
    if (e.slowUntil > now) sp *= 1 - e.slowAmt;
    if (e.frozenUntil > now || stopped) sp = 0;
    e.pos += sp * dt;
    placeEnemy(e);
    if (e.d.summon && !stopped) {
      e.summonT -= dt;
      if (e.summonT <= 0) { e.summonT = 4; spawnEnemy(e.d.summon, { pos: Math.max(0, e.pos - 10), pi: e.pi }); }
    }
    if (progress(e) >= 1) leak(e);
  }
  // 吹雪（まわりをずっと遅くする）
  for (const tw of R.towers) {
    const s = towerStats(tw);
    if (s.aura) {
      const p = PADS[tw.pad];
      for (const e of W.enemies) if (e.alive && Math.hypot(e.x - p.x, e.y - p.y) <= s.aura) { e.slowAmt = Math.max(e.slowUntil > now ? e.slowAmt : 0, s.slow); e.slowUntil = now + 0.3; }
    }
  }
  // 塔の攻撃
  for (const tw of R.towers) towerAct(tw, dt);
  // 弾
  for (const pr of W.projs) {
    if (!pr.alive) continue;
    const tg = pr.target;
    const tx = tg && tg.alive ? tg.x : pr.tx, ty = tg && tg.alive ? tg.y : pr.ty;
    pr.tx = tx; pr.ty = ty;
    const dx = tx - pr.x, dy = ty - pr.y, dd = Math.hypot(dx, dy);
    const v = pr.speed * dt;
    if (dd <= v + 2) { pr.alive = false; projHit(pr); }
    else { pr.x += dx / dd * v; pr.y += dy / dd * v; }
  }
  W.projs = W.projs.filter(p => p.alive);
  W.fx = W.fx.filter(f => (f.t -= dt) > 0);
  W.enemies = W.enemies.filter(e => e.alive);
  // ウェーブ終了
  // （ライフが尽きた同じ瞬間に敵が0体になっても、勝ちにはしない）
  if (R.phase === 'wave' && R.life > 0 && !W.queue.length && !W.enemies.length) { W.running = false; onWaveCleared(); }
}

function pickTarget(tw, s, list) {
  const mode = tw.target || 'first';
  let best = null, bv = -Infinity;
  for (const e of list) {
    const v = mode === 'first' ? progress(e) : mode === 'last' ? -progress(e) : mode === 'strong' ? e.hp : -e.hp;
    if (v > bv) { bv = v; best = e; }
  }
  return best;
}

function inRange(tw, s) {
  const p = PADS[tw.pad];
  return W.enemies.filter(e => e.alive && (s.air || !e.fly) && Math.hypot(e.x - p.x, e.y - p.y) <= s.range);
}

function towerAct(tw, dt) {
  const T = TOWERS[tw.type];
  if (tw.type === 'shrine' || tw.type === 'mine') return;
  const s = towerStats(tw);
  if (s.aura) return;
  tw.cd = (tw.cd || 0) - dt;
  if (tw.cd > 0) return;
  const p = PADS[tw.pad];
  if (s.pulse) {
    const hits = W.enemies.filter(e => e.alive && !e.fly && Math.hypot(e.x - p.x, e.y - p.y) <= s.pulse);
    if (!hits.length) return;
    tw.cd = s.rate;
    hits.forEach(e => { damageEnemy(e, s.dmg, tw); e.frozenUntil = Math.max(e.frozenUntil, W.t + s.stun); });
    W.fx.push({ kind: 'ring', x: p.x, y: p.y, r: s.pulse, t: 0.35, max: 0.35, color: '#c8b8a0' });
    sfx('thud');
    return;
  }
  const cand = inRange(tw, s);
  if (!cand.length) return;
  tw.cd = s.rate;
  if (s.proj === 'storm') {
    cand.forEach(e => { damageEnemy(e, s.dmg, tw); W.fx.push({ kind: 'bolt', x1: e.x, y1: e.y - 30, x2: e.x, y2: e.y, t: 0.15, max: 0.15 }); });
    sfx('zap');
    return;
  }
  if (s.proj === 'bolt') {
    let cur = pickTarget(tw, s, cand), from = { x: p.x, y: p.y - 6 };
    const hit = new Set();
    for (let i = 0; i < s.chain && cur; i++) {
      hit.add(cur);
      W.fx.push({ kind: 'bolt', x1: from.x, y1: from.y, x2: cur.x, y2: cur.y, t: 0.15, max: 0.15 });
      damageEnemy(cur, s.dmg * (i === 0 ? 1 : 0.8), tw);
      from = cur;
      cur = W.enemies.filter(e => e.alive && !hit.has(e) && Math.hypot(e.x - from.x, e.y - from.y) < 52)
        .sort((a, b) => Math.hypot(a.x - from.x, a.y - from.y) - Math.hypot(b.x - from.x, b.y - from.y))[0];
    }
    sfx('zap');
    return;
  }
  const n = s.multi || 1;
  const sorted = n > 1 ? cand.slice().sort((a, b) => progress(b) - progress(a)).slice(0, n) : [pickTarget(tw, s, cand)];
  for (const tg of sorted) {
    W.projs.push({ x: p.x, y: p.y - 6, tx: tg.x, ty: tg.y, target: tg, speed: s.proj === 'rock' ? 150 : 240, kind: s.proj, s, tw, alive: true });
  }
  sfx(s.proj === 'rock' ? 'throw' : 'shoot');
}

function projHit(pr) {
  const s = pr.s;
  if (s.splash) {
    W.fx.push({ kind: 'ring', x: pr.tx, y: pr.ty, r: s.splash, t: 0.3, max: 0.3, color: '#ffb070' });
    W.enemies.filter(e => e.alive && !e.fly && Math.hypot(e.x - pr.tx, e.y - pr.ty) <= s.splash).forEach(e => damageEnemy(e, s.dmg, pr.tw));
    sfx('boom');
    return;
  }
  const e = pr.target;
  if (!e || !e.alive) return;
  let dmg = s.dmg;
  if (s.burnBonus && e.burnUntil > W.t) dmg *= s.burnBonus;
  damageEnemy(e, dmg, pr.tw, false, s.pierceArmor);
  if (!e.alive) return;
  if (s.slow) { e.slowAmt = Math.max(e.slowUntil > W.t ? e.slowAmt : 0, s.slow); e.slowUntil = W.t + s.slowT; }
  if (s.freezeChance && Math.random() < s.freezeChance) e.frozenUntil = W.t + s.freezeT;
  if (s.burn) { e.burnDps = Math.max(e.burnUntil > W.t ? e.burnDps : 0, s.burn); e.burnUntil = W.t + (s.burnT || 3); e.burnSpread = s.spread || e.burnSpread; }
}

function damageEnemy(e, dmg, tw, dot = false, pierce = false) {
  if (!e.alive) return;
  if (!dot && !pierce) dmg = Math.max(1, dmg - e.armor);
  e.hp -= dmg;
  e.hitT = 0.08;
  if (e.hp <= 0) killEnemy(e, tw);
}

function killEnemy(e, tw) {
  e.alive = false;
  const m = R.mods;
  const trade = R.towers.some(t => t.adv === 'trade') ? 0.25 : 0;
  const late = Math.max(0.5, 1 - 0.05 * Math.max(0, R.wave - 9));
  const gold = Math.round(e.d.gold * late * (1 + (m.killGold || 0) + trade));
  R.gold += gold;
  if (gold) W.fx.push({ kind: 'text', x: e.x, y: e.y - 6, text: '+' + gold, t: 0.7, max: 0.7, color: '#ffd45c' });
  W.fx.push({ kind: 'poof', x: e.x, y: e.y, t: 0.3, max: 0.3 });
  if (tw) tw.kills = (tw.kills || 0) + 1;
  if (e.type === 'fogmage') { Save.data.stats.fog = (Save.data.stats.fog || 0) + 1; if (Save.data.stats.fog >= 10) achieve('fog10'); }
  if (e.d.split) for (let i = 0; i < e.d.split; i++) spawnEnemy('mini', { pos: Math.max(0, e.pos - i * 6), pi: e.pi });
  // 火の鳥：燃え移り
  if (e.burnUntil > W.t && e.burnSpread) {
    W.enemies.filter(o => o.alive && o !== e && Math.hypot(o.x - e.x, o.y - e.y) <= e.burnSpread).forEach(o => {
      o.burnDps = Math.max(o.burnDps, e.burnDps); o.burnUntil = W.t + 3; o.burnSpread = e.burnSpread;
    });
    W.fx.push({ kind: 'ring', x: e.x, y: e.y, r: e.burnSpread, t: 0.3, max: 0.3, color: '#ff6a3a' });
  }
  if (e.d.boss) { sfx('bossdown'); W.bossKilled = e.type; }
  else sfx('pop');
  if (W.meteorWatch) W.meteorWatch.n++;
}

function leak(e) {
  e.alive = false;
  const dmg = e.type === 'dragon' ? 20 : e.d.boss ? 5 : 1;
  R.life -= dmg;
  W.leaked = true;
  if (e.fly) W.leakedFly = true;
  if (e.d.jam) W.leakedJam = true;
  W.fx.push({ kind: 'flash', t: 0.25, max: 0.25 });
  sfx('hurt');
  if (R.life <= 0) { R.life = 0; W.running = false; onGameOver(); }
}

// ===== 呪文 =====
function castMeteor(x, y) {
  const S = SPELLS.meteor;
  W.meteorWatch = { n: 0 };
  W.enemies.filter(e => e.alive && Math.hypot(e.x - x, e.y - y) <= S.radius).forEach(e => damageEnemy(e, S.dmg * WAVE_HP(R.wave + 1) ** 0.5, null, false, true));
  if (W.meteorWatch.n >= 5) achieve('meteor5');
  W.meteorWatch = null;
  W.fx.push({ kind: 'ring', x, y, r: S.radius, t: 0.5, max: 0.5, color: '#ff5a3a' });
  W.fx.push({ kind: 'flash', t: 0.15, max: 0.15, color: 'rgba(255,160,80,.35)' });
  sfx('meteor');
}
function castTimestop() {
  W.timeStopUntil = W.t + SPELLS.timestop.dur;
  W.fx.push({ kind: 'flash', t: 0.3, max: 0.3, color: 'rgba(160,200,255,.35)' });
  sfx('timestop');
}

// ===== 描画 =====
function render(cx) {
  cx.imageSmoothingEnabled = false;
  cx.drawImage(mapCanvas(), 0, 0);
  const sel = UI.sel;
  // 空き台座の強調
  if (UI.mode === 'build') {
    for (const p of PADS) if (!R.towers.some(t => t.pad === p.i)) { cx.strokeStyle = 'rgba(255,212,92,.5)'; cx.strokeRect(p.x - 7.5, p.y - 5.5, 15, 12); }
  }
  // 射程
  if (sel != null) {
    const tw = R.towers.find(t => t.pad === sel);
    const p = PADS[sel];
    if (tw) {
      const s = towerStats(tw);
      const r = s.pulse || s.aura || s.range;
      if (r) { cx.fillStyle = 'rgba(255,255,255,.08)'; cx.strokeStyle = 'rgba(255,255,255,.4)'; cx.beginPath(); cx.arc(p.x, p.y, r, 0, 6.29); cx.fill(); cx.stroke(); }
    } else if (UI.preview) {
      const T = TOWERS[UI.preview];
      if (T.range) { cx.fillStyle = 'rgba(255,212,92,.08)'; cx.strokeStyle = 'rgba(255,212,92,.5)'; cx.beginPath(); cx.arc(p.x, p.y, T.range * (1 + (R.mods.range || 0)), 0, 6.29); cx.fill(); cx.stroke(); }
    }
    cx.strokeStyle = '#ffd45c'; cx.strokeRect(p.x - 8.5, p.y - 6.5, 17, 14);
  }
  // 塔
  for (const tw of R.towers) {
    const p = PADS[tw.pad];
    drawTower(cx, tw.type, p.x, p.y, tw.lvl, tw.adv);
    for (let i = 0; i < (tw.star || 0); i++) { cx.fillStyle = '#ffd45c'; cx.fillRect(p.x - 6 + i * 3, p.y - 12, 2, 2); }
  }
  if (!W) return;
  const now = W.t;
  // 敵（地上 → 空の順）
  const list = W.enemies.slice().sort((a, b) => (a.fly - b.fly) || (a.y - b.y));
  for (const e of list) {
    const sc = e.d.scale || 1;
    const img = spriteCanvas(e.d.spr);
    const w = 12 * sc;
    const bob = e.fly ? Math.sin(now * 8 + e.id) * 1.5 : 0;
    const x = Math.round(e.x - w / 2), y = Math.round(e.y - w + 3 + bob);
    if (e.fly) { cx.fillStyle = 'rgba(0,0,0,.25)'; cx.fillRect(Math.round(e.x - 3 * sc), Math.round(e.y + 4), Math.round(6 * sc), 2); }
    cx.drawImage(img, x, y, w, w);
    if (e.hitT > 0) { e.hitT -= 1 / 60; cx.fillStyle = 'rgba(255,255,255,.5)'; cx.fillRect(x + 2, y + 2, w - 4, w - 4); }
    if (e.frozenUntil > now || now < W.timeStopUntil) { cx.fillStyle = 'rgba(140,200,255,.45)'; cx.fillRect(x, y, w, w); }
    else if (e.slowUntil > now) { cx.fillStyle = '#7cc4e4'; cx.fillRect(x + w - 3, y, 2, 2); }
    if (e.burnUntil > now && Math.floor(now * 12) % 2) { cx.fillStyle = '#ff8a3c'; cx.fillRect(x + 2 + ((now * 20) % (w - 4) | 0), y + 1, 1, 2); }
    // HPバー
    if (e.hp < e.maxHp) {
      const bw = Math.max(10, w);
      cx.fillStyle = '#15101c'; cx.fillRect(Math.round(e.x - bw / 2), y - 3, bw, 2);
      cx.fillStyle = e.d.boss ? '#ff5c7a' : '#8fd16a'; cx.fillRect(Math.round(e.x - bw / 2), y - 3, Math.max(1, Math.round(bw * e.hp / e.maxHp)), 2);
    }
  }
  // 弾
  for (const pr of W.projs) {
    const col = { arrow: '#f6f1e4', rock: '#c8b8a0', ice: '#9fe0ff', fire: '#ff8a3c', bolt2: '#d9b066' }[pr.kind] || '#fff';
    cx.fillStyle = col;
    const sz = pr.kind === 'rock' ? 3 : 2;
    cx.fillRect(Math.round(pr.x - sz / 2), Math.round(pr.y - sz / 2), sz, sz);
  }
  // エフェクト
  for (const f of W.fx) {
    const a = f.t / f.max;
    if (f.kind === 'ring') { cx.strokeStyle = f.color; cx.globalAlpha = a; cx.beginPath(); cx.arc(f.x, f.y, f.r * (1.1 - a * 0.3), 0, 6.29); cx.stroke(); cx.globalAlpha = 1; }
    else if (f.kind === 'bolt') {
      cx.strokeStyle = '#ffe98a'; cx.globalAlpha = a; cx.beginPath(); cx.moveTo(f.x1, f.y1);
      const mx = (f.x1 + f.x2) / 2 + (Math.random() * 8 - 4), my = (f.y1 + f.y2) / 2 + (Math.random() * 8 - 4);
      cx.lineTo(mx, my); cx.lineTo(f.x2, f.y2); cx.stroke(); cx.globalAlpha = 1;
    } else if (f.kind === 'poof') { cx.fillStyle = `rgba(200,190,220,${a})`; const r = 6 * (1 - a) + 2; cx.fillRect(f.x - r, f.y - r / 2, r * 2, r); }
    else if (f.kind === 'text') { cx.globalAlpha = a; cx.fillStyle = f.color; cx.font = '8px monospace'; cx.fillText(f.text, f.x - 6, f.y - (1 - a) * 8); cx.globalAlpha = 1; }
    else if (f.kind === 'flash') { cx.fillStyle = f.color || `rgba(255,60,60,${0.3 * a})`; cx.fillRect(0, 0, MAP_W * TILE, MAP_H * TILE); }
  }
  if (now < W.timeStopUntil) { cx.fillStyle = 'rgba(120,160,255,.12)'; cx.fillRect(0, 0, MAP_W * TILE, MAP_H * TILE); }
  // 隕石の狙い
  if (UI.spellAim && UI.aim) {
    cx.strokeStyle = '#ff5a3a'; cx.beginPath(); cx.arc(UI.aim.x, UI.aim.y, SPELLS.meteor.radius, 0, 6.29); cx.stroke();
  }
}

// ===== js/game.js =====
// ===== 画面と流れ =====

const UI = { sel: null, mode: null, preview: null, spellAim: false, aim: null, speed: 1, paused: false, cv: null, cx: null, panelKey: '' };
const START_TOWERS = ['archer', 'stone'];

const unlocked = id => !!Save.data.unlocked[id];
function availableTowers() {
  return TOWER_ORDER.filter(t => START_TOWERS.includes(t) || unlocked('t_' + t) || R.runTowers.includes(t));
}
// 呪文は最初は持っていない。星の祭壇で解放するか、ウェーブの合間の選択で手に入れる
function availableSpells() {
  return ['meteor', 'timestop', 'rewrite'].filter(id => unlocked('s_' + id) || (R && (R.runSpells || []).includes(id)));
}
function advOptions(type) {
  const keys = Object.keys(TOWERS[type].adv);
  return unlocked('adv2') ? keys : keys.slice(0, 1);
}

function achieve(id) {
  if (!Save.data || Save.data.ach[id]) return;
  Save.data.ach[id] = Date.now();
  Save.data.stars += 2;
  Save.write();
  sfx('learn');
  const a = ACHIEVEMENTS.find(x => x.id === id);
  toast(`実績「${a.name}」達成！　星+2`, 'memory');
}
function seeEnemy(type) {
  const c = Save.data.codex.enemies;
  if (c[type]) return;
  c[type] = 1;
  if (ENEMY_ORDER.every(t => c[t])) achieve('codex_enemy');
}

// ===== 挑戦の開始 =====
// 出撃：ふつう（昇格0）はいつも最初のマップ。昇格1以上は、5つの戦場からランダムに飛ばされる
function sortie() {
  Sound.init();
  const asc = Save.data.asc || 0;
  const id = asc > 0 ? pick(MAP_ORDER) : 'forest';
  newRun(id);
  if (asc > 0) toast(`今回の戦場：${MAPS[id].name}（難易度 ${diffLabel(id)}）`, 'item');
}

function newRun(mapId = 'forest') {
  const S = Save.data;
  R = {
    wave: 0, life: 20 + (unlocked('life1') ? 5 : 0) + (unlocked('life2') ? 5 : 0),
    gold: 150 + (unlocked('gold1') ? 50 : 0) + (unlocked('gold2') ? 50 : 0) + (unlocked('gold3') ? 50 : 0),
    rerolls: unlocked('u_reroll') ? 2 : 0,
    towers: [], runTowers: [], runSpells: [], picks: [], curses: 0, built: 0, bosses: 0, attackTypes: [],
    mods: { dmg: {}, splash: {}, dmgAll: (unlocked('u_drill1') ? 0.05 : 0) + (unlocked('u_drill2') ? 0.05 : 0), spellCd: unlocked('u_spell') ? -0.15 : 0 },
    prophecy: unlocked('p2') ? 2 : unlocked('p1') ? 1 : 0,
    spellCd: { meteor: 0, timestop: 0 }, lastRewrite: -99, phase: 'build',
  };
  R.maxLife = R.life;
  R.map = mapId;
  R.visited = [R.map];
  setMap(R.map);
  visitMap(R.map);
  S.stats.runs = (S.stats.runs || 0) + 1;
  prepareWave();
  enterBuild();
}

function enterBuild() {
  R.phase = 'build';
  W = newBattleState();
  UI.sel = null; UI.mode = null; UI.spellAim = false;
  Save.data.run = JSON.parse(JSON.stringify(R));
  Save.write();
  showRunScreen();
}

// ===== 戦闘画面 =====
function showRunScreen() {
  const cv = h('canvas', { id: 'cv', width: MAP_W * TILE, height: MAP_H * TILE });
  const el = h('div', { class: 'run' },
    h('div', { class: 'hud', id: 'hud' }),
    h('div', { class: 'stage' }, cv),
    h('div', { class: 'spells', id: 'spells' }),
    h('div', { class: 'phasebar', id: 'phasebar' }),
    h('div', { class: 'panel', id: 'panel' }));
  setScreen(el, runKeys);
  UI.cv = cv; UI.cx = cv.getContext('2d');
  cv.addEventListener('pointerdown', onCanvasTap);
  cv.addEventListener('pointermove', e => { if (UI.spellAim) UI.aim = toLogical(e); });
  UI.panelKey = '';
  refreshUI(true);
}

function toLogical(e) {
  const r = UI.cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (MAP_W * TILE) / r.width, y: (e.clientY - r.top) * (MAP_H * TILE) / r.height };
}

function onCanvasTap(e) {
  if (!R || R.phase === 'over') return;
  const p = toLogical(e);
  if (UI.spellAim) {
    if (R.phase !== 'wave') return;
    castMeteor(p.x, p.y);
    R.spellCd.meteor = SPELLS.meteor.cd * (1 + (R.mods.spellCd || 0));
    W.spellUsed = true;
    UI.spellAim = false; UI.aim = null;
    refreshUI(true);
    return;
  }
  // スマホでも押しやすいよう、いちばん近い台座を広めの範囲で拾う（台座どうしは十分離れている）
  const pad = PADS.map(q => ({ q, d: Math.hypot(q.x - p.x, q.y - p.y) })).filter(o => o.d <= 18).sort((a, b) => a.d - b.d).map(o => o.q)[0];
  if (!pad) { UI.sel = null; UI.mode = null; UI.preview = null; refreshUI(true); return; }
  sfx('select');
  UI.sel = pad.i;
  UI.mode = R.towers.some(t => t.pad === pad.i) ? 'tower' : 'build';
  UI.preview = null;
  refreshUI(true);
}

function runKeys(e) {
  if (!R) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter') { e.preventDefault(); if (R.phase === 'build') beginWave(); }
  else if (k === 'f') toggleSpeed();
  else if (k === 'p') togglePause();
  else if (k === 'escape') { UI.sel = null; UI.mode = null; UI.spellAim = false; refreshUI(true); }
  else if (k === 'q') useSpell(availableSpells()[0]);
  else if (k === 'w') useSpell(availableSpells()[1]);
  else if (k === 'e') useSpell(availableSpells()[2]);
  else if (UI.mode === 'build') {
    const n = parseInt(k, 10);
    const list = availableTowers();
    if (n >= 1 && n <= list.length) build(list[n - 1]);
  }
}

function beginWave() {
  if (R.phase !== 'build') return;
  R.next.questActive = R.prophecy >= 1;
  startWave();
  sfx('horn');
  refreshUI(true);
}
function toggleSpeed() { UI.speed = UI.speed === 1 ? 2 : UI.speed === 2 ? 3 : 1; refreshUI(true); }
function togglePause() { UI.paused = !UI.paused; refreshUI(true); }

// ===== 建設・強化 =====
function build(type) {
  if (UI.sel == null || R.towers.some(t => t.pad === UI.sel)) return;
  const c = buildCost(type);
  if (R.gold < c) { sfx('deny'); toast('金貨が足りない'); return; }
  if (UI.preview !== type) { UI.preview = type; refreshUI(true); return; } // 1回目は確認（射程を表示）
  R.gold -= c;
  R.towers.push({ pad: UI.sel, type, lvl: 1, adv: null, target: 'first', spent: c, cd: 0, kills: 0 });
  R.built++;
  if (R.built >= 12) achieve('build12');
  if (!['shrine', 'mine'].includes(type) && !R.attackTypes.includes(type)) R.attackTypes.push(type);
  Save.data.codex.towers[type] = 1;
  sfx('build');
  UI.mode = 'tower'; UI.preview = null;
  refreshUI(true);
}
function selTower() { return R.towers.find(t => t.pad === UI.sel); }
function upgrade() {
  const tw = selTower();
  if (!tw || tw.lvl >= 3 || tw.adv) return;
  const c = upgradeCost(tw);
  if (R.gold < c) { sfx('deny'); toast('金貨が足りない'); return; }
  R.gold -= c; tw.spent += c; tw.lvl++;
  sfx('build');
  refreshUI(true);
}
function promote(key) {
  const tw = selTower();
  if (!tw || tw.lvl < 3 || tw.adv) return;
  const c = advCost(tw);
  if (R.gold < c) { sfx('deny'); toast('金貨が足りない'); return; }
  R.gold -= c; tw.spent += c; tw.adv = key;
  if (TOWERS[tw.type].adv[key].target) tw.target = TOWERS[tw.type].adv[key].target;
  Save.data.codex.classes[key] = 1;
  achieve('adv_first');
  if (Object.keys(Save.data.codex.classes).length >= 8) achieve('adv_8');
  sfx('learn');
  toast(`${TOWERS[tw.type].name} → ${TOWERS[tw.type].adv[key].name} に転職した`, 'item');
  refreshUI(true);
}
function starCost(tw) { return Math.round(ADV_COST(tw.type) * costMult() * 0.5 * Math.pow(1.45, tw.star || 0) * (unlocked('u_starcost') ? 0.8 : 1)); }
function sellRate() { return unlocked('u_refund') ? 0.9 : 0.7; }
// 上級職のあと、もう一方の上級職に乗り換える（極めの★は引き継ぐ）
function reclass(key) {
  const tw = selTower();
  if (!tw || !tw.adv || tw.adv === key || !advOptions(tw.type).includes(key)) return;
  const c = reclassCost();
  if (R.gold < c) { sfx('deny'); toast('金貨が足りない'); return; }
  R.gold -= c; tw.spent += c; tw.adv = key;
  const A = TOWERS[tw.type].adv[key];
  tw.target = A.target || 'first';
  Save.data.codex.classes[key] = 1;
  if (Object.keys(Save.data.codex.classes).length >= 8) achieve('adv_8');
  sfx('learn');
  toast(`${A.name} に転職し直した`, 'item');
  refreshUI(true);
}
function master() {
  const tw = selTower();
  if (!tw || !tw.adv || (tw.star || 0) >= STAR_MAX) return;
  const c = starCost(tw);
  if (R.gold < c) { sfx('deny'); toast('金貨が足りない'); return; }
  R.gold -= c; tw.spent += c; tw.star = (tw.star || 0) + 1;
  if (tw.star >= STAR_MAX) achieve('star5');
  sfx('learn');
  refreshUI(true);
}
// 売る前に確認する（強化ボタンの連打で誤って売らないように）
async function confirmSell() {
  const tw = selTower();
  if (!tw) return;
  const T = TOWERS[tw.type];
  const name = tw.adv ? T.adv[tw.adv].name : `${T.name} Lv${tw.lvl}`;
  const gain = Math.round(tw.spent * sellRate());
  const ok = await Modal.open('塔を売る', close => h('div', {},
    h('div', { class: 'mb' }, `「${name}」を売りますか？（金貨 +${gain}）`),
    h('div', { class: 'row-gap' },
      h('button', { class: 'btn', onclick: () => close(false) }, 'やめる'),
      h('button', { class: 'btn danger', onclick: () => close(true) }, '売る'))));
  if (ok && selTower() === tw) sell();
}

function sell() {
  const tw = selTower();
  if (!tw) return;
  R.gold += Math.round(tw.spent * sellRate());
  R.towers = R.towers.filter(t => t !== tw);
  sfx('buy');
  UI.mode = 'build';
  refreshUI(true);
}
function setTarget(mode) { const tw = selTower(); if (tw) { tw.target = mode; sfx('select'); refreshUI(true); } }

// ===== 呪文 =====
function spellReady(id) {
  if (id === 'rewrite') return R.phase === 'build' && R.prophecy >= 1 && R.wave - R.lastRewrite >= SPELLS.rewrite.waves;
  return R.phase === 'wave' && (R.spellCd[id] || 0) <= 0;
}
function useSpell(id) {
  if (!id || !R) return;
  if (!spellReady(id)) { sfx('deny'); return; }
  if (id === 'meteor') { UI.spellAim = !UI.spellAim; toast('マップをタップして、隕石を落とす場所を選ぶ'); refreshUI(true); return; }
  if (id === 'timestop') {
    castTimestop();
    R.spellCd.timestop = SPELLS.timestop.cd * (1 + (R.mods.spellCd || 0));
    W.spellUsed = true;
    refreshUI(true);
    return;
  }
  if (id === 'rewrite') openRewrite();
}

async function openRewrite() {
  const types = R.next.comp.map(([t]) => t).filter(t => t !== 'goblin' && !ENEMIES[t].boss);
  if (!types.length) { toast('書き換えられる敵がいない'); return; }
  const r = await Modal.open('予知の書き換え', close => h('div', {},
    h('div', { class: 'dim small mb' }, '次のウェーブの敵を1種類、ゴブリンに書き換える。'),
    h('div', { class: 'pick-list' }, types.map(t => h('button', { class: 'btn pick-row', onclick: () => close(t) },
      sprImg(ENEMIES[t].spr, 24), h('span', {}, ENEMIES[t].name))))));
  if (!r) return;
  const merged = {};
  R.next.comp.forEach(([t, n]) => { const k = t === r ? 'goblin' : t; merged[k] = (merged[k] || 0) + n; });
  R.next.comp = Object.entries(merged);
  R.next.jammed = R.next.comp.some(([t]) => ENEMIES[t].jam) || R.next.randJam;
  R.lastRewrite = R.wave;
  achieve('rewrite');
  sfx('timestop');
  toast(`${ENEMIES[r].name}を、ゴブリンに書き換えた`, 'item');
  Save.data.run = JSON.parse(JSON.stringify(R)); Save.write();
  refreshUI(true);
}

// ===== ウェーブ終了・勝敗 =====
async function onWaveCleared() {
  const w = R.wave + 1;
  R.wave = w;
  const msgs = [];
  // ボス
  if (W.bossKilled) {
    R.bosses++;
    if (W.bossKilled === 'ogre') achieve('boss1');
    if (W.bossKilled === 'wyvern') achieve('boss2');
    if (W.bossKilled === 'lich') achieve('boss3');
    if (!W.leaked) achieve('perfect_boss');
    W.bossKilled = null;
    if (unlocked('u_boss')) { R.gold += 80; msgs.push('賞金 +80'); }
  }
  // 金鉱・銀行
  let income = 0, interest = 0;
  for (const tw of R.towers) {
    if (tw.type !== 'mine') continue;
    const A = tw.adv ? TOWERS.mine.adv[tw.adv] : null;
    income += Math.round((A ? A.income : TOWERS.mine.income * (1 + 0.6 * (tw.lvl - 1))) * (1 + 0.25 * (tw.star || 0)));
    if (A && A.interest) interest += Math.min(60, Math.round(R.gold * A.interest));
  }
  if (income) { R.gold += income; msgs.push(`金鉱 +${income}`); }
  if (interest) { R.gold += interest; msgs.push(`利子 +${interest}`); }
  // クエスト
  if (R.next.questActive) {
    const q = R.next.quest;
    const ok = q === 'noLeak' ? !W.leaked : q === 'noFly' ? !W.leakedFly : q === 'noSpell' ? !W.spellUsed : q === 'fast' ? W.t <= 70 : !W.leakedJam;
    if (ok) {
      const rw = Math.round(QUESTS[q].reward * (unlocked('u_quest') ? 1.5 : 1));
      R.gold += rw;
      msgs.push(`クエスト達成 +${rw}`);
      Save.data.stats.quests = (Save.data.stats.quests || 0) + 1;
      if (Save.data.stats.quests >= 10) achieve('quest10');
    }
  }
  if ((R.next.affix || []).length >= 2) achieve('affix2');
  const wb = Math.round((10 + w * 2) * (unlocked('u_wave') ? 1.3 : 1));
  R.gold += wb;
  msgs.unshift(`ウェーブ報酬 +${wb}`);
  if (w >= 10 && R.attackTypes.length === 1) achieve('mono');
  sfx('win');
  toast(`第${w}波をしのいだ！　` + msgs.join('　'), 'item');
  if (w >= WAVES.length) { victory(); return; }
  await draftPick();
  prepareWave();
  enterBuild();
}

function visitMap(id) {
  const S = Save.data;
  S.stats.maps = S.stats.maps || {};
  S.stats.maps[id] = 1;
  if (MAP_ORDER.every(m => S.stats.maps[m])) achieve('maps5');
}

function draftOptions() {
  const pool = [];
  const lockedTowers = TOWER_ORDER.filter(t => !availableTowers().includes(t));
  for (const d of DRAFTS) {
    if (d.id === 'prophecy' && R.prophecy >= 2) continue;
    if (d.mod && d.mod.dmg && !Object.keys(d.mod.dmg).every(t => availableTowers().includes(t))) continue;
    if (d.mod && d.mod.splash && !availableTowers().includes('stone')) continue;
    if (d.id === 'ice_slow' && !availableTowers().includes('ice')) continue;
    if (d.id === 'fire_burn' && !availableTowers().includes('fire')) continue;
    if (d.id === 'thunder_chain' && !availableTowers().includes('thunder')) continue;
    pool.push(d);
  }
  const opts = [];
  // 新しい呪文（予知の書き換えは、予知の力があるときだけ）
  const lockedSpells = ['meteor', 'timestop', 'rewrite'].filter(id => !availableSpells().includes(id) && (id !== 'rewrite' || R.prophecy >= 1));
  if (lockedSpells.length && Math.random() < 0.4) {
    const id = pick(lockedSpells);
    opts.push({ id: 'spell_' + id, kind: 'spell', spell: id, name: `新しい呪文：${SPELLS[id].name}`, desc: `この挑戦のあいだ使える。${SPELLS[id].desc}` });
  }
  if (lockedTowers.length && Math.random() < 0.7) {
    const t = pick(lockedTowers);
    opts.push({ id: 'tower_' + t, kind: 'tower', tower: t, name: `新しい塔：${TOWERS[t].name}`, desc: `この挑戦のあいだ「${TOWERS[t].name}」を建てられる。${TOWERS[t].desc}` });
  }
  shuffle(pool);
  const n = unlocked('u_four') ? 4 : 3;
  for (const d of pool) { if (opts.length >= n) break; if (!opts.some(o => o.id === d.id)) opts.push(d); }
  return shuffle(opts);
}

async function draftPick() {
  let opts = draftOptions();
  const kindJp = { tower: '塔', spell: '呪文', mod: '強化', curse: '代償つき', util: 'その他' };
  const r = await Modal.open(`第${R.wave}波をしのいだ　─　ひとつ選ぶ`, close => h('div', {},
    h('div', { class: 'draft' }, opts.map((o, i) => h('button', { class: 'draft-card k-' + o.kind, onclick: () => close(i) },
      h('div', { class: 'dc-kind' }, kindJp[o.kind]),
      o.tower ? towerImg(o.tower, 32) : null,
      h('div', { class: 'dc-name' }, o.name),
      h('div', { class: 'dc-desc' }, o.desc)))),
    h('div', { class: 'center mt row-gap' },
      R.rerolls > 0 ? h('button', { class: 'btn small', onclick: () => close(-2) }, `引き直す（残り${R.rerolls}回）`) : null,
      h('button', { class: 'btn small', onclick: () => close(-1) }, '選ばない（金貨+30）'))), { closable: false, wide: true });
  if (r === -2) { R.rerolls--; sfx('select'); return draftPick(); }
  if (r == null || r < 0) { R.gold += 30; return; }
  applyDraft(opts[r]);
}

function applyDraft(o) {
  R.picks.push(o.id);
  sfx('buy');
  if (o.kind === 'tower') { R.runTowers.push(o.tower); return; }
  if (o.kind === 'spell') { R.runSpells.push(o.spell); toast(`呪文「${SPELLS[o.spell].name}」を覚えた`, 'item'); return; }
  if (o.kind === 'curse') { R.curses++; if (R.curses >= 3) achieve('curse3'); }
  if (o.gold) R.gold += o.gold;
  if (o.life) { R.maxLife += o.life; R.life = Math.max(1, Math.min(R.maxLife, R.life + o.life)); }
  if (o.prophecy) { R.prophecy = Math.min(2, R.prophecy + o.prophecy); if (R.prophecy >= 2) achieve('p2'); }
  if (o.mod) {
    const m = R.mods;
    for (const k in o.mod) {
      const v = o.mod[k];
      if (typeof v === 'object') { m[k] = m[k] || {}; for (const t in v) m[k][t] = (m[k][t] || 0) + v[t]; }
      else m[k] = (m[k] || 0) + v;
    }
  }
}

function runStars(win) {
  return Math.floor(R.wave / 2) + R.bosses + (win ? 4 : 0);
}

function victory() {
  R.phase = 'over';
  achieve('clear');
  const S = Save.data;
  if (S.asc >= 1) achieve('asc1');
  S.maxAsc = Math.max(S.maxAsc || 0, (S.asc || 0) + 1);
  S.stats.clears = (S.stats.clears || 0) + 1;
  endRun(true);
}

function onGameOver() {
  R.phase = 'over';
  sfx('die');
  setTimeout(() => endRun(false), 700);
}

function endRun(win) {
  const S = Save.data;
  const stars = runStars(win);
  S.stars += stars;
  S.stats.bestWave = Math.max(S.stats.bestWave || 0, R.wave);
  S.run = null;
  Save.write();

function refreshUI(force = false) {
  if (!R || !$('#hud')) return;
  const hud = $('#hud');
  hud.innerHTML = '';
  hud.append(
    h('span', { class: 'hud-item' + (R.life <= 5 ? ' danger' : '') }, sprImg('i_heart', 14), `${R.life}/${R.maxLife}`),
    h('span', { class: 'hud-item gold' }, sprImg('i_coin', 14), String(R.gold)),

    h('span', { class: 'hud-sp' }),
    h('button', { class: 'btn small', onclick: toggleSpeed, title: '速度 (F)' }, `×${UI.speed}`),
    h('button', { class: 'btn small', onclick: togglePause, title: '一時停止 (P)' }, UI.paused ? '▶' : '❚❚'),
    h('button', { class: 'btn small', onclick: runMenu }, '≡'));
  if (R.gold >= 800) achieve('rich');
  // 呪文
  const sp = $('#spells');
  sp.innerHTML = '';
  if (!availableSpells().length) sp.appendChild(h('div', { class: 'dim tiny' }, '呪文：まだ持っていない（波の合間の選択・星の祭壇で手に入る）'));
  availableSpells().forEach((id, i) => {
    const S = SPELLS[id];
    const ready = spellReady(id);
    let label = S.name;
    if (id !== 'rewrite' && R.spellCd[id] > 0) label += ` ${Math.ceil(R.spellCd[id])}`;
    if (id === 'rewrite' && R.wave - R.lastRewrite < SPELLS.rewrite.waves) label += `（あと${SPELLS.rewrite.waves - (R.wave - R.lastRewrite)}波）`;
    sp.appendChild(h('button', { class: 'btn small spell' + (ready ? ' ready' : '') + (UI.spellAim && id === 'meteor' ? ' aiming' : ''), title: S.desc, onclick: () => useSpell(id) }, `${'QWE'[i] || ''} ${label}`));
  });
  // 開始ボタン
  const pb = $('#phasebar');
  pb.innerHTML = '';
  if (R.phase === 'build') pb.appendChild(h('button', { class: 'btn primary wide', onclick: beginWave }, `第${R.wave + 1}波をむかえ撃つ ▶（Space）`));
  else if (R.phase === 'wave') pb.appendChild(h('div', { class: 'dim small center' }, `戦闘中……　残り ${W.queue.length + W.enemies.length}体`));
  // パネル
  const key = [UI.mode, UI.sel, UI.preview, R.phase, R.gold, R.prophecy, R.lastRewrite, (selTower() || {}).lvl, (selTower() || {}).adv, (selTower() || {}).target, (selTower() || {}).star, R.map].join('|');
  if (force || key !== UI.panelKey) { UI.panelKey = key; drawPanel(); }
}

function towerPanel() {
  const tw = selTower();
  const T = TOWERS[tw.type];
  const s = towerStats(tw);
  const name = tw.adv ? `${T.adv[tw.adv].name} Lv4${tw.star ? ' ' + '★'.repeat(tw.star) : ''}` : `${T.name} Lv${tw.lvl}`;
  const stats = [];
  if (s.dmg) stats.push(`攻撃 ${Math.round(s.dmg)}`);
  if (s.dmg || s.aura) stats.push(`間隔 ${s.rate.toFixed(2)}秒`);
  if (s.range && T.range) stats.push(`射程 ${Math.round(s.pulse || s.aura || s.range)}`);
  if (tw.type === 'shrine') stats.push(`強化 +${Math.round(((tw.adv && T.adv[tw.adv].buff) || T.buff * (1 + 0.3 * (tw.lvl - 1))) * 100)}%`);
  if (tw.type === 'mine') stats.push(`収入 ${tw.adv ? T.adv[tw.adv].income : Math.round(T.income * (1 + 0.6 * (tw.lvl - 1)))}/波`);
  if (tw.kills) stats.push(`撃破 ${tw.kills}`);
  const attacks = !['shrine', 'mine'].includes(tw.type) && !s.aura && !s.pulse && s.proj !== 'storm';
  const actions = [];
  if (!tw.adv && tw.lvl < 3) {
    const c = upgradeCost(tw);
    actions.push(h('button', { class: 'btn small' + (R.gold < c ? ' short' : ''), onclick: upgrade }, `強化 Lv${tw.lvl + 1}（`, sprImg('i_coin', 10), `${c}）`));

    advBox = h('div', { class: 'job-box' },
      h('div', { class: 'small' }, 'Lv4に強化：上級職を選ぶ（', sprImg('i_coin', 10), `${c}）`),

      })));
  }
  // 上級職のあと：もう一方の上級職へ転職し直す
  if (tw.adv) {
    const others = Object.keys(T.adv).filter(k => k !== tw.adv);
    const c = reclassCost();
    advBox = h('div', { class: 'job-box re' },
      h('div', { class: 'small' }, '別の上級職に転職し直す（', sprImg('i_coin', 10), `${c}）　★はそのまま`),
      h('div', { class: 'job-row' }, others.map(k => {
        const ok = advOptions(tw.type).includes(k);
        return h('button', { class: 'btn small job-btn' + (ok ? '' : ' locked') + (R.gold < c ? ' short' : ''), disabled: !ok, onclick: () => reclass(k) },
          h('div', {}, ok ? T.adv[k].name : '？？？'), h('div', { class: 'dim tiny' }, ok ? T.adv[k].desc : '星の祭壇「もうひとつの上級職」で解放'));
      })));
  }
  if (tw.adv && (tw.star || 0) < STAR_MAX) {
    const c = starCost(tw);
    actions.push(h('button', { class: 'btn small' + (R.gold < c ? ' short' : ''), onclick: master }, `極める ★${(tw.star || 0) + 1}（`, sprImg('i_coin', 10), `${c}）`));
  }
  // 売るボタンは強化ボタンと別の行・右端に置く

    advBox,

// ===== メインループ =====
let lastT = 0, hudTick = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
  lastT = t;
  if (!R || !UI.cx || !document.body.contains(UI.cv)) return;
  if (!UI.paused && R.phase === 'wave' && !Modal.active) {
    const steps = UI.speed;
    for (let i = 0; i < steps; i++) {
      step(dt);
      for (const k in R.spellCd) if (R.spellCd[k] > 0) R.spellCd[k] -= dt;
      if (!W.running) break;
    }
  }
  render(UI.cx);
  if (++hudTick % 10 === 0) refreshUI();
}
requestAnimationFrame(frame);
