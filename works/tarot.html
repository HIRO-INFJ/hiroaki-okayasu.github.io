<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タロット占い</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0d0a12;
      --bg-card: #16101f;
      --gold: #c9a227;
      --gold-light: #e8d48a;
      --purple: #4a2c6a;
      --purple-light: #7b5a9e;
      --text: #e8e0f0;
      --text-muted: #9a8fb0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Serif JP', 'Cormorant Garamond', serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 星空背景 */
    .stars {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(74, 44, 106, 0.4), transparent),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(201, 162, 39, 0.08), transparent),
        var(--bg-deep);
      pointer-events: none;
      z-index: 0;
    }

    .stars::before,
    .stars::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20px 30px, rgba(255, 255, 255, 0.4), transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(2px 2px at 50px 160px, rgba(255, 255, 255, 0.35), transparent),
        radial-gradient(2px 2px at 90px 40px, rgba(255, 255, 255, 0.25), transparent),
        radial-gradient(2px 2px at 130px 80px, rgba(255, 255, 255, 0.3), transparent);
      background-size: 200px 200px;
      animation: twinkle 8s ease-in-out infinite;
      opacity: 0.8;
    }

    .stars::after {
      background-position: 100px 50px;
      animation-delay: -4s;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 600;
      color: var(--gold-light);
      letter-spacing: 0.15em;
      text-shadow: 0 0 30px rgba(201, 162, 39, 0.3);
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      letter-spacing: 0.2em;
    }

    .birthdate-section {
      width: 100%;
      max-width: 560px;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .birthdate-section label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }

    .birthdate-section input[type="date"] {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--purple-light);
      background: rgba(22, 16, 31, 0.8);
      color: var(--text);
      border-radius: 6px;
      max-width: 12rem;
    }

    .birthdate-section input[type="date"]:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(201, 162, 39, 0.2);
    }

    .genre-section {
      width: 100%;
      max-width: 560px;
      margin-bottom: 1.5rem;
    }

    .genre-section h2 {
      font-size: 0.85rem;
      color: var(--gold);
      letter-spacing: 0.15em;
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .genre-choices {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }

    .genre-btn {
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.5rem 1rem;
      border: 1px solid var(--purple-light);
      background: rgba(74, 44, 106, 0.25);
      color: var(--text);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .genre-btn:hover {
      background: rgba(74, 44, 106, 0.5);
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .genre-btn.active {
      background: var(--purple);
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .spread-choices {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .spread-btn {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.65rem 1.4rem;
      border: 1px solid var(--purple-light);
      background: rgba(74, 44, 106, 0.3);
      color: var(--text);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .spread-btn:hover {
      background: rgba(74, 44, 106, 0.6);
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .spread-btn.active {
      background: var(--purple);
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .draw-area {
      width: 100%;
      min-height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .card-slot {
      width: 120px;
      height: 200px;
      perspective: 1000px;
    }

    .card-slot.spread-3 .card-slot {
      width: 110px;
      height: 184px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .card-back {
      background: linear-gradient(145deg, var(--purple) 0%, var(--bg-card) 100%);
      border: 2px solid var(--gold);
    }

    .card-back::before {
      content: '✦';
      font-size: 2.5rem;
      color: var(--gold);
      opacity: 0.7;
    }

    .card-front {
      background: linear-gradient(160deg, var(--bg-card) 0%, #1e1528 100%);
      border: 1px solid rgba(201, 162, 39, 0.4);
      transform: rotateY(180deg);
      text-align: center;
    }

    .card-name-ja {
      font-size: 0.75rem;
      color: var(--gold-light);
      margin-bottom: 0.25rem;
      line-height: 1.3;
    }

    .card-name-en {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .card-meaning {
      font-size: 0.7rem;
      color: var(--text);
      line-height: 1.5;
    }

    .card.reversed .card-front {
      transform: rotateY(180deg) rotate(180deg);
    }

    .card.reversed .card-name-ja::after {
      content: '（逆位置）';
      display: block;
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .draw-btn {
      font-family: inherit;
      font-size: 1.1rem;
      padding: 1rem 2.5rem;
      border: 2px solid var(--gold);
      background: transparent;
      color: var(--gold-light);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.15em;
    }

    .draw-btn:hover {
      background: rgba(201, 162, 39, 0.15);
      box-shadow: 0 0 24px rgba(201, 162, 39, 0.2);
    }

    .draw-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-section {
      margin-top: 1.5rem;
      padding: 1.5rem;
      background: rgba(22, 16, 31, 0.8);
      border-radius: 12px;
      border: 1px solid rgba(201, 162, 39, 0.2);
      max-width: 640px;
      width: 100%;
      max-height: 70vh;
      overflow-y: auto;
    }

    .result-section h3 {
      font-size: 0.9rem;
      color: var(--gold);
      margin-bottom: 0.75rem;
      margin-top: 1rem;
      letter-spacing: 0.1em;
    }

    .result-section h3:first-child {
      margin-top: 0;
    }

    .result-section .birthdate-message {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(201, 162, 39, 0.15);
    }

    .result-section .genre-intro {
      font-size: 0.9rem;
      line-height: 1.9;
      color: var(--gold-light);
      margin-bottom: 0.75rem;
      padding-left: 0.5rem;
      border-left: 3px solid var(--gold);
    }

    .result-section p {
      font-size: 0.9rem;
      line-height: 1.9;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .spread-labels {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .spread-labels span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <div class="stars"></div>
  <div class="container">
    <header>
      <h1>タロット占い</h1>
      <p class="subtitle">Major Arcana</p>
    </header>

    <div class="birthdate-section">
      <label for="birthdate">生年月日（任意）</label>
      <input type="date" id="birthdate" name="birthdate" aria-label="生年月日">
    </div>

    <div class="genre-section">
      <h2>何を占いたい？</h2>
      <div class="genre-choices" id="genreChoices">
        <button type="button" class="genre-btn active" data-genre="総合">総合</button>
        <button type="button" class="genre-btn" data-genre="恋愛">恋愛</button>
        <button type="button" class="genre-btn" data-genre="仕事・キャリア">仕事・キャリア</button>
        <button type="button" class="genre-btn" data-genre="金運">金運</button>
        <button type="button" class="genre-btn" data-genre="健康">健康</button>
        <button type="button" class="genre-btn" data-genre="人間関係">人間関係</button>
        <button type="button" class="genre-btn" data-genre="スピリチュアル・成長">スピリチュアル・成長</button>
      </div>
    </div>

    <div class="spread-choices">
      <button type="button" class="spread-btn active" data-spread="1">1枚引き</button>
      <button type="button" class="spread-btn" data-spread="3">3枚スプレッド（過去・現在・未来）</button>
    </div>

    <div class="draw-area" id="drawArea"></div>

    <button type="button" class="draw-btn" id="drawBtn">カードを引く</button>

    <div class="result-section" id="resultSection" style="display: none;">
      <div class="spread-labels" id="spreadLabels"></div>
      <div id="resultContent"></div>
    </div>
  </div>

  <script>
    const GENRES = ['総合', '恋愛', '仕事・キャリア', '金運', '健康', '人間関係', 'スピリチュアル・成長'];

    const MAJOR_ARCANA = [{
        id: 0,
        nameJa: '愚者',
        nameEn: 'The Fool',
        shortMeaning: '新しい始まり、自由、無邪気、冒険心。純粋な一歩を踏み出すとき。',
        shortMeaningRev: '軽率、リスクの無視。よく考えてから動くこと。',
        meaning: '愚者は「0」のカードであり、すべての始まりを象徴しています。過去のしがらみや常識に縛られず、純粋な心で新しい一歩を踏み出そうとしている姿が描かれています。このカードが正位置で出たとき、あなたの人生に新しい章が開こうとしているか、これまでにない選択や挑戦が訪れていることを示しています。失敗を恐れず、好奇心と信頼を持って進むことが大切です。ただし、無謀にならないよう、直感と理性のバランスを保ちながら、自分らしいペースで歩んでいきましょう。',
        meaningRev: '逆位置の愚者は、新しいことを始めたい気持ちはあるものの、準備不足や軽率さが目立つ時期を示します。リスクを甘く見ていたり、周囲の助言に耳を貸さずに突き進もうとしているかもしれません。一度立ち止まり、本当に自分が望んでいる方向か、必要な準備は整っているかを冷静に確認することが求められます。また、現実逃避や責任からの逃走という意味合いもあり、その場合は正面から向き合う勇気がメッセージです。',
        byGenre: {
          恋愛: {
            intro: '恋愛において、新しい出会いや新しい関係への一歩、あるいは気持ちを伝える決意のときです。',
            introRev: '恋愛では、軽い気持ちで人を傷つけたり、本気度が伝わっていない可能性があります。'
          },
          '仕事・キャリア': {
            intro: '転職、新しいプロジェクト、副業など、仕事で新しい挑戦をするのに良い流れです。',
            introRev: '仕事では計画不足や確認不足でミスが出やすい時期。慎重に。'
          },
          金運: {
            intro: '新しい投資や副業など、これまでと違うお金の流れを試すチャンスです。',
            introRev: '金運では衝動買いや甘い話に注意。よく調べてから動きましょう。'
          },
          健康: {
            intro: '新しい習慣や運動、食事の見直しなど、心身をリセットするのに向いています。',
            introRev: '健康面では無理や不規則な生活がたたりやすい時期です。'
          },
          人間関係: {
            intro: '新しい友人やコミュニティとの縁が広がり、視野が広がる暗示です。',
            introRev: '人間関係では不用意な発言や約束をしがち。言葉に責任を持って。'
          },
          'スピリチュアル・成長': {
            intro: '魂レベルで新しい学びや気づきの扉が開き、素直に受け取る時期です。',
            introRev: '成長においては、逃げや言い訳を手放し、自分と向き合うことがテーマです。'
          }
        }
      },
      {
        id: 1,
        nameJa: '魔術師',
        nameEn: 'The Magician',
        shortMeaning: '創造力、意志の力、スキル。あなたに必要なものはすでに揃っている。',
        shortMeaningRev: '未熟、ごまかし。本質に目を向ける。',
        meaning: '魔術師は「地・水・火・風」の四大元素を自在に操り、思いを形にする力を象徴しています。テーブルの上には必要な道具がすべて揃い、天と地をつなぐポーズで、あなたに「すでに能力と環境は整っている」と伝えています。正位置の魔術師は、新しいことを始めるのに最適なタイミングであり、意志と集中力さえあれば現実を動かせることを示します。ただし、才能を正しく使う責任も問われています。アイデアを具体化し、言葉や行動に落とし込むことで、望む結果に近づいていきましょう。',
        meaningRev: '逆位置の魔術師は、能力はあるものの使い方に偏りがあったり、見せかけだけで中身が伴っていない状態を示します。人を操ろうとしたり、都合の良い情報だけを並べてごまかそうとしていると、いずれ信用を失います。また、準備不足や自信過剰で失敗しやすい時期でもあります。本質に立ち返り、誠実に、一つずつ積み上げることが大切です。',
        byGenre: {
          恋愛: {
            intro: '恋愛では、あなたの魅力や意思表示が相手に伝わり、関係を進められる力があります。',
            introRev: '恋愛では、見せかけの自分や軽い気持ちが相手に伝わっている可能性があります。'
          },
          '仕事・キャリア': {
            intro: '仕事では、スキルとアイデアを組み合わせて成果を出せる時期です。',
            introRev: '仕事では、誇張や手抜きが露見しやすい。地道な努力を。'
          },
          金運: {
            intro: '金運では、知恵と行動で収入やチャンスを増やせる流れです。',
            introRev: '金運では、甘い話や見かけに惑わされないよう注意を。'
          },
          健康: {
            intro: '健康では、生活習慣や治療法を自分で選び、整える力が高まっています。',
            introRev: '健康では、過信や自己流の判断は危険。専門家の意見を。'
          },
          人間関係: {
            intro: '人間関係では、あなたの言葉や態度が相手に強く影響する時期です。',
            introRev: '人間関係では、嘘や誇張が関係を壊す可能性があります。'
          },
          'スピリチュアル・成長': {
            intro: '成長において、内側の意志と外側の表現を一致させる学びのときです。',
            introRev: '成長において、見せかけの自分を手放し、本当の力に気づくことがテーマです。'
          }
        }
      },
      {
        id: 2,
        nameJa: '女教皇',
        nameEn: 'The High Priestess',
        shortMeaning: '直感、神秘、内なる知恵。静かに答えを待つ時期。',
        shortMeaningRev: '秘密、表面的な判断。内面と向き合う。',
        meaning: '女教皇は月の力と内なる知恵を象徴し、まだ表に出ていない真実や答えを胸に抱いて静かに座っています。このカードが正位置で出たとき、表面的な情報や世間の声よりも、あなた自身の直感や夢、無意識の声に耳を傾けることが大切だというメッセージです。焦って結論を出さず、時が来るまで待つこと、あるいは内省や瞑想、静かな時間を取ることによって、本当に必要な答えが浮かび上がってきます。秘密や未公開の事柄が鍵になることもあります。',
        meaningRev: '逆位置の女教皇は、直感を無視して表面的な判断に頼っていたり、秘密や本音を隠しすぎて誤解を招いている状態を示します。また、受動的になりすぎて自分から動くことを避けている場合もあります。内面と向き合い、隠している感情や真意を認め、必要なら信頼できる人に打ち明けることも一歩です。',
        byGenre: {
          恋愛: {
            intro: '恋愛では、相手の本心や自分の本当の気持ちを、静かに感じ取る時期です。',
            introRev: '恋愛では、本音を隠しすぎたり、相手の気持ちを勘違いしている可能性が。'
          },
          '仕事・キャリア': {
            intro: '仕事では、表に出ていない情報や直感を頼りに判断するのが吉です。',
            introRev: '仕事では、秘密や曖昧な部分が後から問題になりやすい。'
          },
          金運: {
            intro: '金運では、派手に動かすより、情報を集め静かに見極める時期です。',
            introRev: '金運では、見えないリスクに注意。直感を無視しないで。'
          },
          健康: {
            intro: '健康では、心身のサインに耳を傾け、休息や内面のケアが大切です。',
            introRev: '健康では、ストレスや不調の原因を表面だけでなく内面から見て。'
          },
          人間関係: {
            intro: '人間関係では、言葉にしない空気や相手の本音を読む力が役立ちます。',
            introRev: '人間関係では、秘密や誤解が関係を複雑にしている可能性があります。'
          },
          'スピリチュアル・成長': {
            intro: '成長において、理性より直感や内なる声を信じる学びのときです。',
            introRev: '成長において、隠していた自分や感情と向き合うことがテーマです。'
          }
        }
      },
      {
        id: 3,
        nameJa: '女帝',
        nameEn: 'The Empress',
        shortMeaning: '豊かさ、慈愛、創造、実り。自然の流れに身を任せる。',

    const SPREAD_LABELS_3 = ['過去', '現在', '未来'];

    let currentSpread = 1;
    let currentGenre = '総合';
    let drawnCards = [];

    const drawArea = document.getElementById('drawArea');
    const drawBtn = document.getElementById('drawBtn');
    const resultSection = document.getElementById('resultSection');
    const resultContent = document.getElementById('resultContent');
    const spreadLabels = document.getElementById('spreadLabels');

    document.querySelectorAll('#genreChoices .genre-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#genreChoices .genre-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentGenre = btn.dataset.genre;
        clearDraw();
      });
    });

    document.querySelectorAll('.spread-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.spread-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSpread = parseInt(btn.dataset.spread, 10);
        clearDraw();
      });
    });

    drawBtn.addEventListener('click', drawCards);

    function clearDraw() {
      drawnCards = [];
      drawArea.innerHTML = '';
      drawArea.className = 'draw-area';
      resultSection.style.display = 'none';
      drawBtn.disabled = false;
    }

    function drawCards() {
      drawBtn.disabled = true;
      drawnCards = [];
      drawArea.innerHTML = '';
      drawArea.className = 'draw-area';
      if (currentSpread === 3) drawArea.classList.add('spread-3');

      const indices = [...Array(MAJOR_ARCANA.length).keys()];
      shuffle(indices);

      const count = currentSpread === 3 ? 3 : 1;
      for (let i = 0; i < count; i++) {
        const idx = indices[i];
        const reversed = Math.random() < 0.5;
        drawnCards.push({
          ...MAJOR_ARCANA[idx],
          reversed
        });
      }

      drawnCards.forEach((card, i) => {
        const slot = document.createElement('div');
        slot.className = 'card-slot';
        const shortText = card.reversed ? (card.shortMeaningRev || card.meaningRev) : (card.shortMeaning || card.meaning);
        slot.innerHTML = `
          <div class="card ${card.reversed ? 'reversed' : ''}" data-index="${i}">
            <div class="card-face card-back"></div>
            <div class="card-face card-front">
              <span class="card-name-ja">${card.nameJa}</span>
              <span class="card-name-en">${card.nameEn}</span>
              <span class="card-meaning">${shortText}</span>
            </div>
          </div>
        `;
        const cardEl = slot.querySelector('.card');
        cardEl.addEventListener('click', () => cardEl.classList.toggle('flipped'));
        drawArea.appendChild(slot);
      });

      // 少し遅れて表向きアニメーション
      const cards = drawArea.querySelectorAll('.card');
      cards.forEach((card, i) => {
        setTimeout(() => card.classList.add('flipped'), 400 + i * 200);
      });

      showResult();

      // アニメーション後に「もう一度引く」可能に
      const maxDelay = 400 + (currentSpread === 3 ? 3 : 1) * 200 + 800;
      setTimeout(() => {
        drawBtn.disabled = false;
      }, maxDelay);
    }

    function getGenreIntro(card) {
      if (currentGenre === '総合' || !card.byGenre || !card.byGenre[currentGenre]) return '';
      const g = card.byGenre[currentGenre];
      return card.reversed ? g.introRev : g.intro;
    }

    function getLongMeaning(card) {
      const long = card.reversed ? (card.meaningRev || card.shortMeaningRev) : (card.meaning || card.shortMeaning);
      return long;
    }

    function getBirthdateMessage() {
      const input = document.getElementById('birthdate');
      const val = input && input.value ? input.value.trim() : '';
      if (!val) return '';
      const [y, m, d] = val.split('-');
      if (!y || !m || !d) return '';
      return `${parseInt(y, 10)}年${parseInt(m, 10)}月${parseInt(d, 10)}日生まれのあなたへ`;
    }

    function showResult() {
      resultSection.style.display = 'block';
      resultContent.innerHTML = '';

      const birthdateMsg = getBirthdateMessage();
      const birthdateHtml = birthdateMsg ? `<p class="birthdate-message">${birthdateMsg}</p>` : '';

      if (currentSpread === 3) {
        spreadLabels.style.display = 'flex';
        spreadLabels.innerHTML = SPREAD_LABELS_3.map((label, i) =>
          `<span>${label}: ${drawnCards[i].nameJa}${drawnCards[i].reversed ? '（逆）' : ''}</span>`
        ).join('');
        const div = document.createElement('div');
        div.innerHTML = birthdateHtml + drawnCards.map((card, i) => {
          const intro = getGenreIntro(card);
          const body = getLongMeaning(card);
          return `
          <h3>${SPREAD_LABELS_3[i]}</h3>
          ${intro ? `<p class="genre-intro">${intro}</p>` : ''}
          <p>${body}</p>
        `;
        }).join('');
        resultContent.appendChild(div);
      } else {
        spreadLabels.style.display = 'none';
        const card = drawnCards[0];
        const intro = getGenreIntro(card);
        const body = getLongMeaning(card);
        resultContent.innerHTML = `
          ${birthdateHtml}
          <h3>${card.nameJa} ${card.nameEn}${card.reversed ? '（逆位置）' : ''}</h3>
          ${intro ? `<p class="genre-intro">${intro}</p>` : ''}
          <p>${body}</p>
        `;
      }
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }
  </script>
