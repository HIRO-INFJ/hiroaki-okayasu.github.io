<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HiroOS — Hiroaki Okayasu</title>
  <meta name="description" content="Hiroaki Okayasu — Developer & Creator. HiroOS edition: a desktop in your browser." />
  <meta name="theme-color" content="#1b1740" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --b1: #ff7eb3; --b2: #7c6cff; --b3: #36d1dc; --base: #16123a;
      --glass: rgba(246,246,250,.78);
      --glass-strong: rgba(250,250,252,.92);
      --glass-dark: rgba(28,28,34,.6);
      --ink: #1d1d22;
      --ink-2: #55555f;
      --ink-3: #8a8a95;
      --line: rgba(0,0,0,.08);
      --accent: #5b5bf0;
      --radius: 14px;
      --menubar: 28px;
      --font: -apple-system, BlinkMacSystemFont, "Inter", "Hiragino Sans", "Noto Sans JP", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      --ease: cubic-bezier(.2,.8,.2,1);
      --spring: cubic-bezier(.34,1.4,.5,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--font); color: var(--ink); background: var(--base); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; font-size: 13px; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    input, textarea { font: inherit; color: inherit; user-select: text; -webkit-user-select: text; }
    a { color: var(--accent); text-decoration: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .selectable, .selectable * { user-select: text; -webkit-user-select: text; }

    /* ── icons ── */
    .ico { position: relative; flex: none; width: 52px; height: 52px; border-radius: 13px; display: grid; place-items: center;
      background: linear-gradient(150deg, var(--c1), var(--c2));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.12), 0 6px 16px rgba(0,0,0,.22); }
    .ico svg { width: 54%; height: 54%; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
    .ico.sm { width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
    .ico .badge { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
    .ico .badge svg { width: 12px; height: 12px; stroke: #333; filter: none; }

    /* ── wallpaper ── */
    .wall { position: fixed; inset: 0; background: var(--base); overflow: hidden; transition: background 1s; }
    .wall i { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .85; transition: background 1.2s; will-change: transform; }
    .wall i:nth-child(1) { width: 60vmax; height: 60vmax; left: -12vmax; top: -18vmax; background: var(--b1); animation: drift1 26s ease-in-out infinite alternate; }
    .wall i:nth-child(2) { width: 55vmax; height: 55vmax; right: -15vmax; top: -5vmax; background: var(--b2); animation: drift2 32s ease-in-out infinite alternate; }
    .wall i:nth-child(3) { width: 50vmax; height: 50vmax; left: 20vmax; bottom: -30vmax; background: var(--b3); animation: drift3 28s ease-in-out infinite alternate; }
    .wall::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.35), transparent 60%);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.06'/></svg>"); }
    @keyframes drift1 { to { transform: translate(18vmax, 12vmax) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-14vmax, 18vmax) scale(.9); } }
    @keyframes drift3 { to { transform: translate(-10vmax, -16vmax) scale(1.2); } }
    .wall-mark { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%); text-align: center; color: rgba(255,255,255,.9); pointer-events: none; }
    .wall-mark h1 { font-weight: 200; font-size: clamp(38px, 7vw, 92px); letter-spacing: -.035em; line-height: 1; text-shadow: 0 10px 40px rgba(0,0,0,.2); }
    .wall-mark p { margin-top: 14px; font-size: 13px; letter-spacing: .32em; text-transform: uppercase; opacity: .75; }

    /* ── boot & lock ── */
    #boot { position: fixed; inset: 0; z-index: 5000; background: #000; display: grid; place-items: center; transition: opacity .6s; }
    #boot.gone { opacity: 0; pointer-events: none; }
    .boot-in { display: grid; justify-items: center; gap: 44px; }
    .boot-logo { width: 74px; height: 74px; border-radius: 20px; display: grid; place-items: center; font-weight: 700; font-size: 38px; color: #000; background: #fff; letter-spacing: -.05em; }
    .boot-bar { width: 180px; height: 5px; border-radius: 99px; background: #333; overflow: hidden; }
    .boot-bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: inherit; transition: width .25s ease-out; }

    #lock { position: fixed; inset: 0; z-index: 4000; display: flex; flex-direction: column; align-items: center; color: #fff; padding: 12vh 16px 10vh; cursor: pointer;
      -webkit-backdrop-filter: blur(30px) saturate(140%); backdrop-filter: blur(30px) saturate(140%); background: rgba(10,10,30,.2);
      transition: opacity .7s var(--ease), transform .7s var(--ease); }
    #lock.gone { opacity: 0; transform: scale(1.06); pointer-events: none; }
    .lock-date { font-size: 20px; font-weight: 500; opacity: .9; }
    .lock-time { font-size: clamp(72px, 16vw, 150px); font-weight: 600; letter-spacing: -.04em; line-height: 1; margin-top: 4px; font-variant-numeric: tabular-nums; text-shadow: 0 10px 50px rgba(0,0,0,.18); }
    .lock-user { margin-top: auto; display: grid; justify-items: center; gap: 10px; }
    .lock-user img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,.6); box-shadow: 0 10px 30px rgba(0,0,0,.3); }
    .lock-user b { font-size: 15px; font-weight: 600; }
    .lock-pass { width: 190px; height: 32px; border-radius: 99px; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,.8); }
    .lock-pass i { width: 7px; height: 7px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform .15s var(--spring); }
    .lock-pass i.on { transform: scale(1); }
    .lock-hint { font-size: 11.5px; opacity: .65; }

    /* ── menubar ── */
    .menubar { position: fixed; top: 0; left: 0; right: 0; height: var(--menubar); z-index: 3000; display: flex; align-items: center; gap: 4px; padding: 0 10px; color: #fff; font-size: 13px;
      background: rgba(20,16,50,.28); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); }
    .mb-item { height: 22px; padding: 0 9px; border-radius: 5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .mb-item:hover, .mb-item.open { background: rgba(255,255,255,.2); }
    .mb-logo { font-weight: 800; font-size: 15px; letter-spacing: -.04em; }
    .mb-app { font-weight: 700; }
    .mb-deco { opacity: .92; }
    .mb-right { margin-left: auto; display: flex; align-items: center; gap: 2px; }
    .mb-right svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .mb-design { background: rgba(255,255,255,.16); font-weight: 600; font-size: 11.5px; letter-spacing: .04em; }
    .batt { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
    .batt b { position: relative; width: 22px; height: 11px; border: 1.3px solid rgba(255,255,255,.85); border-radius: 3px; }
    .batt b::after { content: ""; position: absolute; right: -3.5px; top: 3px; width: 2px; height: 3.5px; border-radius: 0 1px 1px 0; background: rgba(255,255,255,.85); }
    .batt b i { position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: calc((100% - 3px) * var(--lvl, .82)); border-radius: 1.5px; background: #fff; }
    @media (max-width: 720px) { .mb-deco, .mb-hide-sm { display: none; } }

    .menu { position: fixed; z-index: 3100; min-width: 230px; padding: 5px; border-radius: 10px; color: var(--ink); font-size: 13px;
      background: rgba(240,240,245,.82); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
      box-shadow: 0 0 0 .5px rgba(0,0,0,.15), 0 14px 40px rgba(0,0,0,.28); opacity: 0; transform: scale(.97); transform-origin: top left; pointer-events: none; transition: opacity .12s, transform .12s; }
    .menu.open { opacity: 1; transform: none; pointer-events: auto; }
    .menu button { display: flex; width: 100%; justify-content: space-between; gap: 20px; padding: 5px 10px; border-radius: 5px; text-align: left; }
    .menu button:hover { background: var(--accent); color: #fff; }
    .menu button kbd { font-family: var(--font); opacity: .5; }
    .menu hr { border: 0; height: 1px; background: rgba(0,0,0,.1); margin: 5px 8px; }

    /* ── desktop icons ── */
    .desk-icons { position: fixed; top: calc(var(--menubar) + 18px); right: 18px; z-index: 5; display: grid; gap: 10px; justify-items: center; }
    .desk-icon { width: 92px; padding: 6px 4px; border-radius: 8px; display: grid; justify-items: center; gap: 6px; color: #fff; font-size: 12px; font-weight: 500; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    .desk-icon.sel { background: rgba(255,255,255,.18); }
    .desk-icon.sel span { background: var(--accent); border-radius: 4px; padding: 0 5px; text-shadow: none; }
    .desk-icon.trash { position: fixed; right: 18px; bottom: 96px; }
    @media (max-width: 720px) { .desk-icons { display: none; } .desk-icon.trash { display: none; } }

    /* ── windows ── */
    #windows { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    .win { position: absolute; pointer-events: auto; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; resize: both;
      min-width: 320px; min-height: 220px; max-width: 100vw; max-height: calc(100vh - var(--menubar));
      background: var(--glass); -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
      box-shadow: 0 0 0 .5px rgba(0,0,0,.22), 0 1px 0 rgba(255,255,255,.6) inset, 0 24px 70px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.14);
      transform-origin: center; animation: winIn .38s var(--spring); }
    .win.inactive { box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 14px 40px rgba(0,0,0,.2); }
    .win.inactive .titlebar .lights button { background: #cfcfd4 !important; }
    .win.closing { animation: winOut .2s ease-in forwards; }
    .win.minimizing { transition: transform .45s cubic-bezier(.6,0,.3,1), opacity .45s; opacity: 0; pointer-events: none; }
    .win.min { display: none; }
    .win.max { left: 0 !important; top: var(--menubar) !important; width: 100vw !important; height: calc(100vh - var(--menubar) - 84px) !important; border-radius: 0 0 12px 12px; resize: none; }
    .win.dragging { transition: none; }
    @keyframes winIn { from { opacity: 0; transform: scale(.9) translateY(10px); } }
    @keyframes winOut { to { opacity: 0; transform: scale(.94); } }
    .titlebar { position: relative; flex: none; height: 40px; display: flex; align-items: center; padding: 0 14px; gap: 12px; cursor: default; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.35); touch-action: none; }
    .titlebar .lights { display: flex; gap: 8px; }
    .titlebar .lights button { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
    .titlebar .lights button svg { width: 8px; height: 8px; stroke: rgba(0,0,0,.55); stroke-width: 2.2; fill: none; opacity: 0; }
    .titlebar .lights:hover svg { opacity: 1; }
    .l-close { background: #ff5f57; } .l-min { background: #febc2e; } .l-max { background: #28c840; }
    .titlebar .ttl { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; white-space: nowrap; pointer-events: none; max-width: 60%; overflow: hidden; }
    .win-body { flex: 1; min-height: 0; overflow: auto; position: relative; }
    .win.dark { background: rgba(24,24,30,.86); color: #e8e8ee; }
    .win.dark .titlebar { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.08); }
    .win.dark .titlebar .ttl { color: #b8b8c4; }
    @media (max-width: 720px) {
      .win, .win.max { left: 6px !important; right: 6px; top: calc(var(--menubar) + 6px) !important; width: auto !important; height: auto !important; bottom: 88px; resize: none; min-width: 0; border-radius: 14px; }
    }

    /* ── dock ── */
    .dock-wrap { position: fixed; left: 0; right: 0; bottom: 8px; z-index: 2000; display: flex; justify-content: center; pointer-events: none; padding: 0 8px; }
    .dock { pointer-events: auto; display: flex; align-items: flex-end; gap: 6px; padding: 7px 8px; border-radius: 22px; max-width: 100%; overflow-x: auto; overflow-y: visible; scrollbar-width: none;
      background: rgba(255,255,255,.22); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
      box-shadow: 0 0 0 .5px rgba(255,255,255,.35) inset, 0 10px 40px rgba(0,0,0,.25); }
    .dock::-webkit-scrollbar { display: none; }
    .dock-item { position: relative; flex: none; width: 52px; height: 52px; transition: width .18s var(--ease), height .18s var(--ease); display: flex; align-items: flex-end; justify-content: center; }
    .dock-item .ico { width: 100%; height: 100%; border-radius: 23%; transition: transform .2s; }
    .dock-item:active .ico { filter: brightness(.8); }
    .dock-item.bounce .ico { animation: bounce .6s var(--ease) 2; }
    @keyframes bounce { 40% { transform: translateY(-18px); } }
    .dock-item .dot { position: absolute; bottom: -5px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: rgba(255,255,255,.9); opacity: 0; }
    .dock-item.running .dot { opacity: 1; }
    .dock-item .tip { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 6px; background: rgba(30,30,36,.8); color: #fff; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
    .dock-item:hover .tip { opacity: 1; }
    .dock-sep { flex: none; width: 1px; height: 44px; align-self: center; background: rgba(255,255,255,.35); margin: 0 4px; }
    @media (max-width: 720px) { .dock-item { width: 44px !important; height: 44px !important; } .dock { gap: 8px; } .dock-item .tip { display: none; } }

    /* ── notification, spotlight, ctx ── */
    .notif { position: fixed; top: calc(var(--menubar) + 10px); right: 12px; z-index: 3200; width: min(360px, calc(100vw - 24px)); padding: 12px 14px; border-radius: 16px; display: flex; gap: 12px; align-items: flex-start;
      background: rgba(245,245,250,.8); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
      box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 14px 40px rgba(0,0,0,.25); transform: translateX(calc(100% + 30px)); transition: transform .55s var(--spring); cursor: pointer; }
    .notif.show { transform: none; }
    .notif .ico { width: 36px; height: 36px; border-radius: 9px; }
    .notif b { display: block; font-size: 13px; }
    .notif p { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; margin-top: 2px; }
    .notif small { margin-left: auto; color: var(--ink-3); font-size: 11px; white-space: nowrap; }

    .spot-bg { position: fixed; inset: 0; z-index: 3500; display: none; }
    .spot-bg.open { display: block; }
    .spot { position: fixed; left: 50%; top: 20vh; transform: translateX(-50%); width: min(640px, calc(100vw - 24px)); border-radius: 16px; overflow: hidden; z-index: 3501;
      background: rgba(240,240,246,.82); -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
      box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 30px 80px rgba(0,0,0,.35); animation: winIn .25s var(--spring); }
    .spot-in { display: flex; align-items: center; gap: 12px; padding: 14px 18px; }
    .spot-in svg { width: 22px; height: 22px; stroke: var(--ink-3); fill: none; stroke-width: 2; }
    .spot-in input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 22px; font-weight: 300; }
    .spot-res { border-top: 1px solid var(--line); max-height: 50vh; overflow: auto; padding: 6px; }
    .spot-res:empty { display: none; }
    .spot-res button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; }
    .spot-res button .ico { width: 30px; height: 30px; border-radius: 8px; }
    .spot-res button small { margin-left: auto; color: var(--ink-3); }
    .spot-res button.act { background: var(--accent); color: #fff; }
    .spot-res button.act small { color: rgba(255,255,255,.75); }

    /* ── app: about ── */
    .about-app { padding: 28px 30px 26px; display: grid; grid-template-columns: 150px 1fr; gap: 26px; }
    .about-app .pic { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    .about-app h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
    .about-app .role { color: var(--ink-3); font-size: 13px; margin: 2px 0 12px; }
    .about-app p.bio { font-size: 13px; line-height: 1.85; color: var(--ink-2); margin-bottom: 10px; }
    .spec { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 12px; margin: 14px 0 16px; }
    .spec dt { color: var(--ink-3); text-align: right; font-weight: 500; }
    .tagrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .chip { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; background: rgba(0,0,0,.06); color: var(--ink-2); }
    .btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn { padding: 6px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; background: rgba(255,255,255,.9); box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.08); }
    .btn:hover { background: #fff; }
    .btn.primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
    .btn.primary:hover { filter: brightness(1.08); }
    @media (max-width: 560px) { .about-app { grid-template-columns: 1fr; justify-items: start; padding: 22px; } .about-app .pic { width: 110px; height: 110px; } }

    /* ── app: skills ── */
    .skills-app { padding: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .sk { padding: 16px; border-radius: 12px; background: rgba(255,255,255,.7); box-shadow: 0 0 0 .5px rgba(0,0,0,.08); }
    .sk-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .sk-h .ico { width: 30px; height: 30px; border-radius: 8px; }
    .sk-h b { font-size: 14px; }
    .sk p { font-size: 12.5px; color: var(--ink-2); line-height: 1.7; margin-bottom: 12px; }
    .meter { display: grid; grid-template-columns: 90px 1fr 34px; gap: 8px; align-items: center; font-size: 11.5px; margin-top: 6px; }
    .meter span:first-child { color: var(--ink-2); }
    .meter i { height: 6px; border-radius: 99px; background: rgba(0,0,0,.07); overflow: hidden; }
    .meter i b { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--c1), var(--c2)); transition: width 1.1s var(--ease); }
    .meter em { font-style: normal; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }

    /* ── app: finder (works) ── */
    .finder { display: grid; grid-template-columns: 170px 1fr 230px; height: 100%; }
    .f-side { padding: 14px 10px; background: rgba(0,0,0,.035); border-right: 1px solid var(--line); overflow: auto; }
    .f-side h6 { font-size: 11px; color: var(--ink-3); font-weight: 600; margin: 4px 8px 6px; }
    .f-side button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border-radius: 6px; font-size: 13px; text-align: left; }
    .f-side button.on { background: rgba(0,0,0,.08); }
    .f-side button i { width: 9px; height: 9px; border-radius: 50%; }
    .f-side button small { margin-left: auto; color: var(--ink-3); font-size: 11px; }
    .f-main { display: flex; flex-direction: column; min-width: 0; }
    .f-tool { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
    .f-tool b { font-size: 14px; }
    .f-tool input { margin-left: auto; width: 150px; padding: 4px 10px; border-radius: 7px; border: 0; background: rgba(0,0,0,.06); outline: 0; font-size: 12px; }
    .f-grid { flex: 1; overflow: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); align-content: start; gap: 10px; }
    .f-item { display: grid; justify-items: center; gap: 7px; padding: 10px 4px 8px; border-radius: 10px; font-size: 12px; text-align: center; line-height: 1.35; }
    .f-item .ico { width: 54px; height: 54px; }

    /* ================= GUITAR SYNTH (Karplus–Strong) ================= */
    function Guitar(rec) {
      const NOTE = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
      const QUAL = { '': [0, 7, 12, 16, 19], m: [0, 7, 12, 15, 19], '7': [0, 7, 10, 16, 19], maj7: [0, 7, 11, 16, 19], m7: [0, 7, 10, 15, 19] };
      const parse = (name) => { const m = name.match(/^([A-G][#b]?)(maj7|m7|m|7)?$/); const root = NOTE[m[1]]; const base = 40 + ((root - 4 + 12) % 12); return (QUAL[m[2] || ''] || QUAL['']).map(i => base + i); };
      let ctx, master, analyser, playing = false, track = 0, step = 0, nextT = 0, timer, raf;
      const $b = rec.body;
      const cache = new Map();
      function pluckBuf(midi) {
        if (cache.has(midi)) return cache.get(midi);
        const f = 440 * Math.pow(2, (midi - 69) / 12), sr = ctx.sampleRate, len = Math.floor(sr * 2.6), N = Math.round(sr / f);
        const buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
        for (let i = 0; i < N; i++) d[i] = Math.random() * 2 - 1;
        let prev = 0; for (let i = 0; i < N; i++) { d[i] = (d[i] + prev) * .5; prev = d[i]; }  // 少し丸めて柔らかい音に
        for (let i = N; i < len; i++) d[i] = .996 * .5 * (d[i - N] + d[i - N + 1]);
        cache.set(midi, buf); return buf;
      }
      function strum(chord, t, up = false, vel = 1) {
        const notes = parse(chord); if (up) notes.reverse();
        notes.forEach((m, i) => {
          const src = ctx.createBufferSource(), g = ctx.createGain();
          src.buffer = pluckBuf(m); g.gain.value = .22 * vel;
          src.connect(g).connect(master); src.start(t + i * (up ? .012 : .018));
          g.gain.setTargetAtTime(0, t + 2.2, .2);
        });
      }
      function schedule() {
        const T = TRACKS[track], beat = 60 / T.bpm;
        while (nextT < ctx.currentTime + .25) {
          const chord = T.prog[Math.floor(step / 4) % T.prog.length], sub = step % 4; // 1 コード = 2 拍（8 分 × 4）
          if (sub === 0) { strum(chord, nextT, false, 1); const at = nextT; setTimeout(() => showChord(chord, T), Math.max(0, (at - ctx.currentTime) * 1000)); }
          if (sub === 1) strum(chord, nextT, true, .45);
          if (sub === 2) strum(chord, nextT, false, .7);
          if (sub === 3) strum(chord, nextT, true, .5);
          nextT += beat / 2; step++;
        }
      }
      function showChord(chord, T) { $('.mu-chord', $b).innerHTML = `${chord}<span>${T.prog.indexOf(chord) + 1}/${T.prog.length}</span>`; }
      function draw() {
        const cv = $('canvas', $b); if (!cv) return;
        const c2 = cv.getContext('2d'), w = cv.width = cv.clientWidth * 2, h = cv.height = cv.clientHeight * 2;
        const data = new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(data);
        c2.clearRect(0, 0, w, h); const bars = 24, bw = w / bars;
        for (let i = 0; i < bars; i++) { const v = data[Math.floor(i * data.length / bars / 2)] / 255; c2.fillStyle = 'rgba(255,255,255,.75)'; c2.fillRect(i * bw + 2, h - v * h, bw - 4, v * h); }
        raf = requestAnimationFrame(draw);
      }
      function setTrack(i) {
        track = (i + TRACKS.length) % TRACKS.length; step = 0;
        $('.mu-title', $b).textContent = TRACKS[track].name; $('.mu-sub', $b).textContent = `${TRACKS[track].sub} · Key of C · ${TRACKS[track].bpm} BPM`;
        $$('.mu-list button', $b).forEach(x => x.classList.toggle('on', +x.dataset.i === track));
        if (ctx) nextT = ctx.currentTime + .05;
      }
      function play() {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          master = ctx.createGain(); master.gain.value = +$('input[type=range]', $b).value;
          const comp = ctx.createDynamicsCompressor(); analyser = ctx.createAnalyser(); analyser.fftSize = 256;
          master.connect(comp).connect(analyser).connect(ctx.destination);
        }
        ctx.resume(); playing = true; nextT = ctx.currentTime + .05;
        timer = setInterval(schedule, 60); schedule(); draw();
        $('[data-a=play]', $b).innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
        $('[data-a=play]', $b).setAttribute('aria-label', '一時停止');
      }
      function pause() {
        playing = false; clearInterval(timer); cancelAnimationFrame(raf);
        if (ctx) ctx.suspend();
        const b = $('[data-a=play]', $b); if (b) { b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>'; b.setAttribute('aria-label', '再生'); }
      }
      $('[data-a=play]', $b).addEventListener('click', () => playing ? pause() : play());
      $('[data-a=prev]', $b).addEventListener('click', () => setTrack(track - 1));
      $('[data-a=next]', $b).addEventListener('click', () => setTrack(track + 1));
      $$('.mu-list button', $b).forEach(x => x.addEventListener('click', () => { setTrack(+x.dataset.i); if (!playing) play(); }));
      $('input[type=range]', $b).addEventListener('input', (e) => { if (master) master.gain.value = +e.target.value; });
      setTrack(0);
      return { stop() { pause(); if (ctx) ctx.close(); } };
    }

    const menu = $('#menu');
    const MENUS = {
      system: [['HiroOS について', () => openApp('about')], ['システム設定…', () => openApp('settings')], ['デザインを切り替える…', () => window.DesignSwitcher && window.DesignSwitcher.open()], '-', ['再起動…', () => reboot()], ['画面をロック', () => lock(true), '⌃⌘Q']],
      file: [['新規ターミナル', () => openApp('terminal', { key: 'terminal' + Date.now() })], ['すべて閉じる', () => [...wins.keys()].forEach(close)]],
      go: [['Works', () => openApp('works')], ['Journal', () => openApp('journal')], ['secret', () => openApp('secret')], ['Trash', () => openApp('trash')]],
      window: [['すべて整列', () => tile()], ['すべてしまう', () => $$('.win:not(.min)').forEach(minimize)]],
      help: [['Spotlight を開く', () => spot(), '⌘K'], ['README を読む', () => DESK.find(d => d.id === 'readme').open()]],
      ctx: [['壁紙を変更', () => { const i = WALLS.findIndex(w => w.id === (store.get('os-wall') || 'aurora')); setWall(WALLS[(i + 1) % WALLS.length].id); }], ['デザインを切り替える…', () => window.DesignSwitcher && window.DesignSwitcher.open()], '-', ['ターミナルを開く', () => openApp('terminal')], ['ウインドウを整列', () => tile()], '-', ['このOSについて', () => openApp('settings')]],
    };
    function showMenu(name, x, y, anchor) {
      menu.innerHTML = MENUS[name].map((m, i) => m === '-' ? '<hr>' : `<button role="menuitem" data-i="${i}">${m[0]}${m[2] ? `<kbd>${m[2]}</kbd>` : ''}</button>`).join('');
      $$('button', menu).forEach(b => b.addEventListener('click', () => { hideMenu(); MENUS[name][b.dataset.i][1](); }));
      menu.style.left = Math.min(x, innerWidth - 240) + 'px'; menu.style.top = Math.min(y, innerHeight - menu.offsetHeight - 10) + 'px';
      menu.classList.add('open');
      $$('.mb-item').forEach(m => m.classList.toggle('open', m === anchor));
    }
    function hideMenu() { menu.classList.remove('open'); $$('.mb-item').forEach(m => m.classList.remove('open')); }
    $$('[data-menu]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); if (b.classList.contains('open')) return hideMenu(); const r = b.getBoundingClientRect(); showMenu(b.dataset.menu, r.left, r.bottom + 4, b); }));
    document.addEventListener('pointerdown', (e) => { if (!e.target.closest('#menu, [data-menu]')) hideMenu(); });
    document.addEventListener('contextmenu', (e) => {
      if (e.target.closest('.win, .dock, .menubar, input, textarea')) return;
      e.preventDefault(); showMenu('ctx', e.clientX, e.clientY);
    });
    $('#mb-design').addEventListener('click', () => window.DesignSwitcher && window.DesignSwitcher.open());
    $('#mb-app').addEventListener('click', () => openApp('about'));

    function tile() {
      const list = $$('.win:not(.min)', layer); if (!list.length) return;
      const cols = Math.ceil(Math.sqrt(list.length)), rows = Math.ceil(list.length / cols);
      const W = innerWidth / cols, H = (innerHeight - 28 - 90) / rows;
      list.forEach((el, i) => { el.classList.remove('max'); Object.assign(el.style, { left: (i % cols) * W + 6 + 'px', top: 34 + Math.floor(i / cols) * H + 'px', width: W - 12 + 'px', height: H - 12 + 'px' }); });
    }

    /* ── spotlight ── */
    const spotBg = $('#spot-bg'), spotIn = $('#spot-in'), spotRes = $('#spot-res');
    let spotItems = [], spotI = 0;
    function spot() { spotBg.classList.add('open'); spotIn.value = ''; renderSpot(); setTimeout(() => spotIn.focus(), 20); }
    function renderSpot() {
      const q = spotIn.value.trim().toLowerCase();
      const all = [
        ...Object.entries(APPS).filter(([k]) => !['dialog', 'secret'].includes(k)).map(([k, a]) => ({ label: a.name, sub: 'アプリ', ic: a.ic, c: a.c, run: () => openApp(k) })),
        ...WORKS.map(w => ({ label: w.name, sub: w.kind, ic: w.ic, c: w.c, run: () => launchWork(w), extra: w.desc + w.tech.join() })),
        { label: 'Matrix デザインへ', sub: 'デザイン', ic: 'term', c: ['#22c55e', '#052e16'], run: () => window.DesignSwitcher.go('matrix') },
        { label: 'Noir デザインへ', sub: 'デザイン', ic: 'note', c: ['#d6d3d1', '#44403c'], run: () => window.DesignSwitcher.go('noir') },
        { label: 'Pop デザインへ', sub: 'デザイン', ic: 'user', c: ['#fdba74', '#ea580c'], run: () => window.DesignSwitcher.go('pop') },
      ];
      spotItems = q ? all.filter(x => (x.label + x.sub + (x.extra || '')).toLowerCase().includes(q)).slice(0, 8) : all.slice(0, 6);
      spotI = 0;
      spotRes.innerHTML = spotItems.map((x, i) => `<button data-i="${i}" class="${i === 0 ? 'act' : ''}">${icon(x.ic, x.c[0], x.c[1])}<span>${esc(x.label)}</span><small>${esc(x.sub)}</small></button>`).join('');
      $$('button', spotRes).forEach(b => b.addEventListener('click', () => { closeSpot(); spotItems[b.dataset.i].run(); }));
    }
    function closeSpot() { spotBg.classList.remove('open'); }
    spotIn.addEventListener('input', renderSpot);
    spotIn.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); spotI = (spotI + (e.key === 'ArrowDown' ? 1 : -1) + spotItems.length) % spotItems.length; $$('button', spotRes).forEach((b, i) => b.classList.toggle('act', i === spotI)); }
      else if (e.key === 'Enter' && spotItems[spotI]) { closeSpot(); spotItems[spotI].run(); }
      else if (e.key === 'Escape') closeSpot();
    });
    spotBg.addEventListener('click', (e) => { if (e.target === spotBg) closeSpot(); });
    $('#mb-search').addEventListener('click', spot);
    addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); spotBg.classList.contains('open') ? closeSpot() : spot(); }
      if (e.key === 'Escape') { hideMenu(); closeSpot(); }
    });

    /* ── confetti ── */
    function confetti() {
      if (reduceMotion) return;
      const colors = ['#ff5f57', '#febc2e', '#28c840', '#5b5bf0', '#ff7eb3', '#36d1dc'];
      for (let i = 0; i < 90; i++) {
        const c = document.createElement('i'); c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
        c.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px'); c.style.setProperty('--r', (Math.random() * 900) + 'deg');
        c.style.animationDuration = 1.8 + Math.random() * 1.6 + 's'; c.style.animationDelay = Math.random() * .4 + 's';
        document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
      }
    }

    /* ── boot / lock / login ── */
    const bootEl = $('#boot'), lockEl = $('#lock');
    async function bootSeq(force) {
      if (!force && (sessionStorage.getItem('os-booted') || reduceMotion)) { bootEl.classList.add('gone'); return; }
      bootEl.classList.remove('gone');
      const bar = $('#boot-bar'); bar.style.width = '0';
      for (const p of [18, 34, 52, 71, 88, 100]) { await sleep(150 + Math.random() * 120); bar.style.width = p + '%'; }
      await sleep(300); bootEl.classList.add('gone'); sessionStorage.setItem('os-booted', '1');
    }
    let loggedIn = false;
    function lock(show) {
      loggedIn = !show;
      lockEl.classList.toggle('gone', !show);
      $('#lock-pass').innerHTML = '<span>クリックしてログイン</span>';
    }
    async function login() {
      if (loggedIn) return; loggedIn = true;
      const pass = $('#lock-pass');
      pass.innerHTML = Array.from({ length: 7 }, () => '<i></i>').join('');
      if (!reduceMotion) for (const d of $$('i', pass)) { d.classList.add('on'); await sleep(55); }
      await sleep(180);
      lockEl.classList.add('gone');
      sessionStorage.setItem('os-login', '1');
      if (!wins.size) firstRun();
    }
    lockEl.addEventListener('click', login);
    lockEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') login(); });
    addEventListener('keydown', (e) => { if (!lockEl.classList.contains('gone') && !e.metaKey && !e.ctrlKey) login(); });

    function firstRun() {
      const mob = isMobile();
      if (mob) openApp('about');
      else {
        const aw = Math.min(600, innerWidth * .45);
        openApp('works', { x: Math.max(12, innerWidth * .5 - 380), y: 96, w: Math.min(820, innerWidth - 60), h: Math.min(520, innerHeight - 200) });
        setTimeout(() => openApp('about', { x: Math.max(12, innerWidth * .5 - 460), y: 64 + 150, w: aw + 40, h: 470 }), 260);
      }
      setTimeout(() => notify('HiroOS へようこそ 👋', 'Dock やデスクトップのアイコンから開けます。⌘K で Spotlight、右クリックにも仕掛けが。'), 900);
    }

    async function reboot() {
      [...wins.keys()].forEach(k => { const r = wins.get(k); if (r.onClose) r.onClose(); r.el.remove(); wins.delete(k); });
      updateDock();
      await bootSeq(true);
      lock(true);
    }

    (async () => {
      await bootSeq(false);
      if (sessionStorage.getItem('os-login')) { lockEl.classList.add('gone'); loggedIn = true; firstRun(); }
      else setTimeout(() => lockEl.focus({ preventScroll: true }), 50);
    })();

    console.log('%cHiroOS 3.0', 'font: 700 20px -apple-system; color: #5b5bf0');
    console.log('ヒント: secret フォルダのパスワードはターミナルの `cat .hint` で。');
  })();
  </script>

  <script src="designs/switcher.js" data-current="os" data-position="hidden"></script>
</body>
